  box-shadow: 0 0 0 3px var(--c), 0 16px 36px -14px var(--c); animation: sp-hl 1900ms var(--e-std) var(--d) both; }

  0% { opacity: 0; transform: scale(0.985); }

}

[data-scene="service-planning"] .r2 > * { position: absolute; left: 0; top: 0; }

[data-scene="service-planning"] .empty { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 10px; border-radius: 10px; border: 2px dashed rgba(0,0,0,0.18);
  font-size: 20px; font-weight: 550; color: var(--ink-3); white-space: nowrap; }
[data-scene="service-planning"] .thumb { width: 54px; height: 32px; border-radius: 7px; background: #0b0b0f; display: flex; align-items: center; justify-content: center; }

@keyframes sp-blink { 50% { opacity: 0; } }

  background: var(--green-soft); color: #0e7a3c; font-size: 20px; font-weight: 650; }

[data-scene="service-planning"] .chip { display: inline-flex; align-items: center; gap: 9px; height: 40px; padding: 0 9px 0 14px; border-radius: 12px; background: #fff;
  box-shadow: 0 0 0 1.5px ${tint("#f05b8b", 40)}; font-size: 20px; font-weight: 600; color: var(--ink); white-space: nowrap;
  animation: sp-fly ${LAND}ms var(--e-emph) var(--d) both; }
[data-scene="service-planning"] .chip i { font-style: normal; font-size: 18px; font-weight: 700; color: #f05b8b; background: ${tint("#f05b8b", 14)}; border-radius: 7px; padding: 2px 6px; }

  0% { opacity: 0; transform: translate3d(var(--fx), var(--fy), 0) scale(0.9); }
  20% { opacity: 1; }

}

  animation: sp-pop 380ms var(--e-decel) ${O_OPEN}ms both, sp-close 260ms var(--e-accel) ${O_CLOSE}ms both; transform-origin: 20% 0; }
@keyframes sp-pop { from { opacity: 0; transform: translate3d(0, -12px, 0) scale(0.94); } }
@keyframes sp-close { to { opacity: 0; transform: translate3d(0, -8px, 0) scale(0.97); } }

[data-scene="service-planning"] .pop .ph small { font-size: 20px; font-weight: 500; color: var(--ink-3); }
[data-scene="service-planning"] .pop .ph span { width: 36px; height: 36px; border-radius: 10px; background: ${tint("#f05b8b", 14)}; display: flex; align-items: center; justify-content: center; }
[data-scene="service-planning"] .song { position: relative; height: ${POP.row}px; display: flex; align-items: center; gap: 12px; padding: 0 20px; font-size: 23px; font-weight: 600; }
[data-scene="service-planning"] .song + .song { border-top: 1px solid var(--hairline); }
[data-scene="service-planning"] .song .k { margin-left: auto; font-size: 20px; font-weight: 700; color: var(--ink-3); }
[data-scene="service-planning"] .song .in { position: absolute; right: 16px; top: 13px; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 999px;
  background: var(--green); color: #fff; font-size: 20px; font-weight: 650; }
[data-scene="service-planning"] .foot { position: absolute; left: 0; right: 0; bottom: 0; height: ${FOOT}px; display: flex; align-items: center; gap: 14px; padding: 0 26px;
  border-top: 1px solid var(--hairline); background: var(--surface-2); font-size: 23px; font-weight: 600; color: var(--ink-2); }
[data-scene="service-planning"] .st { position: relative; width: 34px; height: 34px; flex: none; }
[data-scene="service-planning"] .st > span { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
[data-scene="service-planning"] .msg { position: relative; flex: 1; height: 34px; }
[data-scene="service-planning"] .msg > span { position: absolute; left: 0; top: 0; line-height: 34px; white-space: nowrap; font-variant-numeric: tabular-nums; }
[data-scene="service-planning"] .msg .ok { color: #0e7a3c; }
[data-scene="service-planning"] .pile { display: flex; }
[data-scene="service-planning"] .pile .avatar { margin-left: -10px; box-shadow: 0 0 0 3px var(--surface-2); }
[data-scene="service-planning"] .play { position: absolute; left: 0; right: ${BR}px; top: 0; height: 0; z-index: 6; opacity: 0; }
[data-scene="service-planning"] .play .ln { position: absolute; left: 120px; width: ${BX - 120 + 2}px; top: -1.5px; height: 3px; background: ${ACC}; border-radius: 2px; }
[data-scene="service-planning"] .play .dot { position: absolute; left: 110px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: ${ACC}; box-shadow: 0 0 0 4px #fff, 0 4px 12px rgba(234, 88, 12, 0.5); }
`,
    html: (o) => {
      const G = geo(o);
      const w = G.rows[0];
      const times = G.rows.map((r) => `<div class="tm" style="top:${r.y + 29}px">${r.time}</div>
        <div class="node" style="top:${r.y + 22}px"><i class="${r.value ? "" : "a-pop"}" style="--d:${FILL[r.kind] || 0}ms;background:${r.c}"></i></div>`).join("");
      const songs = SONGS.map(([n, k], i) => `<div class="song">${TV.icon("music-4", 22, "rgba(11,11,15,0.45)", 2.2)}${n}<span class="k">${k}</span>
        ${i < O_PICK.length ? `<span class="in a-pop" style="--d:${O_PICK[i] + 60}ms">${TV.icon("check", 16, "#fff", 3.4)}у плані</span>` : ""}</div>`).join("");
      const owners = ["Олена", "Андрій", "Дмитро", "Іван", "Марія"].map((n) => TV.avatar(n, 40)).join("");
      const clicks = [
        TV.tap(BX + CX + 60, w.y + 73, O_OPEN, "#f05b8b"),
        ...O_PICK.map((d, k) => TV.tap(POP.x + 70, popRowY(w, k), d, "#f05b8b")),
        TV.tap(BX + CX + 60, G.rows[2].y + 73, D_TAP, "#0ea5e9"),
        TV.tap(BX + CX + 60, G.rows[3].y + 73, I_TAP, "#007aff"),
      ].join("");
      return `
<div class="split">
  ${TV.copy({ title: "Планування служіння", line: "Кожен знає свою частину." })}
  <div class="vis"><div class="mock ${o}" style="height:${G.H}px">
    <div class="board card a-rise" style="--d:250ms">
      <div class="head">
        <span class="hico">${TV.icon("list-checks", 28, "#fff", 2.4)}</span>
        <div><div class="h1">Недільне служіння</div><div class="h2">Нд, 21 вересня · 10:00</div></div>
        <span class="now a-fade" style="--d:${PH0 - 250}ms"><i></i><span class="nt">10:00</span></span>
        <span class="dur">${TV.icon("clock", 24, "currentColor", 2.2)}1:40</span>
      </div>
      <div class="axis" style="top:${G.top + 29}px;height:${G.bottom - G.top - 29}px"></div>
      ${times}
      <div class="tm" style="top:${G.bottom}px">11:40</div>
      ${G.rows.map((r) => block(r, o)).join("")}
      <div class="foot">
        <div class="st"><span class="a-outf" style="--d:${READY}ms;background:${tint(ACC, 14)}">${TV.icon("clock", 20, ACC, 2.6)}</span>
          <span class="a-pop" style="--d:${READY}ms;background:var(--green)">${TV.icon("check", 20, "#fff", 3.4)}</span></div>
        <div class="msg"><span class="a-outf cnt" style="--d:${READY}ms">Заповнено блоків: 3 з 6</span>
          <span class="ok a-fade" style="--d:${READY}ms">План зібрано — команда бачить його в боті</span></div>
        <div class="pile">${owners}</div>
      </div>
      <div class="play"><div class="ln"></div><div class="dot"></div></div>
      <div class="pop" style="top:${popTop(w)}px">
      <div class="ph"><span>${TV.icon("music-4", 20, "#f05b8b", 2.4)}</span>Пісенник<small>240 пісень</small></div>
      ${songs}
    </div>
    </div>
    ${clicks}
    ${TV.cursor("Олена", "#f05b8b", "sp-o")}
    ${TV.cursor("Дмитро", "#0ea5e9", "sp-d")}
    ${TV.cursor("Іван", "#007aff", "sp-i", "Пастор Іван")}
  </div></div>
</div>`;
    },
    tick(t, el, o) {
      const G = geo(o);
      const w = G.rows[0], v = G.rows[2], s = G.rows[3];
      const n = 3 + ["worship", "video", "sermon"].filter((k) => t >= FILL[k]).length;
      const cnt = el.querySelector(".msg .cnt"), txt = `Заповнено блоків: ${n} з 6`;
      if (cnt && cnt.textContent !== txt) cnt.textContent = txt;

      // Тема проповіді друкується літера за літерою.
      const typed = el.querySelector(".typed");
      if (typed) {
        const k = Math.round(TOPIC.length * TV.prog(t, TYPE0, TYPE1, TV.ease.linear));
        const str = TOPIC.slice(0, k);
        if (typed.textContent !== str) typed.textContent = str;
      }

      // Курсор часу: крапка на осі їде рівно (за пікселями, з м'якими краями), без тексту —
      // час 10:00 → 11:40 читається в шапці й виводиться з позиції крапки. Рамка блоку
      // не перемикається, а плавно спалахує/гасне за відстанню до крапки.
      const play = el.querySelector(".play");
      if (play) {
        const pts = [[0, G.rows[0].y]];
        let acc = 0;
        G.rows.forEach((r, i) => {
          acc += r.min;
          pts.push([acc, i < G.rows.length - 1 ? r.y + r.h + GAPB / 2 : r.y + r.h]);
        });
        const y = TV.mix(pts[0][1], pts[pts.length - 1][1], TV.prog(t, PH0, PH1, TV.ease.inout));
        let m = 100;
        for (let i = 1; i < pts.length; i++) {
          if (y <= pts[i][1]) { m = TV.mix(pts[i - 1][0], pts[i][0], (y - pts[i - 1][1]) / (pts[i][1] - pts[i - 1][1])); break; }
        }
        const vis = Math.min(TV.prog(t, PH0 - 250, PH0, TV.ease.linear), 1);
        play.style.opacity = String(vis);
        play.style.transform = `translate3d(0, ${y}px, 0)`;
        const mm = 600 + Math.round(m), lbl = `${Math.floor(mm / 60)}:${String(mm % 60).padStart(2, "0")}`;
        const nt = el.querySelector(".nt");
        if (nt && nt.textContent !== lbl) nt.textContent = lbl;
        // Рамка блоку: яскравість — від відстані крапки до блоку (0 px → 1, 28 px → 0).
        el.querySelectorAll(".blk > .ring").forEach((ring, i) => {
          const r = G.rows[i], d = y < r.y ? r.y - y : y > r.y + r.h ? y - r.y - r.h : 0;
          const o = (vis * TV.clamp(1 - d / 28)).toFixed(3);
          if (ring.style.opacity !== o) ring.style.opacity = o;
        });
      }

      const at = (x, y) => [x - 10, y - 6];
      const slot = (r) => at(BX + CX + 60, r.y + 73);
      const row = (k) => at(POP.x + 70, popRowY(w, k));
      TV.moveCursor(el.querySelector("#sp-o"), t, {
        keys: [[O_IN, 180, G.H - 50], [O_OPEN - 50, ...slot(w)], [O_OPEN + 250, ...slot(w)],
          [O_PICK[0] - 60, ...row(0)], [O_PICK[0] + 250, ...row(0)], [O_PICK[1] - 60, ...row(1)], [O_PICK[1] + 350, ...row(1)],
          [O_OUT, POP.x + 300, popRowY(w, 3) + 140]],
        show: [O_IN, O_OUT], clicks: [O_OPEN, ...O_PICK],
      });
      TV.moveCursor(el.querySelector("#sp-d"), t, {
        keys: [[D_IN, BX + 40, G.H - 40], [D_TAP - 50, ...slot(v)], [D_TAP + 300, ...slot(v)], [D_OUT, BX + CX + 140, G.H - 30]],
        show: [D_IN, D_OUT], clicks: [D_TAP],
      });
      const [sx, sy] = slot(s);
      TV.moveCursor(el.querySelector("#sp-i"), t, {
        keys: [[I_IN, 80, G.H + 20], [I_TAP - 50, sx, sy], [TYPE0, sx, sy], [TYPE1, sx + 60, sy + 40], [I_OUT, sx + 160, G.H + 10]],
        show: [I_IN, I_OUT], clicks: [I_TAP],
      });
    },
  });
})();

        port: true, cards, H: top + 4 * KH + 3 * GAP + 24,

        prch: (c) => ({ x: c.x + 20 + 80, y: c.y + 88 + 20 }),
        pick: (c) => ({ x: c.x + 20, y: c.y + 88 - 8 - 168 }),

    const KW = (W - 48 - 48) / 4, KH = 324, top = 222;
    const cards = SUN.map((_, i) => ({ x: 24 + i * (KW + 16), y: top, w: KW, h: KH }));
    return {
      port: false, cards, H: top + KH + 24,
      node: (i) => ({ x: cards[i].x + KW / 2, y: HEAD + 30 + 34 }),
      frame: (c) => ({ x: c.x + 16 + (KW - 32) / 2, y: c.y + 164 + 47 }),
      prch: (c) => ({ x: c.x + 16 + 76, y: c.y + 110 + 20 }),
      pick: (c) => ({ x: W - 24 - 260, y: c.y + 110 + 40 + 8 }),

  };

  function card(s, i, G) {
    const c = G.cards[i];
    const pre = !s.free;
    const theme = pre ? `<div class="th">${s.theme}</div>`

    const who = pre ? `<div class="pr">${TV.avatar(face(s.who), 40)}<span>${s.who}</span></div>`
      : `<div class="pr a-outf" style="--d:${SEL + 60}ms"><span class="need">${TV.icon("plus", 18, "currentColor", 2.8)}Проповідник</span></div>
         <div class="pr a-fade" style="--d:${SEL + 60}ms">${TV.avatar("Андрій", 40)}<span>Андрій М.</span></div>`;
    const frame = i === 0
      ? `<div class="fr"><div class="up a-outf" style="--d:${UP1}ms">${TV.icon("upload", 22, "currentColor", 2.4)}слайди<i class="bar"><b style="--d:${UP0 + 60}ms"></b></i></div>
          <div class="slide a-fade" style="--d:${UP1}ms"><b>${s.theme}</b><span>${s.ref}</span></div>
          <span class="okb a-pop" style="--d:${UP1 + 120}ms">${TV.icon("check", 16, "#fff", 3.4)}</span></div>`
      : `<div class="fr"><div class="up">${TV.icon("upload", 22, "currentColor", 2.4)}слайди</div></div>`;
    return `
<div class="sc a-up" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;--d:${480 + i * 110}ms">
  ${s.free ? `<div class="dash a-outf" style="--d:${PLAN}ms"></div><div class="solid a-fade" style="--d:${PLAN}ms"></div><div class="hl" style="--d:${PLAN}ms"></div>` : `<div class="solid"></div>`}
  ${theme}
  <div class="sr">${s.ref || ""}</div>
  ${who}
  ${frame}
  <div class="tx">${TV.icon("plus", 16, "currentColor", 2.8)}текст</div>
</div>`;
  }

  TV.scene({
    id: "sermons",
    dur: 10200,
    bg: "light",

[data-scene="sermons"] .board { position: absolute; inset: 0; }

[data-scene="sermons"] .cnt { margin-left: auto; height: 48px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; background: ${tint(ACC, 12)}; color: ${deep(ACC)};
  font-size: 23px; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
[data-scene="sermons"] .ln, [data-scene="sermons"] .lf { position: absolute; border-radius: 3px; }

[data-scene="sermons"] .lf { background: ${ACC}; animation: sm-fx ${LINE1 - LINE0}ms linear ${LINE0}ms both; transform-origin: 0 0; }
@keyframes sm-fx { from { transform: scaleX(0); } }
@keyframes sm-fy { from { transform: scaleY(0); } }

  animation: sm-open 320ms var(--e-decel) ${PK + 40}ms both, sm-close 240ms var(--e-accel) ${SEL + 80}ms both; }
@keyframes sm-open { from { opacity: 0; transform: translate3d(0, -10px, 0) scale(0.95); } }
@keyframes sm-close { to { opacity: 0; transform: scale(0.97); } }
[data-scene="sermons"] .pick .pl { height: 38px; padding: 0 18px; display: flex; align-items: center; font-size: 20px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
[data-scene="sermons"] .pick .op { position: relative; height: 58px; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; }
[data-scene="sermons"] .pick .op i { position: absolute; left: 6px; right: 6px; top: 3px; bottom: 3px; border-radius: 12px; background: ${tint(ACC, 12)}; }
[data-scene="sermons"] .pick .op > :not(i) { position: relative; }
`,
    html: (o) => {
      const G = geo(o);
      const n0 = G.node(0), n3 = G.node(3);
      const line = G.port
        ? `<div class="ln" style="left:${n0.x - 3}px;top:${n0.y}px;width:6px;height:${n3.y - n0.y}px"></div><div class="lf" style="left:${n0.x - 3}px;top:${n0.y}px;width:6px;height:${n3.y - n0.y}px;animation-name:sm-fy"></div>`
        : `<div class="ln" style="left:${n0.x}px;top:${n0.y - 3}px;width:${n3.x - n0.x}px;height:6px"></div><div class="lf" style="left:${n0.x}px;top:${n0.y - 3}px;width:${n3.x - n0.x}px;height:6px"></div>`;
      const nodes = SUN.map((s, i) => {
        const p = G.node(i);
        return `<div class="nd a-pop" style="left:${p.x}px;top:${p.y}px;--d:${420 + i * 110}ms">
          <span class="n0 ${s.free ? "free a-outf" : ""}" style="--d:${PLAN}ms">${s.d}</span>${s.free ? `<span class="n0 a-fade" style="--d:${PLAN}ms">${s.d}</span>` : ""}
          <span class="n1 a-pop" style="--d:${LINE0 + (i / 3) * (LINE1 - LINE0) - 60}ms">${s.d}</span></div>`;
      }).join("");
      const c3 = G.cards[3], pk = G.pick(c3);
      const f0 = G.frame(G.cards[0]), pr = G.prch(c3);
      const opt = (k) => ({ x: pk.x + 90, y: pk.y + 6 + 38 + k * 58 + 29 });
      const pick = `<div class="pick" style="left:${pk.x}px;top:${pk.y}px"><div class="pl">Проповідник</div>
        <div class="op">${TV.avatar("Іван", 38)}<span>Пастор Іван</span></div>
        <div class="op"><i class="a-fade" style="--d:${SEL - 350}ms"></i>${TV.avatar("Андрій", 38)}<span>Андрій М.</span></div></div>`;
      return `
<div class="split">
  ${TV.copy({ title: "Серії проповідей", line: "Матеріали й проповіді в одному місці." })}
  <div class="vis"><div class="mock ${o}" style="height:${G.H}px">
    <div class="board card a-rise" style="--d:250ms">
      <div class="head">
        <span class="hico">${TV.icon("book-open", 28, ACC, 2.3)}</span>
        <div><div class="h1">Проповіді</div><div class="h2">Жовтень · 4 неділі</div></div>
        <span class="cnt">Заплановано 3 з 4</span>
      </div>
      ${line}
      ${SUN.map((s, i) => card(s, i, G)).join("")}
      ${nodes}
      ${pick}
    </div>
    ${TV.tap(f0.x, f0.y, UP0, ACC)}
    ${TV.tap(pr.x, pr.y, PK, ACC)}
    ${TV.tap(opt(1).x, opt(1).y, SEL, ACC)}
    ${TV.cursor("Іван", ACC, "sm-c", "Пастор Іван")}
  </div></div>
</div>`;
    },
    tick(t, el, o) {
      const G = geo(o);
      const cnt = el.querySelector(".cnt"), ct = `Заплановано ${t >= PLAN ? 4 : 3} з 4`;
      if (cnt && cnt.textContent !== ct) cnt.textContent = ct;
      const c3 = G.cards[3], pk = G.pick(c3), f0 = G.frame(G.cards[0]), pr = G.prch(c3);
      const op = { x: pk.x + 90, y: pk.y + 6 + 38 + 58 + 29 };
      const at = (p) => [p.x - 10, p.y - 6];
      TV.moveCursor(el.querySelector("#sm-c"), t, {
        keys: [[I_IN, f0.x - 120, G.H - 30], [UP0 - 60, ...at(f0)], [UP0 + 250, ...at(f0)], [UP1 + 300, f0.x + 30, f0.y + 60],
          [PK - 60, ...at(pr)], [PK + 200, ...at(pr)], [SEL - 60, ...at(op)], [SEL + 150, ...at(op)], [I_OUT, op.x - 160, G.H - 20]],
        show: [I_IN, I_OUT],
        clicks: [UP0, PK, SEL],
      });
    },
  });
})();

</script>

  const ITEMS = [
    { icon: "users-round", c: "#0ea5e9", label: "Склад і ролі",
      vis: `<span class="avs">${TEAM.map(([n]) => TV.avatar(n, 30)).join("")}</span>` },
    { icon: "calendar-days", c: "#3b82f6", label: "Графік на жовтень",
      vis: `<span class="dts">${[4, 11, 18, 25].map((d) => `<b>${d}</b>`).join("")}</span>` },
    { icon: "chart-column", c: "#12a150", label: "Явка й навантаження", vis: `<span class="brs">${bars}</span>` },
    { icon: "music", c: "#f05b8b", label: "Пісні й тональності", vis: `<span class="sg">Величний Бог<b>G</b></span>` },
    { icon: "notebook-pen", c: "#8b5bf0", label: "Нотатки лідера", vis: `<span class="nts"><i></i><i></i></span>` },

  const tile = (it, k) => `

  TV.scene({
    id: "handover",

    bg: "light",

`,
    html: (o) => `
<div class="split${o === "port" ? "" : " flip"}">

  <div class="vis"><div class="mock">

    tick(t, el) {
      const k = CLICKS.map(([ct, x, y]) => [ct, x - 10, y - 6]);
      TV.moveCursor(el.querySelector("#hn-cur"), t, {
        keys: [
          [T.btn - 760, k[0][1] - 260, k[0][2] + 420],
          [T.btn - 40, k[0][1], k[0][2]],
          [T.btn + 500, k[0][1], k[0][2]],
          [T.pick - 560, k[1][1], k[1][2]],
          [T.pick + 160, k[1][1], k[1][2]],
          [T.pick + 800, k[1][1] - 120, k[1][2] + 360],
        ],

<script>
/* Проєкти — дошка підготовки молодіжної конференції (tools.ts → projects.mock:
   «Молодіжна конференція», «12 жовтня · 48 задач · 71% готово», колонки
   «Зробити → У роботі → Готово», картки з відповідальними й дедлайнами).
   Кожен сам пересуває свою картку: Ірина бере банери в роботу, Марія й Андрій
   закривають свої задачі — сусідні картки розступаються, лічильники колонок
   і кільце прогресу 67% → 71% (32 → 34 з 48) оновлюються на очах. */
// icons: square-kanban, check
(function () {
  const W = 900;
  const ACC = "#2563eb";
  const tint = (c, p) => `color-mix(in oklab, ${c} ${p}%, #fff)`;
  const deep = (c) => `color-mix(in oklab, ${c} 72%, #0b0b0f)`;
  const TONE = { violet: "#8b5bf0", brand: "#0069e0", amber: "#f59e0b", neutral: "#64748b", green: "#12a150" };
  const CARDS = {
    banners: { title: "Замовити банери", who: "Ірина", due: "до 3 жов", tag: "Реклама", tone: "violet" },
    volunteers: { title: "Волонтери на вхід", who: "Василь", due: "до 8 жов", tag: "Команда", tone: "brand" },
    regform: { title: "Реєстраційна форма", who: "Марія", due: "до 1 жов", tag: "Реєстрація", tone: "amber" },
    program: { title: "Програма й таймінг", who: "Андрій", due: "до 5 жов", tag: "Програма", tone: "brand" },
    sound: { title: "Звук і світло", who: "Дмитро", due: "до 10 жов", tag: "Техніка", tone: "neutral" },
    hall: { title: "Зала заброньована", who: "Наталя", tag: "Приміщення", tone: "green", done: true },
    budget: { title: "Бюджет затверджено", who: "Олена", tag: "Фінанси", tone: "green", done: true },
  };
  const COLS = [
    { title: "Зробити", c: "#94a3b8" },
    { title: "У роботі", c: "#f59e0b" },
    { title: "Готово", c: "#12a150" },
  ];
  // Стан дошки до і після кожного переміщення.
  const STAGES = [
    [["banners", "volunteers"], ["regform", "program", "sound"], ["hall", "budget"]],
    [["volunteers"], ["banners", "regform", "program", "sound"], ["hall", "budget"]],
    [["volunteers"], ["banners", "program", "sound"], ["regform", "hall", "budget"]],
    [["volunteers"], ["banners", "sound"], ["program", "regform", "hall", "budget"]],
  ];
  // Хто що тягне і коли.
  const MOVES = [
    { id: "banners", who: "Ірина", c: TONE.violet, show: [1100, 2800], grab: 1600, drop: 2350 },
    { id: "regform", who: "Марія", c: TONE.amber, show: [2950, 4650], grab: 3450, drop: 4200 },
    { id: "program", who: "Андрій", c: TONE.brand, show: [4800, 6500], grab: 5300, drop: 6050 },
  ];
  const TOTAL = 48, DONE0 = 32;

  // ── геометрія
  const HEAD = 104, PAD = 20, CGAP = 14, CW = (W - PAD * 2 - CGAP * 2) / 3;
  const CT = HEAD + 18, CHEAD = 58, IN = 12, KW = CW - IN * 2, KH = 166, KGAP = 12;
  const H = CT + CHEAD + 4 * KH + 3 * KGAP + IN + PAD;
  const colX = (c) => PAD + c * (CW + CGAP);
  const where = (stage, id) => {
    for (let c = 0; c < 3; c++) {
      const i = STAGES[stage][c].indexOf(id);
      if (i >= 0) return { x: colX(c) + IN, y: CT + CHEAD + i * (KH + KGAP) };
    }
  };
  const GRAB = { x: 56, y: 58 }; // куди в картці береться курсор

  const R = 27, CIRC = 2 * Math.PI * R;

  function card(id, i) {
    const k = CARDS[id], c = TONE[k.tone];
    const mv = MOVES.find((m) => m.id === id);
    const doneAt = mv && where(MOVES.indexOf(mv) + 1, id).x > colX(2) ? mv.drop : null;
    return `<div class="kc" data-id="${id}"><div class="in a-up" style="--d:${520 + i * 60}ms">
      <span class="ktag" style="color:${deep(c)};background:${tint(c, 14)}">${k.tag}</span>
      ${k.done ? `<b class="ok">${TV.icon("check", 16, "#fff", 3.4)}</b>` : doneAt ? `<b class="ok a-pop" style="--d:${doneAt + 60}ms">${TV.icon("check", 16, "#fff", 3.4)}</b>` : ""}
      <div class="tt">${k.title}</div>
      <div class="ft">${TV.avatar(k.who, 32)}<span>${k.who}</span>${k.due ? `<i>${k.due}</i>` : ""}</div>
    </div></div>`;
  }

  TV.scene({
    id: "projects",
    dur: 8200,
    bg: "light",
    css: `
[data-scene="projects"] .mock { position: relative; width: ${W}px; height: ${H}px; --vs: 1; --vs-port: 1; }
[data-scene="projects"] .board { position: absolute; inset: 0; overflow: hidden; }
[data-scene="projects"] .head { position: absolute; left: 0; right: 0; top: 0; height: ${HEAD}px; display: flex; align-items: center; gap: 18px; padding: 0 26px 0 28px; }
[data-scene="projects"] .hico { width: 56px; height: 56px; border-radius: 16px; background: ${tint(ACC, 14)}; display: flex; align-items: center; justify-content: center; }
[data-scene="projects"] .h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
[data-scene="projects"] .h2 { font-size: 22px; font-weight: 500; color: var(--ink-3); margin-top: 4px; }
[data-scene="projects"] .prog { margin-left: auto; display: flex; align-items: center; gap: 14px; }
[data-scene="projects"] .prog svg { display: block; transform: rotate(-90deg); }
[data-scene="projects"] .pct { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
[data-scene="projects"] .pct small { display: block; margin-top: 4px; font-size: 20px; font-weight: 550; color: var(--ink-3); letter-spacing: 0; }
[data-scene="projects"] .col { position: absolute; top: ${CT}px; width: ${CW}px; bottom: ${PAD}px; border-radius: 22px; background: var(--surface-3); }
[data-scene="projects"] .ch { position: absolute; left: 18px; right: 14px; top: 0; height: ${CHEAD}px; display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 650; letter-spacing: -0.01em; }
[data-scene="projects"] .ch i { width: 12px; height: 12px; border-radius: 50%; }
[data-scene="projects"] .ch b { margin-left: auto; min-width: 36px; height: 32px; padding: 0 10px; border-radius: 999px; background: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
[data-scene="projects"] .kc { position: absolute; left: 0; top: 0; width: ${KW}px; height: ${KH}px; }
[data-scene="projects"] .kc .in { position: absolute; inset: 0; border-radius: 16px; background: #fff; padding: 14px 16px; box-shadow: 0 0 0 1px var(--hairline), 0 2px 6px rgba(10, 20, 40, 0.06); }
[data-scene="projects"] .ktag { display: inline-block; height: 30px; line-height: 30px; padding: 0 12px; border-radius: 9px; font-size: 20px; font-weight: 650; }
[data-scene="projects"] .ok { position: absolute; right: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }
[data-scene="projects"] .tt { margin-top: 9px; font-size: 23px; line-height: 27px; font-weight: 650; letter-spacing: -0.02em; height: 54px; }
[data-scene="projects"] .ft { position: absolute; left: 16px; right: 12px; bottom: 13px; display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 550; color: var(--ink-2); white-space: nowrap; }
[data-scene="projects"] .ft i { margin-left: auto; font-style: normal; color: var(--ink-3); font-variant-numeric: tabular-nums; }
`,
    html: (o) => {
      const cols = COLS.map((c, i) => `<div class="col" style="left:${colX(i)}px"><div class="ch"><i style="background:${c.c}"></i>${c.title}<b class="n${i}">${STAGES[0][i].length}</b></div></div>`).join("");
      const ids = [].concat(...STAGES[0]);
      const taps = MOVES.map((m, k) => {
        const a = where(k, m.id), b = where(k + 1, m.id);
        return TV.tap(a.x + GRAB.x, a.y + GRAB.y, m.grab, m.c) + TV.tap(b.x + GRAB.x, b.y + GRAB.y, m.drop, m.c);
      }).join("");
      return `
<div class="split ${o === "port" ? "" : "flip"}">
  ${TV.copy({ title: "Проєкти", line: "Задачі команди не губляться між чатами." })}
  <div class="vis"><div class="mock">
    <div class="board card a-rise" style="--d:250ms">
      <div class="head">
        <span class="hico">${TV.icon("square-kanban", 30, ACC, 2.2)}</span>
        <div><div class="h1">Молодіжна конференція</div><div class="h2">12 жовтня · ${TOTAL} задач</div></div>
        <div class="prog">
          <svg width="${R * 2 + 10}" height="${R * 2 + 10}" viewBox="0 0 ${R * 2 + 10} ${R * 2 + 10}">
            <circle cx="${R + 5}" cy="${R + 5}" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="8"/>
            <circle class="ring" cx="${R + 5}" cy="${R + 5}" r="${R}" fill="none" stroke="${ACC}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/>
          </svg>
          <div class="pct"><span class="p">67%</span><small>готово</small></div>
        </div>
      </div>
      ${cols}
      ${ids.map(card).join("")}
    </div>
    ${taps}
    ${MOVES.map((m, k) => TV.cursor(m.who, m.c, `pj-c${k}`)).join("")}
  </div></div>
</div>`;
    },
    tick(t, el) {
      // Скільки переміщень уже завершено — від цього лічильники й прогрес.
      const passed = MOVES.filter((m) => t >= m.drop).length;
      for (let c = 0; c < 3; c++) {
        const b = el.querySelector(`.n${c}`), v = String(STAGES[passed][c].length);
        if (b && b.textContent !== v) b.textContent = v;
      }
      // Кільце: з'являється з нуля до 67%, далі +1 задача на кожну закриту картку.
      let done = TV.mix(0, DONE0, TV.prog(t, 700, 1700, TV.ease.emph));
      MOVES.forEach((m, k) => { if (where(k + 1, m.id).x > colX(2)) done += TV.prog(t, m.drop, m.drop + 500, TV.ease.emph); });
      const ring = el.querySelector(".ring");
      if (ring) ring.style.strokeDashoffset = String(CIRC * (1 - done / TOTAL));
      const p = el.querySelector(".pct .p"), pv = `${Math.round((done / TOTAL) * 100)}%`;
      if (p && p.textContent !== pv) p.textContent = pv;

      // Картки: активне переміщення — хто тягне, той їде за курсором; решта розступається.
      const k = MOVES.findIndex((m) => t < m.drop + 300);
      el.querySelectorAll(".kc").forEach((node) => {
        const id = node.dataset.id;
        let x, y, lift = 0;
        if (k < 0) ({ x, y } = where(MOVES.length, id));
        else {
          const m = MOVES[k], a = where(k, id), b = where(k + 1, id);
          if (id === m.id) {
            const q = TV.path(t, [[m.grab, a.x, a.y], [m.drop, b.x, b.y]]);
            x = q.x; y = q.y;
            lift = TV.prog(t, m.grab - 40, m.grab + 160, TV.ease.decel) * (1 - TV.prog(t, m.drop - 40, m.drop + 220, TV.ease.decel));
          } else {
            const q = TV.prog(t, m.grab + 150, m.drop - 60, TV.ease.inout);
            x = TV.mix(a.x, b.x, q); y = TV.mix(a.y, b.y, q);
          }
        }
        node.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${-2.5 * lift}deg) scale(${1 + 0.04 * lift})`;
        node.style.zIndex = lift > 0 ? "5" : "";
        const inner = node.firstElementChild;
        inner.style.boxShadow = lift > 0
          ? `0 0 0 1px var(--hairline), 0 ${24 * lift}px ${44 * lift}px -12px rgba(10, 30, 70, ${0.35 * lift})`
          : "";
      });

      // Курсори — по черзі, кожен тягне свою картку.
      MOVES.forEach((m, i) => {
        const a = where(i, m.id), b = where(i + 1, m.id);
        const gx = a.x + GRAB.x - 10, gy = a.y + GRAB.y - 6, dx = b.x + GRAB.x - 10, dy = b.y + GRAB.y - 6;
        const cur = el.querySelector(`#pj-c${i}`);
        TV.moveCursor(cur, t, {
          keys: [[m.show[0], gx - 60, H - 20], [m.grab - 60, gx, gy], [m.grab, gx, gy], [m.drop, dx, dy], [m.drop + 150, dx, dy], [m.show[1], dx + 40, H - 10]],
          show: m.show,
          clicks: [m.grab, m.drop],
        });
        if (cur && t > m.grab && t < m.drop - 90) cur.firstElementChild.style.transform = "scale(0.8)";
      });
    },
  });
})();

      moves: [[0, 1, 0], [D1 - 180, 1, 1], [G2 + 120, 1, 0]] },
    { id: "e2", title: "Вінчання 14 листопада", who: "Дмитро та Олена", tone: "done", done: true,

      moves: [[1760, 0, 2], [G1 + 240, 0, 1]] },
    { id: "a", title: "Зустріч із пастором", who: "Оксана Гриценко", tone: "meet", src: "bot", resp: "Андрій М.", arr: 1200, stamp: 2280,

  const A = CARDS.find((c) => c.id === "a");

  function cardHTML(c) {

    }
    // Картка «Зустріч» у «Закритих» отримує зелену галочку в мить, коли її поклали.

      ? `<i class="bar a-fade" style="background:${TONE.done};--d:${D2 + 40}ms"></i><span class="src ok a-pop" style="--d:${D2 + 40}ms">${TV.icon("check", 22, "#fff", 3.2)}</span>` : "";

  const lanes = COLS.map((n, i) => `

  // Скільки карток у колонці в мить t (картка «переїжджає» на середині руху).
  function colOf(c, t) {
    if (c.arr && t < c.arr) return -1;

    for (let i = 1; i < c.moves.length; i++) {

  function place(c, t) {

      const [mt, cc, ss, d = 520, e = TV.ease.emph] = c.moves[i];
      if (t <= mt) break;
      const p = e(TV.clamp((t - mt) / d));
      const [nx, ny] = pos(cc, ss);
      x += (nx - x) * p;
      y += (ny - y) * p;
    }
    return [x, y];
  }
  const GX = 176, GY = 34; // де Андрій тримає картку

  TV.scene({
    id: "applications",

    bg: "light",
    css: `

[data-scene="applications"] .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
[data-scene="applications"] .ttl { position: absolute; left: 22px; right: 58px; top: 16px; font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; }

`,
    html: (o) => `
<div class="split${o === "port" ? "" : " flip"}">
  ${TV.copy({ title: "Заявки", line: "Жодне звернення не губиться: у кожного є відповідальний." })}
  <div class="vis"><div class="mock">
    <div class="board card a-rise" style="--d:250ms">
      <div class="hd">${TV.icon("inbox", 30, "currentColor", 2.2)}Заявки
        <span class="free a-fade" style="--d:900ms"><span class="dot"><i class="a-pop" style="--d:${CARDS.find((c) => c.id === "c").stamp + 80}ms"></i></span>Без відповідального <b class="n">0</b></span>
      </div>
      ${lanes}
      ${CARDS.map(cardHTML).join("")}
    </div>
    ${TV.tap(pos(0, 0)[0] + GX, pos(0, 0)[1] + GY, G1 - 20, C)}
    ${TV.tap(pos(1, 0)[0] + GX, pos(1, 0)[1] + GY, G2 - 20, C)}
    ${TV.cursor("Андрій", C, "ap-cur")}
  </div></div>
</div>`,
    tick(t, el) {
      for (const c of CARDS) {
        const w = el.querySelector(`#ap-${c.id}`);
        if (!w) continue;
        let [x, y] = place(c, t);
        let op = 1, extra = "";
        if (c.arr) {
          const p = TV.prog(t, c.arr, c.arr + 520, TV.ease.decel);
          op = TV.prog(t, c.arr, c.arr + 200, TV.ease.linear);
          y -= 70 * (1 - p);
          extra = ` scale(${0.94 + 0.06 * p})`;
        }
        if (c.drag) {
          const lift = Math.max(
            TV.prog(t, G1 - 60, G1 + 120) * (1 - TV.prog(t, D1 - 60, D1 + 160)),
            TV.prog(t, G2 - 60, G2 + 120) * (1 - TV.prog(t, D2 - 60, D2 + 160)));
          extra += ` rotate(${2.2 * lift}deg) scale(${1 + 0.04 * lift})`;
          const cd = w.firstElementChild;
          if (cd) cd.style.boxShadow = `0 0 0 1px rgba(0,0,0,0.07), 0 ${6 + 26 * lift}px ${16 + 36 * lift}px -${8 + 8 * lift}px rgba(20,30,90,${0.18 + 0.3 * lift})`;
        }
        w.style.transform = `translate3d(${x}px, ${y}px, 0)${extra}`;
        w.style.opacity = String(op);
      }
      // Лічильники колонок і «без відповідального».
      el.querySelectorAll(".cnt").forEach((n) => {
        const k = String(CARDS.filter((c) => colOf(c, t) === +n.dataset.col).length);
        if (n.textContent !== k) n.textContent = k;
      });
      const free = String(CARDS.filter((c) => c.stamp && t >= c.arr && t < c.stamp).length);
      const b = el.querySelector(".free .n");
      if (b && b.textContent !== free) b.textContent = free;
      // Андрій: з-за краю до картки, тягне її двічі, відпускає.
      const [a0x, a0y] = pos(0, 0), [a1x, a1y] = pos(1, 0), [a2x, a2y] = pos(2, 0);
      TV.moveCursor(el.querySelector("#ap-cur"), t, {
        keys: [
          [G1 - 760, a0x + GX + 260, a0y + GY + 520],
          [G1 - 60, a0x + GX - 10, a0y + GY - 6],
          [G1, a0x + GX - 10, a0y + GY - 6],
          [D1, a1x + GX - 10, a1y + GY - 6],
          [G2, a1x + GX - 10, a1y + GY - 6],
          [D2, a2x + GX - 10, a2y + GY - 6],
          [D2 + 600, a2x + GX + 40, a2y + GY + 260],
        ],
        show: [G1 - 760, D2 + 560],
        clicks: [G1 - 20, G2 - 20],
      });
    },
  });

<script>
/* Посилання — QR на афіші літнього табору (дані з tools.ts → links: mock, pipeline).
   Тарас наводить телефон на QR: рамка ловить код, лічильник сканів 311 → 312,
   відкривається /табір, він вписує ім'я і реєструється. Реєстрація злітає
   з телефона в «Посилання», лічильник 95 → 96, рядок з'являється зверху. */
// icons: link-2, tent, check, chevron-right, qr-code, camera
(function () {
  const C = "#10b981";
  const DEEP = "color-mix(in oklab, #10b981 72%, #022c22)";
  const tint = (p) => `color-mix(in oklab, ${C} ${p}%, #fff)`;
  const W = 890, H = 930;
  const PW = 440;                       // ширина афіші й панелі
  const PX = W - 390, PY = 43;          // телефон
  const SX = PX + 11, SY = PY + 11;     // екран телефона

  // Декоративний QR: 25×25 модулів, три шукачі, решта — детермінований шум.
  const QR = (() => {
    const N = 25;
    let s = 20260930;
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    const on = (x, y) => {
      const f = (fx, fy) => {
        const dx = x - fx, dy = y - fy;
        if (dx < -1 || dy < -1 || dx > 7 || dy > 7) return null;
        if (dx === -1 || dy === -1 || dx === 7 || dy === 7) return false;
        const r = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));
        return r !== 2;
      };
      for (const [fx, fy] of [[0, 0], [N - 7, 0], [0, N - 7]]) { const v = f(fx, fy); if (v !== null) return v; }
      if (y === 6) return x % 2 === 0;
      if (x === 6) return y % 2 === 0;
      if (x >= 16 && x <= 20 && y >= 16 && y <= 20) return Math.max(Math.abs(x - 18), Math.abs(y - 18)) !== 1;
      return rnd() < 0.5;
    };
    let d = "";
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (on(x, y)) d += `M${x} ${y}h1v1h-1z`;
    return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}" fill="#0b0b0f"/></svg>`;
  })();

  // Кожна дія — щонайменше 1,2 с після попередньої.
  const T = {
    lock: 2000,      // рамка зловила код
    pill: 2200,      // з'явилось посилання
    open: 3200,      // тап по посиланню
    field: 3450, t0: 3520, t1: 4120,   // поле вже у фокусі — ім'я друкується саме
    reg: 4600,       // «Зареєструватись»
  };
  const FLY = 820, LAND = T.reg + 260 + FLY;
  const NAME = "Тарас Бойко";

  const poster = () => `
    <div class="poster a-rise" style="--d:250ms">
      <span class="pl">Реєстрація</span>
      <span class="tent">${TV.icon("tent", 76, "rgba(255,255,255,0.28)", 1.7)}</span>
      <div class="pt">Літній табір</div>
      <div class="qr">${QR}</div>
      <div class="pu">${TV.icon("link-2", 34, "currentColor", 2.4)}/табір</div>
    </div>`;

  const brackets = (cls, d) => `<span class="br ${cls}" style="--d:${d}ms"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></span>`;

  const phone = () => `
    <div class="phone a-rise" style="left:${PX}px;top:${PY}px;--d:420ms"><div class="scr">
      <div class="cam">
        <div class="shot"><div class="sq">${QR}</div></div>
        <i class="scan"></i>
        ${brackets("wh a-outf", T.lock)}
        ${brackets("gr", T.lock)}
        <span class="go a-pop" style="--d:${T.pill}ms">${TV.icon("link-2", 26, "currentColor", 2.4)}/табір${TV.icon("chevron-right", 24, "currentColor", 2.4)}</span>
      </div>
      <div class="page a-up" style="--d:${T.open + 60}ms">
        <div class="pg-h"><span class="pg-i">${TV.icon("tent", 34, "#fff", 2)}</span><div><div class="pg-t">Літній табір</div><div class="pg-s">Реєстрація</div></div></div>
        <div class="lbl">Ім'я та прізвище</div>
        <div class="box"><span class="val"><span class="ty"></span><i class="caret"></i></span><i class="ring"></i></div>
        <div class="reg">Зареєструватись</div>
        <i class="cover a-fade" style="--d:${T.reg + 60}ms"></i>
        <div class="done">
          <span class="okc a-pop" style="--d:${T.reg + 160}ms">${TV.icon("check", 60, "#fff", 3.2)}</span>
          <span class="okt a-up" style="--d:${T.reg + 260}ms">Записано</span>
          <span class="oks a-up" style="--d:${T.reg + 340}ms">Літній табір</span>
        </div>
      </div>
      <i class="island"></i><i class="home"></i>
    </div></div>`;

  // Число, що прокручується: старе їде вгору, нове — знизу.
  const roll = (a, b, d) => `<span class="roll"><span class="r0 lk-out" style="--d:${d}ms">${a}</span><span class="r1 lk-in" style="--d:${d}ms">${b}</span></span><span class="plus lk-plus" style="--d:${d}ms">+1</span>`;

  const panel = () => `
    <div class="stats card a-rise" style="--d:560ms">
      <div class="sh">${TV.icon("link-2", 28, C, 2.4)}Посилання<span class="sm">вересень</span></div>
      <div class="kpi" style="left:24px"><div class="kn">${roll("311", "312", T.lock + 80)}</div><div class="kl">${TV.icon("qr-code", 20, "currentColor", 2.2)}QR-сканів</div></div>
      <div class="kpi" style="left:${24 + 180 + 24}px"><div class="kn">${roll("95", "96", LAND)}</div><div class="kl">${TV.icon("check", 20, "currentColor", 2.6)}Реєстрацій</div></div>
      <div class="rows">
        <div class="row old lk-down" style="--d:${LAND - 200}ms">${TV.avatar("Ігор", 52)}<div><div class="rn">Ігор Лисенко</div><div class="rs">/основи · Instagram</div></div></div>
        <div class="row new lk-drop" style="--d:${LAND + 40}ms">${TV.avatar("Тарас", 52)}<div><div class="rn">${NAME}</div><div class="rs"><b>/табір</b> · QR-код</div></div><span class="now">щойно</span></div>
      </div>
    </div>`;

  // Політ реєстрації: з екрана телефона в рядок панелі (дві осі — дві криві).
  const FROM = [SX + 158, SY + 540], TO = [30, 600 + 214 + 22];
  const flyer = `<span class="fx" style="left:${TO[0]}px;top:${TO[1]}px;--fx:${FROM[0] - TO[0]}px;--d:${T.reg + 260}ms"><span class="fy" style="--fy:${FROM[1] - TO[1]}px"><span class="fo">${TV.avatar("Тарас", 52)}</span></span></span>`;

  const CLICKS = [[T.open, SX + 130, SY + 642], [T.reg, SX + 260, SY + 386]];

  TV.scene({
    id: "links",
    dur: 8400,
    bg: "light",
    css: `
[data-scene="links"] .mock { position: relative; width: ${W}px; height: ${H}px; --vs: 0.96; --vs-port: 1; }
[data-scene="links"] .poster { position: absolute; left: 0; top: 0; width: ${PW}px; height: 560px; border-radius: 32px; background: ${DEEP}; color: #fff; overflow: hidden;
  box-shadow: var(--shadow-card); }
[data-scene="links"] .pl { position: absolute; left: 36px; top: 34px; height: 40px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,0.16);
  display: inline-flex; align-items: center; font-size: 21px; font-weight: 600; }
[data-scene="links"] .tent { position: absolute; right: 28px; top: 26px; }
[data-scene="links"] .pt { position: absolute; left: 0; right: 0; text-align: center; top: 96px; font-size: 48px; font-weight: 800; letter-spacing: -0.035em; }
[data-scene="links"] .qr { position: absolute; left: ${(PW - 300) / 2}px; top: 170px; width: 300px; height: 300px; padding: 20px; border-radius: 26px; background: #fff; }

<script>
/* База знань — документи церкви з пошуком по тексту (tools.ts → knowledge: mock,
   features, steps). Тарас, новий служитель звуку, пише в пошук «ключ від звукової»:
   плитки, де цього немає, гаснуть, у потрібній підсвічується саме це місце в тексті.
   Клік — документ розгортається з плитки, фраза підкреслюється маркером, далі
   рядок версії й замки доступу: що бачить служіння звуку, що — лише команда. */
// icons: book-open, search, hand-heart, briefcase, calendar-days, user-plus, lock, globe, play, history, chevron-right, list-checks, file-text, users-round
(function () {
  const C = "#b45309";
  const tint = (p) => `color-mix(in oklab, ${C} ${p}%, #fff)`;
  const W = 900, H = 880;
  const SB = 260;                                  // ширина бічної панелі
  const MX = SB + 24, MW = W - SB - 48;            // основна область
  const TW = (MW - 16) / 2, TH = 300, TY = 196;
  const tile = (k) => [MX + (k % 2) * (TW + 16), TY + Math.floor(k / 2) * (TH + 16)];

  const Q = "ключ від звукової";
  const T = { focus: 2100, t0: 2250, t1: 3250, dim: 2800, open: 4450, mark: 5750, ver: 6950, lock: 8150 };
  const OPEN_D = 820;
  const DOC = [SB + 12, 96, W - SB - 24, H - 96 - 12];   // куди розгортається документ

  const TYPES = {
    check: ["Чек-лист", "#12a150", "list-checks"], instr: ["Інструкція", "#0069e0", "file-text"],
    rule: ["Регламент", "#8b5bf0", "file-text"], lock: ["Обмежений", "#d97706", "lock"],
  };
  const DOCS = [
    { title: "Зустріч гостей у неділю", who: "Ірина Шевчук", type: "check" },
    { title: "Звуковий пульт: інструкція", who: "Дмитро Лис", type: "instr", hit: true },
    { title: "Правила волонтерів табору", who: "Наталя Рудь", type: "rule" },
    { title: "Політика захисту дітей", who: "лише команда", type: "lock" },
  ];
  const HIT = DOCS.findIndex((d) => d.hit);

  const paper = (d, k) => {
    const lines = [0.92, 0.7, 0.84, 0.55].map((w, i) => `<i class="ln" style="top:${58 + i * 22}px;width:${Math.round(w * (TW - 48))}px"></i>`).join("");
    const snip = d.hit ? `<span class="snip a-pop" style="--d:${T.dim + 200}ms"><mark>Ключ від звукової</mark></span>` : "";
    const [lab, col, ic] = TYPES[d.type];
    return `<div class="pap"><span class="ty" style="color:${col};background:color-mix(in oklab, ${col} 13%, #fff)">${TV.icon(ic, 18, "currentColor", 2.4)}${lab}</span>${lines}${snip}</div>`;
  };
  const tiles = () => DOCS.map((d, k) => {
    const [x, y] = tile(k);
    const dim = d.hit ? "" : ` kn-dim" style="--d:${T.dim + k * 40}ms`;
    return `<div class="tl a-up" style="left:${x}px;top:${y}px;--d:${560 + k * 80}ms"><div class="tli${dim}">
      ${paper(d, k)}
      <div class="tt">${TV.esc(d.title)}</div>
      <div class="ta">${d.type === "lock" ? TV.icon("lock", 18, "currentColor", 2.4) : ""}${TV.esc(d.who)}</div>
      ${d.hit ? `<i class="hitr" style="--d:${T.dim + 120}ms"></i>` : ""}
    </div></div>`;
  }).join("");

  const SECTIONS = [
    { icon: "hand-heart", name: "Служіння", sub: "служіння звуку", subIcon: "users-round" },
    { icon: "briefcase", name: "Команда", sub: "лише команда", subIcon: "lock" },
    { icon: "calendar-days", name: "Події" },
    { icon: "user-plus", name: "Для новеньких", sub: "вся церква", subIcon: "globe" },
  ];
  const side = () => SECTIONS.map((s, k) => `
    <div class="sc" style="top:${24 + k * 92}px">
      ${k === 0 ? `<i class="act a-fade" style="--d:${T.open + 300}ms"></i>` : ""}
      <span class="si">${TV.icon(s.icon, 24, "currentColor", 2.2)}</span><span class="sn">${s.name}</span>
      ${s.sub ? `<span class="ss a-pop" style="--d:${T.lock + (k === 1 ? 0 : k === 0 ? 120 : 240)}ms">${TV.icon(s.subIcon, 17, "currentColor", 2.4)}${s.sub}</span>` : ""}
    </div>`).join("");

  const doc = () => `
    <div class="doc" id="kn-doc">
      <div class="dci">
        <div class="crumb">Служіння ${TV.icon("chevron-right", 18, "currentColor", 2.4)} Служіння звуку</div>

          <span class="ty" style="color:#0069e0;background:color-mix(in oklab, #0069e0 13%, #fff)">${TV.icon("file-text", 18, "currentColor", 2.4)}Інструкція</span>
          <span class="ver a-left" style="--d:${T.ver}ms">${TV.icon("history", 20, "currentColor", 2.3)}змінив ${TV.avatar("Дмитро", 30)}<b>Дмитро Лис</b> · 2 тижні тому</span>
        </div>
        <span class="acc a-pop" style="--d:${T.lock}ms">${TV.icon("lock", 20, "currentColor", 2.4)}бачить служіння звуку</span>
        <div class="bd">
          <div class="h2"><span class="mk" style="--d:${T.mark}ms"></span><span class="hx">Ключ від звукової</span></div>
          <i class="ln2" style="width:92%"></i><i class="ln2" style="width:71%"></i>
          <div class="h2">Як увімкнути проєктор</div>
          <i class="ln2" style="width:86%"></i><i class="ln2" style="width:58%"></i>
          <div class="vid"><span class="vp">${TV.icon("play", 34, "#fff", 2.2)}</span></div>
          <div class="vc">Відео для нових служителів</div>
        </div>
      </div>
    </div>`;

  const [hx, hy] = tile(HIT);
  const CLICKS = [[T.focus, MX + MW - 180, 140], [T.open, hx + TW / 2 + 40, hy + 120]];

  TV.scene({
    id: "knowledge",

<script>
/* Telegram-бот — телефон із чатом бота церкви «Нове Життя».
   Уся копія дослівно з src/content/telegram.ts (а там — з my-church-backend/src/telegram):
   спершу служіння — «Будете?» → «✅ Буду» → «✅ Ви будете» (serving-text.util.ts);
   бот «друкує…» і шле явку — «Присутніх: 9/13» → «✅ Були всі» → 13/13 (attendance.handler.ts).
   Один курсор — Андрій: лідер домашньої групи і звукорежисер (привітання в герої /telegram). */
// icons: bot, chevron-left, ellipsis-vertical, menu, smile, paperclip
(function () {
  const ID = "telegram-bot";
  const C = "#229ed9";
  // Корпус — пропорції iPhone (390 × 844), збільшені до 440 × 952; радіус ≈ 56 → 63.
  const PW = 440, PH = 952;
  // Екран: грань 3 + рамка 10. Статусбар 54, шапка 74, поле вводу 64, смужка Home 26.
  const CHAT_BOTTOM = 13 + 54 + 74 + (PH - 26 - 54 - 74 - 64 - 26) - 14; // 835 — низ стрічки
  const G2 = 100 + 8 + 50 * 3 + 8 * 2 + 8 + 50; // висота повідомлення про явку з кнопками = 332
  const SHIFT = G2 + 14;

  const T = { b1: 1000, tap1: 2400, type: 3100, b2: 3900, tap2: 5300 };
  const X0 = 13 + 14, XW = PW - 26 - 28; // ліва межа стрічки і її ширина (386)
  const TAP1 = { x: X0 + (XW - 8) / 4, y: CHAT_BOTTOM - 26 };   // «✅ Буду»
  const TAP2 = { x: X0 + XW / 2, y: CHAT_BOTTOM - 25 };         // «✅ Були всі»

  const PEOPLE = [
    { name: "Ірина Гнатюк", icon: "✅" },
    { name: "Олег Сердюк", icon: "❌" },
    { name: "Марія Ткачук", icon: "✅" },
    { name: "Павло Кравець", icon: "⏰" },
    { name: "Ніна Лисенко", icon: "📗" },
    { name: "Тарас Бойко", icon: "❓" },
  ];
  const flipAt = (i) => T.tap2 + 60 + i * 90;
  const flips = PEOPLE.map((p, i) => (p.icon === "✅" ? null : flipAt(i))).filter(Boolean);
  const ALL_DONE = flipAt(PEOPLE.length - 1) + 120;

  const person = (p, i) => {

    ${TV.cursor("Тарас", "#12a150", "as-cur", "Лідер")}
  </div></div>
</div>`,
    tick(t, el) {
      // Набір у полі: по літері; після «надіслати» поле порожнє.
      const draft = (q, [a, b], send) => (t >= a && t < send ? q.slice(0, Math.round(q.length * TV.prog(t, a, b, TV.ease.linear))) : null);
      const d = draft(Q1, T.type1, T.send1) ?? draft(Q2, T.type2, T.send2) ?? "";
      const tx = el.querySelector(".field .tx");
      if (tx && tx.textContent !== d) tx.textContent = d;
      const ph = el.querySelector(".field .ph");
      if (ph) ph.style.opacity = d ? "0" : "1";
      // «друкує…» у шапці, поки асистент відповідає.
      const typing = [T.dots1, T.dots2, T.dots3].some(([a, b]) => t >= a && t < b);
      const st = el.querySelector(".hd .st");
      const s = typing ? "друкує…" : "бот · онлайн";
      if (st && st.textContent !== s) { st.textContent = s; st.style.color = typing ? TG : ""; }
      // Прокрутка: низ останнього видимого повідомлення тримаємо над полем вводу.
      const chat = el.querySelector(".chat"), feed = el.querySelector(".feed");
      if (!chat || !feed) return;
      const VIEW = chat.clientHeight, slots = feed.children;
      let off = 0;
      for (const [t0, i, isDots] of SHOW) {
        if (t < t0) break;
        const sl = slots[i];
        const h = isDots ? sl.firstElementChild.offsetHeight : sl.offsetHeight;
        const target = Math.max(0, sl.offsetTop + h + TOP - VIEW);
        off = TV.mix(off, target, TV.prog(t, t0, t0 + 520));
      }
      feed.style.transform = `translateY(${(-off).toFixed(1)}px)`;
      // Лідер натискає «Підтвердити»: місце кнопки — з розкладки мінус прокрутка.
      const yes = el.querySelector("#as-yes"), mock = el.querySelector(".mock");
      if (!yes || !mock) return;
      let x = 0, y = 0;
      for (let n = yes; n && n !== mock; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
      // offsetTop не знає про transform стрічки: віднімаємо прокрутку.
      const bx = x + 64, by = y + 30 - off;
      const tap = el.querySelector("#as-tap");
      if (tap) { tap.style.left = bx + "px"; tap.style.top = by + "px"; }
      TV.moveCursor(el.querySelector("#as-cur"), t, {
        keys: [[T.tap - 800, PW - 30, PH - 30], [T.tap - 40, bx - 10, by - 6], [T.tap + 360, bx + 8, by + 30]],
        show: [T.tap - 800, T.tap + 420], clicks: [T.tap],
      });
    },
  });
})();

<script>
/* Аналітика та звіти — цифри як картинка (власник: «треба цифри»).

     • «Людей у церкві» 428 · «+12» «за місяць» — i18n.ts → preview.stats (+ app-preview.tsx) і audience…pastor.stats;

   Під кожним — крихітна спарклайн-лінія чи стовпчики. Наостанок «Звіт для ради · квітень»:
   пастор Іван тисне PDF — «Готуємо…» → «Готово». */
// icons: file-text, file-down, loader-circle, check
(function () {
  const ID = "analytics";
  const A = "#0891b2";                          // колір модуля
  const G = "#12a150";
  const W = 880, CW = 430, CH = 330, GAP = 20, TOP = 60, H = 932;
  const IN = [450, 1350, 2250, 3150];           // поява карток, ≈ 0,9 с одна за одною
  const T = { report: 4550, tap: 5950, done: 7150 };

  // Спарклайни — лише форма (ряди з analytics-showcase.tsx), без підписів і чисел.
  const GROWTH = [254, 261, 270, 283, 297, 312];
  const SERV = [148, 156, 151, 167, 172];
  const NUMS = [
    { label: "Людей у церкві", to: 428, chip: "+12 за місяць", c: A, spark: { kind: "line", data: GROWTH } },
    { label: "Присутніх", to: 312, chip: "+8%", c: "#0069e0", spark: { kind: "bars", data: SERV } },

  ].map((n, i) => ({ ...n, x: (i % 2) * (CW + GAP), y: TOP + Math.floor(i / 2) * (CH + GAP), at: IN[i] }));

  const SW = 170, SH = 58;
  function spark(n) {
    const d = n.spark.data, lo = Math.min(...d), hi = Math.max(...d);
    const ny = (v) => SH - 4 - ((v - lo) / (hi - lo || 1)) * (SH - 10);
    if (n.spark.kind === "line") {
      const pts = d.map((v, k) => `${(k / (d.length - 1)) * (SW - 8) + 4},${ny(v).toFixed(1)}`);
      const last = pts[pts.length - 1].split(",");
      return `<svg class="sp" width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}">
        <polyline class="ln" points="${pts.join(" ")}" pathLength="1" fill="none" stroke="${n.c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="--d:${n.at + 250}ms"/>
        <circle class="a-pop" cx="${last[0]}" cy="${last[1]}" r="8" fill="#fff" stroke="${n.c}" stroke-width="4" style="--d:${n.at + 1250}ms"/></svg>`;
    }
    const bw = (SW - (d.length - 1) * 8) / d.length;
    return `<svg class="sp" width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}">${d.map((v, k) => {
      const h = 10 + ((v - lo) / (hi - lo || 1)) * (SH - 12);
      return `<rect class="br" x="${k * (bw + 8)}" y="${SH - h}" width="${bw}" height="${h}" rx="6" fill="${k === d.length - 1 ? n.c : `color-mix(in oklab, ${n.c} 38%, #fff)`}" style="--d:${n.at + 250 + k * 90}ms"/>`;
    }).join("")}</svg>`;
  }

  const card = (n, i) => `
    <div class="num card a-up" style="left:${n.x}px;top:${n.y}px;--d:${n.at}ms">
      <div class="hd"><span class="lb"><i style="background:${n.c}"></i>${n.label}</span></div>
      <b class="big" data-i="${i}">${n.plus ? "+" : ""}0</b>
      <span class="chip a-pop" style="--d:${n.at + 1150}ms;color:${n.plus ? n.c : "#0e7a3c"};background:color-mix(in oklab, ${n.plus ? n.c : G} 12%, #fff)">${n.chip}</span>
      ${spark(n)}
    </div>`;

  const PDF = { x: 474, y: 770 + 27, w: 210, h: 56 };
  const TAP = { x: PDF.x + PDF.w / 2 - 24, y: PDF.y + PDF.h / 2 };

  const S = `[data-scene="${ID}"]`;
  TV.scene({
    id: ID,

    bg: "light",
    css: `

${S} .big { display: block; margin-top: 18px; font-size: 156px; font-weight: 800; letter-spacing: -0.055em; line-height: 0.92; font-variant-numeric: tabular-nums; color: var(--ink); }
${S} .sp { position: absolute; right: 30px; bottom: 30px; overflow: visible; }
${S} .sp .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: an-ln 1000ms var(--e-emph) var(--d) both; }
@keyframes an-ln { to { stroke-dashoffset: 0; } }
${S} .sp circle { transform-box: fill-box; transform-origin: center; }
${S} .sp .br { transform-box: fill-box; transform-origin: 50% 100%; animation: an-br 700ms var(--e-emph) var(--d) both; }
@keyframes an-br { from { transform: scaleY(0); } }
/* звіт для ради */
${S} .rep { position: absolute; left: 0; top: 770px; width: ${W}px; height: 110px; border-radius: 28px; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 28px; }

${S} .btn2 { position: absolute; top: 27px; height: ${PDF.h}px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 24px; font-weight: 650; white-space: nowrap; }
${S} .pdf { left: ${PDF.x}px; width: ${PDF.w}px; }

    html: () => `

  <div class="vis"><div class="mock">
    <span class="cap a-fade" style="--d:${IN[0] - 100}ms">Квітень · порівняно з березнем</span>
    ${NUMS.map(card).join("")}

    tick(t, el) {

  // Салют над «склянкою», що дійшла до прапорця.

  }).join("");

    html: () => `

        // Пакет із числом летить дугою від таблички до свого відрізка смуги.
        const p = el.querySelector(`#cp-p${i}`);

          const x0 = c.x + 10, y0 = c.y - 36, x2 = c.seg0 + c.segW / 2, y2 = BAR.y + BAR.h / 2;
          const cx = (x0 + x2) / 2 + (x2 > x0 ? -60 : 60), cy = Math.min(y0, y2) - 70;

          p.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${1 - 0.25 * k})`;

   Неділя, 12:00: зал, Кімната 2 і Дитяча зайняті, Зала №3 вільна. Андрій
   тягне картку групи на 13:00 у Кімнату 2 — кімната спалахує червоним
   «Зайнята: Основи віри», Зала №3 світиться зеленим «Вільна 13:00–15:00»,
   він кладе картку туди — і в шапці «Без накладок». */
// icons: clock, check
(function () {
  const A = "#8b5e3c", RED = "#e5484d", GREEN = "#12a150";
  const W = 880, H = 790;
  const X0 = 36, X1 = 844, Y0 = 100, Y1 = 760, HX = 366, CX = 446;
  const R = {
    hall: { x: X0, y: Y0, w: HX - X0, h: Y1 - Y0, c: "#0069e0" },
    kids: { x: CX, y: 100, w: X1 - CX, h: 220, c: "#f05b8b" },
    z3: { x: CX, y: 320, w: X1 - CX, h: 220 },

  const T = { hall: 1400, kids: 1700, r2: 2000, free: 2300, drag: 3000, hover: 4000, suggest: 5500, move: 6300, drop: 7000, chip: 8500 };
  const CARD = { w: 330, h: 80 };
  const P0 = { x: 880, y: 900 }, PR = { x: CX + 50, y: R.r2.y + 130 }, PZ = { x: CX + 50, y: R.z3.y + 130 };
  const GRAB = { x: 150, y: 74 };
  const tint = (c, p) => `color-mix(in oklab, ${c} ${p}%, #fff)`;
  const deep = (c) => `color-mix(in oklab, ${c} 76%, #0b0b0f)`;
  const at = (x, y, extra = "") => `left:${x}px;top:${y}px;${extra}`;
  // Шар, що з'являється в мить a і гасне в мить b (два вкладені примітиви).
  const span = (a, b, inner, cls = "") =>
    `<div class="a-fade ${cls}" style="--d:${a}ms"><div class="a-outf" style="--d:${b}ms">${inner}</div></div>`;
  const face = (who, x, y, d, size = 32) =>
    `<span class="face a-pop" style="${at(x - size / 2, y - size / 2)}--d:${d}ms">${TV.avatar(who, size)}</span>`;

  // ─── великий зал: сцена, два блоки крісел, люди на місцях
  const CH = { w: 30, h: 16, gx: 10, py: 31, rows: 10, cols: 3, aisle: 36, y: 200 };
  const blockW = CH.cols * CH.w + (CH.cols - 1) * CH.gx;
  const cx0 = X0 + (R.hall.w - (blockW * 2 + CH.aisle)) / 2;
  const chairX = (b, c) => cx0 + b * (blockW + CH.aisle) + c * (CH.w + CH.gx);

    </div></div></div>
    ${art("projector", "fly", `id="inv-fly"`)}
    ${TV.tap(A0.x, A0.y, GRAB, CUR)}${TV.tap(CARD.x, CARD.y, DROP, CUR)}
    ${TV.cursor("Оксана", CUR, "inv-c", "Адміністратор")}
  </div></div>
</div>`,
    tick(t, el) {
      const P = TV.prog, mix = TV.mix;
      const n = el.querySelector(".n"), v = String(t >= DROP + 100 && t < LAND ? 9 : 8);
      if (n && n.textContent !== v) n.textContent = v;

      // Плитка проєктора сіріє, поки він на руках.
      const g = P(t, GRAB, GRAB + 250) - P(t, LAND - 100, LAND + 200);
      const a = el.querySelector("#inv-art");
      if (a) a.style.filter = `grayscale(${g}) opacity(${1 - 0.65 * g})`;

      // Картка Андрія виростає на рядок «Проєктор · повернути до сб».
      const grow = P(t, DROP + 50, DROP + 450) - P(t, RET, RET + 400);
      const card = el.querySelector("#inv-card");
      if (card) card.style.height = `${PB + PG * grow}px`;
      const line = el.querySelector("#inv-line");
      if (line) line.style.opacity = String(grow);
      const mini = el.querySelector("#inv-mini");
      if (mini) mini.style.opacity = String(P(t, DROP + 250, DROP + 450) - P(t, RET, RET + 80));

      // Великий проєктор: їде під курсором, у картці стискається; у суботу летить назад.
      const fly = el.querySelector("#inv-fly");
      if (fly) {
        let x = A0.x, y = A0.y, s = 1, r = 0, o = 0;
        if (t >= GRAB && t < DROP) {
          const c = TV.path(t, keys); x = c.x + 10; y = c.y + 6;
          const lift = P(t, GRAB, GRAB + 250); s = 1 + 0.3 * lift; r = -5 * lift; o = 1;
        } else if (t >= DROP && t < DROP + 450) {
          const k = P(t, DROP, DROP + 400);
          x = mix(CARD.x, MINI.x, k); y = mix(CARD.y, MINI.y, k); s = mix(1.3, 60 / AW, k); r = -5 * (1 - k);
          o = 1 - P(t, DROP + 250, DROP + 450);
        } else if (t >= RET && t < LAND + 150) {
          const k = P(t, RET, LAND, TV.ease.inout);
          x = mix(MINI.x, A0.x, k); y = mix(MINI.y, A0.y, k) - 140 * Math.sin(Math.PI * k); s = mix(60 / AW, 1, k);
          o = Math.min(P(t, RET, RET + 120), 1 - P(t, LAND, LAND + 150));
        }
        fly.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${r}deg) scale(${s})`;
        fly.style.opacity = String(o);
      }

      TV.moveCursor(el.querySelector("#inv-c"), t, { keys, show: [IN, DROP + 680], clicks: [GRAB, DROP] });
    },
  });
})();

<script>
/* Кастомізація — «система підлаштується під вас» (той самий сюжет і копія, що в блоці
   на головній: src/components/sections/customization.tsx, i18n.ts → customization).
   Від малих до великих: курсор тягне повзунок «Розмір церкви» 40 → 200 → 1 200 людей, і на
   кожній зупинці картинка інша: коло облич довкола «Домашньої групи» → три служіння → три
   кемпуси-натовпи. Зліва модулі розгортаються 3 → 5 → 8, «Домашні групи» стають «Малі групи» —
   система росте разом із церквою.
   Усе, що рухається разом із повзунком, ставить tick() (лише style/textContent). */
// icons: users, building-2, flame, house, ticket, network, calculator, door-open
(function () {
  const W = 880, H = 700;
  const CUR = "#7c3aed";

  // ── час: кожна зупинка тримається ≥ 2 с
  const ENTER = 2700, GRAB1 = 3500, D1 = [3700, 5300], GRAB2 = 7900, D2 = [8000, 9600], OUT = 10400;
  const DUR = 14000;

  // ── повзунок (координати картки)
  const TX0 = 48, TW = 752, TY = 152;
  const thumbX = (p) => TX0 + p * TW;
  const pAt = (t) => {
    if (t < D1[0]) return 0;
    if (t < D1[1]) return 0.5 * TV.prog(t, D1[0], D1[1], TV.ease.inout);
    if (t < D2[0]) return 0.5;
    return 0.5 + 0.5 * TV.prog(t, D2[0], D2[1], TV.ease.inout);
  };
  // Логарифмічна шкала як на сайті: 1 200 → 200 → 40, кругло до 5/10/50.
  const peopleAt = (p) => {
    const v = 40 * Math.pow(30, p);
    const step = v >= 200 ? 50 : v >= 100 ? 10 : 5;
    return Math.round(v / step) * step;
  };
  const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

  // ── церква: 84 крапки, що перебудовуються між трьома розкладками
  const CX0 = 284, CXW = W - CX0, CY = 440;
  const XB = [0.18, 0.5, 0.82].map((f) => CX0 + f * CXW);
  const XM = [0.19, 0.5, 0.81].map((f) => CX0 + f * CXW);
  const RB = 82, RM = 56, NB = 28, NM = 12, NF = 8, DOTS = NB * 3, BASE = 80;
  const RING = { x: CX0 + CXW / 2, y: CY + 20, rx: 190, ry: 150 };
  const sun = (i, n, r) => { const rr = r * Math.sqrt((i + 0.5) / n), a = i * 2.39996; return [rr * Math.cos(a), rr * Math.sin(a)]; };
  const layout = (size, d) => {
    const cl = d % 3, k = Math.floor(d / 3);
    if (size === 0) { const [dx, dy] = sun(k, NB, RB); return { x: XB[cl] + dx, y: CY + dy, s: 20, o: 1 }; }
    if (size === 1) {
      if (k >= NM) return { x: XM[cl], y: CY, s: 0, o: 0 };
      const [dx, dy] = sun(k, NM, RM); return { x: XM[cl] + dx, y: CY + dy, s: 26, o: 1 };
    }
    if (d >= NF) return { x: RING.x, y: RING.y, s: 0, o: 0 };
    const a = (d / NF) * Math.PI * 2 - Math.PI / 2;
    return { x: RING.x + Math.cos(a) * RING.rx, y: RING.y + Math.sin(a) * RING.ry, s: BASE, o: 1 };
  };
  const L = [0, 1, 2].map((s) => Array.from({ length: DOTS }, (_, d) => layout(s, d)));
  const FACES = ["Оксана", "Марія", "Тарас", "Ніна", "Петро", "Софія", "Андрій", "Олена"];

  const SIZES = [
    { label: "Велика церква", clusters: ["Кемпус Центр", "Кемпус Схід", "Кемпус Захід"], xs: XB, y: CY + RB + 46 },
    { label: "Середня церква", clusters: ["Діти", "Молодь", "Прославлення"], xs: XM, y: CY + RM + 46 },
    { label: "Мала церква", clusters: ["Домашня група"] },
  ];

  // ── модулі збоку: у середній лишається 5, у малій — 3
  const MODS = [
    ["people", "Люди", "users", "#0ea5e9"], ["campuses", "Кемпуси", "building-2", "#0f766e"],
    ["ministries", "Служіння", "flame", "#f97316"], ["groups", "Малі групи", "house", "#0d9488"],
    ["events", "Події", "ticket", "#f59e0b"], ["org", "Оргструктура", "network", "#7c5cf0"],
    ["accounting", "Бухгалтерія", "calculator", "#059669"], ["rooms", "Кімнати", "door-open", "#8b5e3c"],
  ];
  const ON_MID = new Set(["people", "ministries", "groups", "events", "accounting"]);
  const ON_SMALL = new Set(["people", "groups", "events"]);
  const ROWH = 56;

  const cursor = {
    keys: [[ENTER, 300, 800], [GRAB1 - 40, thumbX(0) - 10, TY - 6], [D1[0], thumbX(0) - 10, TY - 6], [D1[1], thumbX(0.5) - 10, TY - 6],
      [D2[0], thumbX(0.5) - 10, TY - 6], [D2[1], thumbX(1) - 10, TY - 6], [D2[1] + 200, thumbX(1) - 10, TY - 6], [OUT, 1000, 780]],
    show: [ENTER, OUT + 60], clicks: [GRAB1, GRAB2],
  };

  const X = `[data-scene="customization"]`;
  TV.scene({
    id: "customization",
    dur: DUR,
    bg: "light",
    css: `
${X} .mock { position: relative; width: ${W}px; height: ${H}px; --vs: 1; --vs-port: 1.02; }
${X} .win { position: absolute; inset: 0; overflow: hidden; }
${X} .top { position: absolute; left: 0; right: 0; top: 0; height: 222px; border-bottom: 1px solid var(--hairline); }
${X} .cap { position: absolute; left: 48px; top: 26px; font-size: 22px; font-weight: 600; color: var(--ink-3); }
${X} .sz { position: absolute; left: 48px; top: 58px; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
${X} .cnt { position: absolute; right: 48px; top: 38px; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
${X} .cnt b { font-size: 66px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
${X} .cnt span { font-size: 28px; font-weight: 600; color: var(--ink-2); }
${X} .trk { position: absolute; left: ${TX0}px; top: ${TY - 6}px; width: ${TW}px; height: 12px; border-radius: 6px; background: var(--hairline-strong); }
${X} .fill { position: absolute; left: 0; top: 0; bottom: 0; width: ${TW}px; border-radius: 6px; background: var(--brand); transform-origin: 0 50%; }
${X} .th { position: absolute; left: 0; top: ${TY - 24}px; width: 48px; height: 48px; margin-left: -24px; }
${X} .th i { position: absolute; inset: -10px; border-radius: 50%; background: rgba(0, 105, 224, 0.18); opacity: 0; }
${X} .th b { position: absolute; inset: 0; border-radius: 50%; background: #fff; border: 7px solid var(--brand); box-shadow: 0 6px 14px -4px rgba(0,0,0,0.35); }
${X} .ends { position: absolute; left: ${TX0}px; width: ${TW}px; top: ${TY + 26}px; display: flex; justify-content: space-between; font-size: 22px; font-weight: 600; color: var(--ink-3); }
${X} .side { position: absolute; left: 0; top: 222px; bottom: 0; width: ${CX0}px; background: var(--surface-2); border-right: 1px solid var(--hairline); padding: 14px 14px 0; }
${X} .md { position: relative; overflow: hidden; height: ${ROWH}px; }
${X} .md > div { position: absolute; left: 0; right: 0; top: 0; height: ${ROWH}px; display: flex; align-items: center; gap: 14px; padding: 0 10px; border-radius: 14px; }
${X} .md .ic-b { position: relative; flex: none; width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
${X} .md .nm { position: relative; flex: 1; height: 30px; font-size: 23px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
${X} .md .nm span { position: absolute; left: 0; top: 0; }
${X} .md .nm .new { color: var(--brand); font-weight: 750; }
${X} .md .hi { position: absolute; inset: 4px 0; border-radius: 14px; background: var(--brand-soft); opacity: 0; }
${X} .dt { position: absolute; left: 0; top: 0; width: ${BASE}px; height: ${BASE}px; margin: -${BASE / 2}px 0 0 -${BASE / 2}px; border-radius: 50%; }
${X} .dt .fc { position: absolute; inset: 0; border-radius: 50%; opacity: 0; box-shadow: 0 0 0 4px #fff, 0 10px 22px -8px rgba(0,0,0,0.4); }
${X} .dt .fc .avatar { width: 100%; height: 100%; }
${X} .lb { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); font-size: 23px; font-weight: 650; color: var(--ink-2); white-space: nowrap; opacity: 0; }
${X} .pill { position: absolute; left: ${RING.x}px; top: ${RING.y}px; transform: translate(-50%, -50%); padding: 12px 24px; border-radius: 999px;
  background: var(--brand-soft); color: var(--brand); font-size: 28px; font-weight: 750; white-space: nowrap; opacity: 0; }
`,
    html: () => {
      const sizes = SIZES.map((s, i) => `<span class="sz" data-s="${i}" style="opacity:${i === 2 ? 1 : 0}">${s.label}</span>`).join("");
      const mods = MODS.map(([id, name, icon, c]) => `
        <div class="md" data-id="${id}"><div><i class="hi"></i><span class="ic-b" style="background:${c}">${TV.icon(icon, 22, "#fff", 2.3)}</span>
          <span class="nm"><span class="old">${name}</span>${id === "groups" ? `<span class="new" style="opacity:0">Домашні групи</span>` : ""}</span></div></div>`).join("");
      const dots = Array.from({ length: DOTS }, (_, d) => `
        <i class="dt" style="background:color-mix(in oklab, var(--brand) ${40 + ((d * 37) % 5) * 8}%, #fff);opacity:0">${d < NF ? `<span class="fc">${TV.avatar(FACES[d], BASE)}</span>` : ""}</i>`).join("");
      const labels = SIZES.slice(0, 2).map((s, i) => s.clusters.map((c, k) =>
        `<span class="lb" data-s="${i}" style="left:${s.xs[k]}px;top:${s.y}px">${c}</span>`).join("")).join("");
      return `
<div class="split">
  ${TV.copy({ title: "Кастомізація", line: "Система підлаштується під вас." })}
  <div class="vis"><div class="mock">
    <div class="win card a-rise" style="--d:250ms">
      <div class="top">
        <span class="cap">Розмір церкви</span>${sizes}
        <span class="cnt"><b class="n">40</b><span>людей</span></span>
        <div class="trk"><i class="fill"></i></div>
        <div class="th"><i></i><b></b></div>
        <div class="ends"><span>мала</span><span>велика</span></div>
      </div>
      <div class="side">${mods}</div>
      ${dots}${labels}
      <span class="pill">Домашня група</span>
    </div>
    ${TV.tap(thumbX(0), TY, GRAB1, CUR)}${TV.tap(thumbX(0.5), TY, GRAB2, CUR)}
    ${TV.cursor("Андрій", CUR, "cz-c", "Ви")}
  </div></div>
</div>`;
    },
    tick(t, el) {
      const p = pAt(t);
      const m1 = TV.prog(t, D1[0], D1[1], TV.ease.inout);
      const m2 = TV.prog(t, D2[0], D2[1], TV.ease.inout);
      const cl = TV.clamp;
      // Поява церкви на старті: крапки виростають одна за одною.
      const intro = (d) => TV.prog(t, 600 + (d % 28) * 22, 1100 + (d % 28) * 22, TV.ease.decel);

      // Повзунок і число людей.
      const n = el.querySelector(".n"), v = fmt(peopleAt(p));
      if (n && n.textContent !== v) n.textContent = v;
      const fill = el.querySelector(".fill"), th = el.querySelector(".th");
      if (fill) fill.style.transform = `scaleX(${p})`;
      if (th) {
        th.style.transform = `translate3d(${thumbX(p)}px, 0, 0)`;
        const grab = (t >= GRAB1 && t < D1[1] + 120) || (t >= GRAB2 && t < D2[1] + 120);
        th.firstElementChild.style.opacity = grab ? "1" : "0";
      }
      const szo = [cl((p - 0.64) / 0.08), cl((0.72 - p) / 0.08) * cl((p - 0.26) / 0.08), cl((0.34 - p) / 0.08)];
      el.querySelectorAll(".sz").forEach((s) => { s.style.opacity = String(szo[+s.dataset.s]); });

      // Модулі: висота рядка = чи лишається модуль у цій церкві.
      el.querySelectorAll(".md").forEach((r) => {
        const id = r.dataset.id;
        const f = m2 > 0 ? TV.mix(+ON_MID.has(id), 1, m2) : TV.mix(+ON_SMALL.has(id), +ON_MID.has(id), m1);
        r.style.height = `${ROWH * f}px`;
        r.style.opacity = String(f * f);
        if (id === "groups") {
          const k = 1 - cl((m1 - 0.2) / 0.3);   // «Домашні групи» у малій → «Малі групи» в середній
          r.querySelector(".old").style.opacity = String(1 - k);
          r.querySelector(".new").style.opacity = String(k);
          r.querySelector(".hi").style.opacity = String(k);
        }
      });

      // Крапки: велика → середня → мала (з легким розкидом у часі).
      el.querySelectorAll(".dt").forEach((dt, d) => {
        const lag = (d % 12) * 0.015;
        const k1 = TV.ease.inout(cl((m1 - lag) / (1 - 0.18))), k2 = TV.ease.inout(cl((m2 - lag) / (1 - 0.18)));
        const a = m2 > 0 ? L[1][d] : L[2][d], b = m2 > 0 ? L[0][d] : L[1][d], k = m2 > 0 ? k2 : k1;
        const x = TV.mix(a.x, b.x, k), y = TV.mix(a.y, b.y, k), s = TV.mix(a.s, b.s, k);
        const o = TV.mix(a.o, b.o, k) * intro(d);
        dt.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${(s * (0.4 + 0.6 * intro(d))) / BASE})`;
        dt.style.opacity = String(o);
        if (d < NF) dt.firstElementChild.style.opacity = String(1 - cl(m1 / 0.4));
      });

      // Підписи груп крапок.
      const lo = [cl((m2 - 0.65) / 0.35), cl((m1 - 0.65) / 0.35) * (1 - cl(m2 / 0.35))];
      el.querySelectorAll(".lb").forEach((l) => { l.style.opacity = String(lo[+l.dataset.s]); });
      const pill = el.querySelector(".pill");
      if (pill) pill.style.opacity = String((1 - cl(m1 / 0.35)) * TV.prog(t, 1000, 1500));

      TV.moveCursor(el.querySelector("#cz-c"), t, cursor);
    },
  });
})();

<script>
/* Рутина — «Зніми з себе рутину» (i18n.ts → automations.title/titleStrike) і чеклист
   «Було — стало» (i18n.ts → solved.cases: routine, ministries, newcomers, requests).
   Бурштинова риска перекреслює «рутину», як на сайті. Далі чотири болі стають
   у стовпчик із порожніми квадратиками; по черзі кожен отримує зелену галочку,
   біль перекреслюється й гасне, а поруч (у портреті — під ним) виїжджає, як стало. */
// icons: check, arrow-right, corner-down-right
(function () {
  const AMBER = "#f59e0b";
  const CASES = [
    ["Пишемо ті самі нагадування руками", "Нагадування йдуть самі, з журналом."],
    ["Графік служінь зводимо руками щотижня", "Видно, хто служить і де дірка."],
    ["Губимо новеньких після першого разу", "Видно кожного новенького і його крок."],
    ["Губимо прохання і потреби в чатах", "У кожного прохання є власник і статус."],
  ];
  const STRIKE = 1150;                         // риска через «рутину»
  const SHOW = 1750;                           // болі з'являються
  const TICK = (k) => 2900 + k * 1600;         // галочка кожні 1,6 с

  const row = (o) => ([pain, res], k) => {
    const t = TICK(k);
    return `
    <div class="rw a-up" style="--d:${SHOW + k * 140}ms">

<script>
/* Автоматизації — схема «ЯКЩО — ТО» великими блоками згори донизу (як на головній,
   automations.tsx; телефон із перепискою прибрано 2026-09-21).
   Два сценарії з i18n.ts → automations.recipes строго по черзі: «Новенька людина»
   і «Перед служінням» («Підсумок тижня» знято 2026-10-01 — петля коротша). Спершу лише подія — вона здригається; далі
   бурштиновий розряд біжить проводом, і кожен крок з'являється тоді, коли розряд до
   нього дійшов: схема будується сама. У кожного сценарію свій лічильник «Економить»;
   після другого — тихий рядок «Разом ≈ 65 хв на тиждень» (25 + 40). */
// icons: zap, bot, users, rocket, house, flame, megaphone, list-checks, check, x, plus, bell
(function () {
  const ID = "automations";
  const AMBER = "#f59e0b", INK = "#14100a", DEEP = "#10151f";
  const W = 820, H = 950;
  const TOP = 64, TRIG_H = 140, STEP_H = 100, WIRE = 38, AXIS = 72;
  const MOD = {
    "telegram-bot": { icon: "bot", c: "#229ed9" }, people: { icon: "users", c: "#0ea5e9" },
    onboarding: { icon: "rocket", c: "#7c5cf0" }, groups: { icon: "house", c: "#0d9488" },
    ministries: { icon: "flame", c: "#f97316" }, campaigns: { icon: "megaphone", c: "#d946ef" },
    "service-planning": { icon: "list-checks", c: "#ea580c" },
  };

  // ── обличчя з позначкою (усе, що праворуч у блоці, — ілюстрація підпису кроку)
  const badge = (color, icon, d) =>
    `<span class="bd a-pop" style="background:${color};--d:${d}ms">${icon === "?" ? "?" : TV.icon(icon, 18, "#fff", 3.4)}</span>`;
  const face = (name, extra = "", cls = "", d = null) =>
    `<span class="fc ${cls}" ${d !== null ? `style="--d:${d}ms"` : ""}>${TV.avatar(name, 50)}${extra}</span>`;
  const faces = (inner) => `<span class="faces">${inner}</span>`;
  const TEAM = ["Андрій", "Олена", "Дмитро", "Оксана", "Марко"];

  const RECIPES = [
    {
      name: "Новенька людина", when: "Нова анкета", saved: 25,
      steps: [
        { text: "Бот привітав", module: "telegram-bot", side: (l) => faces(face("Марко", badge("#229ed9", "check", l + 150))) },
        { text: "Картка створена", module: "people", side: (l) => faces(face("Марко", badge("#0ea5e9", "plus", l + 150))) },
        { text: "Задача лідеру", module: "onboarding", side: (l) => faces(face("Олена", badge("#7c5cf0", "bell", l + 150))) },
        { text: "У малій групі", module: "groups", side: (l) => faces(["Андрій", "Ірина", "Дмитро"].map((n) => face(n)).join("")

    {
      name: "Перед служінням", when: "Завтра служіння", saved: 40,
