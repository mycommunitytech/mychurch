        { text: "Нагадав кожному", module: "telegram-bot", side: (l) => faces(TEAM.map((n, k) => face(n, badge("#229ed9", "check", l + 120 + k * 80))).join("")) },
        { text: "Двоє відмовились", module: "ministries", side: (l) => faces([2, 3].map((k, j) => face(TEAM[k], badge("#ef4444", "x", l + 140 + j * 110))).join("")) },
        { text: "Шукає заміну", module: "campaigns", side: () => faces(`<span class="fc slot"><i></i></span><span class="fc slot"><i></i></span>`) },
        { text: "Графік закритий", module: "service-planning", side: (l) => faces(["Ірина", "Василь"].map((n, j) => face(n, badge("#12a150", "check", l + 260 + j * 110), "a-pop", l + 120 + j * 110)).join("")) },
      ],
    },
  ];

  // ── час (повільніше, 2026-10-01: «йдуть дуже швидко»): подія здригається ≈0,9 с, пауза 0,6 с,
  // кроки падають раз на 1,2 с, лічильник рахує 1,5 с, готова схема стоїть ≈2,3 с, перехід 0,7 с.
  const SHAKE = 500, PAUSE = 600, WIRE_MS = 520, STEP_GAP = 1200, DROP = 700, HOLD = 2300, EXIT = 700, NEXT = 300, COUNT = 1500;
  const LEN = SHAKE + 900 + PAUSE + WIRE_MS + 3 * STEP_GAP + DROP + HOLD;
  const START = RECIPES.map((_, i) => i).map((i) => 300 + i * (LEN + NEXT));
  const at = (i) => {
    const s = START[i];
    const shake = s + SHAKE;
    const lit = [0, 1, 2, 3].map((k) => shake + 900 + PAUSE + WIRE_MS + k * STEP_GAP);
    return { s, shake, lit, wire: lit.map((l) => l - WIRE_MS), out: s + LEN, count: [lit[3], lit[3] + COUNT] };
  };
  const TIMES = RECIPES.map((_, i) => at(i));
  const SUM = TIMES[TIMES.length - 1].count[1] + 100;          // «Разом» під останньою схемою
  const DUR = SUM + 600 + 2500 + 520;

  const stepTop = (k) => TOP + TRIG_H + WIRE + k * (STEP_H + WIRE);

  function recipe(r, i) {
    const t = TIMES[i];
    const steps = r.steps.map((st, k) => {
      const m = MOD[st.module];
      return `
      <div class="wire" style="top:${stepTop(k) - WIRE}px"><i class="run" style="--d:${t.wire[k]}ms"></i><b class="spark" style="--d:${t.wire[k]}ms"></b></div>
      <div class="stp" style="top:${stepTop(k)}px;--d:${t.lit[k]}ms">
        <div class="blk" style="--d:${t.lit[k]}ms">
          <span class="lit" style="--c:${m.c}"></span>
          <span class="mi" style="background:${m.c}">${TV.icon(m.icon, 42, "#fff", 2.1)}</span>
          <span class="tx">${TV.esc(st.text)}</span>
          ${st.side(t.lit[k])}
        </div>
      </div>`;
    }).join("");
    const last = i === RECIPES.length - 1;
    return `
    <div class="out" style="--d:${last ? DUR + 1000 : t.out}ms"><div class="rcp" style="--d:${t.s}ms">
      <span class="name">${TV.esc(r.name)}</span>
      <div class="trig" style="top:${TOP}px">
        <span class="zap" style="--d:${t.shake}ms">${TV.icon("zap", 54, INK, 2)}<i class="wave" style="--d:${t.shake}ms"></i><i class="wave" style="--d:${t.shake + 380}ms"></i></span>
        <span><span class="lb">Якщо</span><span class="ev">${TV.esc(r.when)}</span></span>
      </div>
      ${steps}
      <div class="save a-up" style="top:${stepTop(3) + STEP_H + 42}px;--d:${t.lit[3] - 150}ms"><span class="e">Економить</span><span class="n">≈ <em class="sv" data-i="${i}">0</em> хв</span><span class="p">на тиждень</span></div>
    </div></div>`;
  }

  const S = `[data-scene="${ID}"]`;
  TV.scene({
    id: ID,
    dur: DUR,
    bg: "dark",
    css: `
${S} .mock { position: relative; width: ${W}px; height: ${H}px; --vs: 1; --vs-port: 1.08; }
/* смужки сценаріїв угорі — як сторіз: котрий зараз і скільки ще */
${S} .bars { position: absolute; right: 0; top: 14px; display: flex; gap: 10px; }
${S} .bars span { width: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.16); overflow: hidden; }
${S} .bars b { display: block; height: 100%; background: ${AMBER}; transform-origin: 0 50%; animation: aut-bar var(--t) linear var(--d) both; }
@keyframes aut-bar { from { transform: scaleX(0); } }
/* перехід між сценаріями: новий в'їжджає справа, старий виїжджає вліво */
${S} .out { position: absolute; inset: 0; animation: aut-exit ${EXIT}ms var(--e-emph) var(--d) both; }
${S} .rcp { position: absolute; inset: 0; animation: aut-enter 700ms var(--e-emph) var(--d) both; }
@keyframes aut-enter { from { opacity: 0; transform: translate3d(90px, 0, 0); } }
@keyframes aut-exit { 0% { opacity: 1; transform: none; } 45% { opacity: 0; } 100% { opacity: 0; transform: translate3d(-120px, 0, 0); } }
${S} .name { position: absolute; left: 0; top: 0; height: 36px; display: inline-flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 650; color: rgba(255,255,255,0.72); letter-spacing: -0.01em; }
${S} .name::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: ${AMBER}; box-shadow: 0 0 0 5px color-mix(in oklab, ${AMBER} 22%, transparent); }
/* подія */
${S} .trig { position: absolute; left: 0; right: 0; height: ${TRIG_H}px; border-radius: 32px; display: flex; align-items: center; gap: 28px; padding: 0 28px 0 ${AXIS - 52}px;
  background: color-mix(in oklab, ${AMBER} 11%, transparent); box-shadow: inset 0 0 0 2px color-mix(in oklab, ${AMBER} 45%, transparent); }
${S} .zap { position: relative; flex: none; width: 104px; height: 104px; border-radius: 28px; background: ${AMBER}; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 10px color-mix(in oklab, ${AMBER} 18%, transparent), 0 20px 50px -14px ${AMBER};
  animation: aut-shake 900ms var(--e-std) var(--d) both; }
${S} .zap svg path, ${S} .cz svg path { fill: ${INK}; }
${S} .zap .wave { position: absolute; inset: -10px; border-radius: 36px; box-shadow: 0 0 0 3px ${AMBER}; opacity: 0; animation: aut-wave 1000ms var(--e-decel) var(--d) both; }
@keyframes aut-shake {
  0%, 100% { transform: none; }
  12% { transform: rotate(-9deg) scale(1.1); }
  26% { transform: rotate(8deg) scale(1.1); }
  40% { transform: rotate(-6deg) scale(1.07); }
  54% { transform: rotate(4deg) scale(1.04); }
  68% { transform: rotate(-2deg) scale(1.02); }
}
@keyframes aut-wave { 0% { opacity: 0; transform: scale(0.9); } 12% { opacity: 0.9; } 100% { opacity: 0; transform: scale(1.35); } }
${S} .trig .lb { display: block; font-size: 23px; font-weight: 750; letter-spacing: 0.22em; text-transform: uppercase; color: ${AMBER}; }
${S} .trig .ev { display: block; margin-top: 6px; font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #fff; white-space: nowrap; }
/* провід */

  box-shadow: 0 0 0 5px color-mix(in oklab, ${AMBER} 40%, transparent), 0 0 24px 6px ${AMBER}; opacity: 0; animation: aut-spark ${WIRE_MS + 160}ms linear var(--d) both; }

@keyframes aut-drop { 0% { opacity: 0; transform: translate3d(0, -26px, 0) scale(0.97); } 40% { opacity: 1; } 70% { transform: translate3d(0, 3px, 0) scale(1.005); } 100% { opacity: 1; transform: none; } }

${S} .blk .tx { position: relative; flex: 1; font-size: 40px; font-weight: 750; letter-spacing: -0.025em; color: #fff; white-space: nowrap; }
${S} .faces { position: relative; flex: none; display: flex; }
${S} .fc { position: relative; width: 50px; height: 50px; margin-left: -2px; border-radius: 50%; box-shadow: 0 0 0 3px ${DEEP}; }
${S} .fc .avatar { box-shadow: none; }
${S} .bd { position: absolute; right: -7px; bottom: -6px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 3px ${DEEP}; color: ${INK}; font-size: 19px; font-weight: 800; line-height: 1; }

@keyframes aut-spin { to { transform: rotate(360deg); } }

${S} .save { position: absolute; left: 0; right: 0; display: flex; align-items: baseline; gap: 20px; padding-left: ${AXIS - 36}px; white-space: nowrap; }
${S} .save .e { font-size: 24px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.5); }

  white-space: nowrap; font-size: 32px; font-weight: 600; color: rgba(255,255,255,0.62); letter-spacing: -0.01em; }

`,
    html: () => `
<div class="split">
  ${TV.copy({ title: "Автоматизації", line: "Нагадування шле система — ви лише перевіряєте." })}
  <div class="vis"><div class="mock">
    <div class="bars a-fade" style="--d:${START[0] + 200}ms">${TIMES.map((t) => `<span><b style="--d:${t.s}ms;--t:${LEN + NEXT}ms"></b></span>`).join("")}</div>

  </div></div>
</div>`,
    tick(t, el) {
      const set = (node, v) => { if (node && node.textContent !== v) node.textContent = v; };
      el.querySelectorAll(".sv").forEach((n) => {
        const i = +n.dataset.i, c = TIMES[i].count;
        set(n, String(TV.count(t, c[0], c[1], 0, RECIPES[i].saved, TV.ease.inout)));
      });
    },
  });
})();

<script>
/* Все в одному місці — сітка всіх модулів каталогу (i18n.ts → modules.groups, без «soon»:
   37 штук; іконки — MODULE_ICONS, кольори — MODULE_ACCENTS; заголовок — capabilities.caption).
   Великі плитки заповнюють екран діагональною хвилею, група за групою, лічильник росте
   до 37; краї сітки згасають. Потім плитки злітаються у велике вікно «Моя Церква» —
   лаунчер з іконкою й назвою кожного модуля, який читається через усю залу. */
// icons: users, heart, rocket, flame, house, blocks, graduation-cap, tent, calendar-days, ticket, leaf, list-checks, kanban, clipboard-list, inbox, link-2, megaphone, bot, book-open, table-2, chart-column, target, sparkles, network, file-check, building-2, door-open, package, hammer, calculator, sliders-horizontal, layout-template, zap, send, message-circle, message-square-text, notebook-pen
(function () {
  // [назва, іконка lucide, колір] — у порядку каталогу, група за групою.
  const MODS = [
    ["Люди", "users", "#0ea5e9"], ["Сім'я", "heart", "#ec4899"], ["Онбординг", "rocket", "#7c5cf0"],
    ["Служіння", "flame", "#f97316"], ["Малі групи", "house", "#0d9488"], ["Дитяча реєстрація", "blocks", "#e11d48"], ["Навчання", "graduation-cap", "#4f46e5"], ["Табори", "tent", "#15803d"],
    ["Календар", "calendar-days", "#3b82f6"], ["Організатор подій", "ticket", "#f59e0b"], ["Сезони", "leaf", "#65a30d"], ["Планування служіння", "list-checks", "#ea580c"], ["Проєкти", "kanban", "#2563eb"],
    ["Форми", "clipboard-list", "#7c3aed"], ["Заявки", "inbox", "#6366f1"], ["Посилання", "link-2", "#10b981"], ["Розсилки", "megaphone", "#d946ef"], ["Telegram-бот", "bot", "#229ed9"], ["База знань", "book-open", "#b45309"], ["Таблиці", "table-2", "#64748b"],
    ["Аналітика та звіти", "chart-column", "#0891b2"], ["Цілі та метрики", "target", "#dc2626"], ["ШІ-асистенти", "sparkles", "#a855f7"],
    ["Оргструктура", "network", "#7c5cf0"], ["Запити", "file-check", "#0891b2"], ["Кемпуси", "building-2", "#0f766e"],
    ["Кімнати", "door-open", "#8b5e3c"], ["Інвентаризація", "package", "#b07d4f"], ["Інфраструктура", "hammer", "#6b7280"],
    ["Бухгалтерія", "calculator", "#059669"],
    ["Кастомізація", "sliders-horizontal", "#64748b"], ["Шаблони", "layout-template", "#0d9488"], ["Автоматизації", "zap", "#ca8a04"],
    ["Telegram", "send", "#229ed9"], ["Viber", "message-circle", "#7360f2"], ["TurboSMS", "message-square-text", "#f59e0b"], ["Notion", "notebook-pen", "#52525b"],
  ];
  const N = MODS.length; // 37
  const tint = (c, p) => `color-mix(in oklab, ${c} ${p}%, #fff)`;
  const plural = (n) => {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return "модуль";
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "модулі";
    return "модулів";
  };

  // ── хронометраж
  const D0 = 450, WAVE = 3800;           // хвиля плиток
  const PLATE_OUT = 5900, WIN0 = 6250;   // лічильник гасне, з'являється вікно
  const FLY0 = 6250, FLY = 1150, SPREAD = 700;
  const TITLE = 7500;

  // ── плитки сітки: іконка 80 (гліф 44), назва 22 px
  const TH = 196, PY = 212, IC = 80, IY = 22, SI = 60 / IC; // у вікні іконка 60 px
  const geo = (o) => {
    const port = o === "port";
    const CW = port ? 1080 : 1920, CH = port ? 1920 : 1080;
    const TW = port ? 196 : 220, PX = port ? 212 : 236;
    const cols = port ? 5 : 8, rows = port ? 9 : 5;
    const x0 = (CW - (cols * PX - (PX - TW))) / 2, y0 = (CH - (rows * PY - (PY - TH))) / 2;
    const plate = port ? { c0: 1, c1: 3, r0: 4, r1: 4 } : { c0: 3, c1: 4, r0: 2, r1: 2 };
    const IX = (TW - IC) / 2;
    const slots = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (c >= plate.c0 && c <= plate.c1 && r >= plate.r0 && r <= plate.r1) continue;
      const x = x0 + c * PX, y = y0 + r * PY;
      const dx = (x + TW / 2 - CW / 2) / (CW / 2), dy = (y + TH / 2 - CH / 2) / (CH / 2);
      const rr = Math.hypot(dx, dy);
      // Краї згасають: центр — повністю, кути — наполовину.
      slots.push({ c, r, x, y, dist: rr, op: TV.clamp(1 - Math.max(0, rr - 0.7) * 1.1, 0.3, 1) });
    }
    const near = [...slots].sort((a, b) => a.dist - b.dist);
    const mods = near.slice(0, N).sort((a, b) => (a.c + a.r) - (b.c + b.r) || a.r - b.r);
    const empties = near.slice(N);
    const maxDiag = cols + rows - 2;
    const delay = (s, k) => D0 + ((s.c + s.r) / maxDiag) * (WAVE - D0) + (k || 0);
    const plateBox = { x: x0 + plate.c0 * PX, y: y0 + plate.r0 * PY, w: (plate.c1 - plate.c0 + 1) * PX - (PX - TW), h: TH };

    // ── вікно-лаунчер: іконка 60 + назва 18 px під нею
    const ROWS = port ? [6, 5, 6, 5, 6, 5, 4] : [8, 8, 7, 7, 7];
    const CELL = port ? 152 : 164, RP = 124, BAR = 76, PT = 38, PB = 30;
    const W = port ? 960 : 1400;
    const H = BAR + PT + ROWS.length * RP - 10 + PB;
    const titleH = port ? 124 : 132, gap = port ? 48 : 40;
    const top = (CH - (titleH + gap + H)) / 2;
    const win = { x: (CW - W) / 2, y: top + titleH + gap, w: W, h: H };
    const cells = [];
    ROWS.forEach((n, ri) => {
      const sx = CW / 2 - (n * CELL) / 2;
      for (let k = 0; k < n; k++) {
        const cx = sx + k * CELL;
        cells.push({ x: cx + (CELL - 60) / 2, y: win.y + BAR + PT + ri * RP, cx });
      }
    });
    return { port, CW, CH, TW, IX, mods, empties, delay, plateBox, win, cells, CELL, BAR, title: { y: top } };
  };

  TV.scene({
    id: "all-in-one",
    dur: 12800,
    bg: "light",
    css: `
[data-scene="all-in-one"] .tl { position: absolute; height: ${TH}px; transform-origin: var(--ox) ${IY}px; opacity: var(--o);
  animation: ai-fly ${FLY}ms var(--e-emph) var(--f) both; }
@keyframes ai-fly { to { opacity: 1; transform: translate3d(var(--tx), var(--ty), 0) scale(${SI}); } }
[data-scene="all-in-one"] .tl > .in { position: absolute; inset: 0; }
[data-scene="all-in-one"] .bgc { position: absolute; inset: 0; border-radius: 32px; background: #fff; box-shadow: 0 0 0 1px var(--hairline), 0 14px 34px -18px rgba(10, 30, 70, 0.28); }
[data-scene="all-in-one"] .ico { position: absolute; top: ${IY}px; width: ${IC}px; height: ${IC}px; border-radius: 24px; display: flex; align-items: center; justify-content: center; }
[data-scene="all-in-one"] .nm { position: absolute; left: 4px; right: 4px; top: ${IY + IC + 12}px; text-align: center; font-size: 22px; line-height: 26px; font-weight: 650; letter-spacing: -0.02em; color: var(--ink); }
[data-scene="all-in-one"] .em { position: absolute; height: ${TH}px; border-radius: 32px; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.06); background: rgba(255, 255, 255, 0.5); }
[data-scene="all-in-one"] .plate { position: absolute; border-radius: 40px; background: #fff; box-shadow: 0 0 0 1px var(--hairline), var(--shadow-card);
  display: flex; align-items: baseline; justify-content: center; gap: 18px; padding-top: 16px; }
[data-scene="all-in-one"] .plate b { font-size: 150px; line-height: 150px; font-weight: 800; letter-spacing: -0.06em; color: var(--brand); font-variant-numeric: tabular-nums; }
[data-scene="all-in-one"] .plate span { font-size: 48px; font-weight: 650; letter-spacing: -0.02em; color: var(--ink-2); }
[data-scene="all-in-one"] .win { position: absolute; border-radius: 40px; background: #fff; box-shadow: 0 0 0 1px var(--hairline), var(--shadow-card); overflow: hidden; }
[data-scene="all-in-one"] .bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 24px; padding: 0 30px; border-bottom: 1px solid var(--hairline); background: var(--surface-2); }
[data-scene="all-in-one"] .dots { display: flex; gap: 10px; }
[data-scene="all-in-one"] .dots i { width: 15px; height: 15px; border-radius: 50%; background: rgba(0, 0, 0, 0.12); }
[data-scene="all-in-one"] .cnt { margin-left: auto; height: 48px; padding: 0 22px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-deep);
  display: flex; align-items: center; font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; }
[data-scene="all-in-one"] .wn { position: absolute; text-align: center; font-size: 18px; line-height: 22px; font-weight: 650; letter-spacing: -0.025em; color: var(--ink); }
[data-scene="all-in-one"] .ttl { position: absolute; left: 0; right: 0; text-align: center; }
[data-scene="all-in-one"] .ttl .t { font-size: 118px; }
[data-o="port"] [data-scene="all-in-one"] .ttl .t { font-size: 104px; }
`,
    html: (o) => {
      const G = geo(o);
      const cx = G.CW / 2, cy = G.CH / 2;
      const lands = [];
      const tiles = G.mods.map((s, i) => {
        const [name, icon, c] = MODS[i];
        const tg = G.cells[i];
        const far = Math.hypot(s.x + G.TW / 2 - cx, s.y + TH / 2 - cy) / Math.hypot(cx, cy);
        const f = Math.round(FLY0 + far * SPREAD);
        lands.push(f + FLY - 200);
        return `<div class="tl" style="left:${s.x}px;top:${s.y}px;width:${G.TW}px;--ox:${G.IX}px;--o:${s.op.toFixed(2)};--tx:${tg.x - (s.x + G.IX)}px;--ty:${tg.y - (s.y + IY)}px;--f:${f}ms">
          <div class="in a-pop" style="--d:${Math.round(G.delay(s))}ms">
            <div class="bgc a-outf" style="--d:${f}ms"></div>
            <span class="ico" style="left:${G.IX}px;background:${tint(c, 15)}">${TV.icon(icon, 44, c, 2.1)}</span>
            <div class="nm a-outf" style="--d:${f - 80}ms">${TV.esc(name)}</div>
          </div></div>`;
      }).join("");
      const empties = G.empties.map((s) => `<div class="a-outf" style="--d:${PLATE_OUT}ms"><div class="em a-pop" style="left:${s.x}px;top:${s.y}px;width:${G.TW}px;opacity:${s.op.toFixed(2)};--d:${Math.round(G.delay(s, 60))}ms"></div></div>`).join("");
      const pb = G.plateBox, w = G.win;
      const names = G.cells.map((cl, i) => `<div class="wn a-fade" style="left:${cl.cx - w.x + 4}px;top:${cl.y - w.y + 60 + 10}px;width:${G.CELL - 8}px;--d:${lands[i]}ms">${TV.esc(MODS[i][0])}</div>`).join("");
      return `
${empties}
<div class="a-out" style="--d:${PLATE_OUT}ms"><div class="plate a-scale" style="left:${pb.x}px;top:${pb.y}px;width:${pb.w}px;height:${pb.h}px;--d:250ms"><b class="n">0</b><span class="u">модулів</span></div></div>
<div class="win a-scale" style="left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;--d:${WIN0}ms">
  <div class="bar" style="height:${G.BAR}px"><span class="dots"><i></i><i></i><i></i></span>${TV.wordmark(40)}<span class="cnt a-pop" style="--d:${WIN0 + 600}ms">${N} ${plural(N)}</span></div>
  ${names}
</div>
${tiles}
<div class="ttl" style="top:${G.title.y}px"><h1 class="t">${TV.words("Все в одному місці", TITLE, 80)}</h1></div>`;
    },
    tick(t, el, o) {
      const G = geo(o);
      const n = G.mods.filter((s) => t >= G.delay(s) + 120).length;
      const b = el.querySelector(".plate .n"), u = el.querySelector(".plate .u");
      if (b && b.textContent !== String(n)) { b.textContent = n; u.textContent = plural(n); }
    },
  });
})();

</script>
<script>
/* Допоможемо організувати — безлад, що складається в систему.
   Джерело — блок сайту «Допоможемо організувати»: church-brief-scene.tsx (+ .module.css)
   і i18n.ts → brief.scene (клаптики, `tiles`, `notes`). Рядок — cta.text, він же перше
   речення brief.note. Строків («за 7 днів») немає — власник їх прибрав.
   1) Безлад: таблиця «ФІНАЛ(2)», чат без відповіді, стікер, зошит групи, фото нової
      сім'ї (мальовані обличчя), календар, підрахунок, голосове, анкета — навскоси, ворушаться.
   2) Збирання: кожен клаптик летить у свою клітинку одного вікна й стає плиткою модуля
      (порядок — як `tiles`); вікно світлішає, у шапці з'являється команда.
   3) Обіцянка: вікно відсувається, з'являється «Допоможемо організувати». */
// icons: users, flame, house, ticket, heart, inbox, clipboard-list, megaphone, chart-column, check, clock, check-check, file-spreadsheet, play
(function () {

  const T = { asm: 3100, step: 130, fly: 1000, promise: 6100 };
  const GLOW = 5250, TEAM_AT = 5450;

  // Плитки — у порядку brief.scene.tiles; кольори й значки — модулів (module-icons.ts).
  const TILES = [
    { id: "people", label: "Люди", value: "248", icon: "users", c: "#0ea5e9" },
    { id: "ministries", label: "Служіння", icon: "flame", c: "#f97316" },
    { id: "groups", label: "Малі групи", icon: "house", c: "#0d9488" },
    { id: "events", label: "Події", icon: "ticket", c: "#f59e0b" },
    { id: "family", label: "Сім'ї", icon: "heart", c: "#ec4899" },
    { id: "applications", label: "Заявки", value: "5", icon: "inbox", c: "#6366f1" },

  // Клаптик → клітинка. Центри безладу — у пікселях полотна для кожної орієнтації;
  // d — черга вильоту (як на сайті: навхрест, а не до найближчої клітинки).
  const PIECES = [
    { kind: "xlsx", slot: 0, w: 400, h: 250, r: 7, z: 3, d: 0, toss: 0, land: [360, 250], port: [330, 470] },
    { kind: "chat", slot: 1, w: 540, h: 130, r: -5, z: 6, d: 2, toss: 3, land: [1000, 140], port: [560, 200] },
    { kind: "notebook", slot: 2, w: 280, h: 290, r: -9, z: 2, d: 4, toss: 5, land: [1660, 320], port: [830, 560] },
    { kind: "calendar", slot: 3, w: 270, h: 290, r: 10, z: 4, d: 7, toss: 7, land: [1650, 820], port: [820, 1480] },
    { kind: "photo", slot: 4, w: 280, h: 340, r: -6, z: 5, d: 3, toss: 1, land: [740, 560], port: [260, 930] },
    { kind: "sticky", slot: 5, w: 270, h: 240, r: 6, z: 7, d: 1, toss: 2, land: [1170, 470], port: [640, 850] },
    { kind: "form", slot: 6, w: 320, h: 260, r: -9, z: 3, d: 5, toss: 6, land: [330, 790], port: [300, 1400] },
    { kind: "voice", slot: 7, w: 390, h: 104, r: 4, z: 8, d: 6, toss: 4, land: [1120, 950], port: [540, 1740] },
    { kind: "tally", slot: 8, w: 300, h: 200, r: -12, z: 3, d: 8, toss: 8, land: [1290, 760], port: [720, 1180] },
  ];
  // Вікно: у безладі й збиранні — по центру великим (0), в обіцянці — збоку чи внизу (1).
  const LAYOUT = {
    land: { s0: 1.15, x0: 960 - FW * 0.575, y0: 540 - FH * 0.575, s1: 0.95, x1: 1920 - 110 - FW * 0.95, y1: 540 - FH * 0.475, big: 1.22 },
    port: { s0: 0.98, x0: 540 - FW * 0.49, y0: 960 - FH * 0.49, s1: 0.9, x1: 90, y1: 1185 - FH * 0.45, big: 1.25 },
  };
  const FAMILY = [TV.LOOKS[3], TV.LOOKS[7], TV.LOOKS[2]];
  const TEAMF = [TV.LOOKS[0], TV.LOOKS[1], TV.LOOKS[4], TV.LOOKS[5]];
  const BARS = [10, 15, 13, 19, 18, 26];
  const WAVE = [5, 9, 14, 8, 12, 18, 11, 6, 15, 20, 13, 7, 10, 16, 9, 5, 12, 8, 14, 6];
  const CELLS = [[70, 55, 80, 40], [60, 75, 0, 55], [85, 45, 60, 70], [50, 0, 75, 45], [75, 60, 50, 0]];
  const QR = [[0, 0, 7, 1], [0, 6, 7, 1], [0, 0, 1, 7], [6, 0, 1, 7], [2, 2, 3, 3], [14, 0, 7, 1], [14, 6, 7, 1], [14, 0, 1, 7], [20, 0, 1, 7], [16, 2, 3, 3],
    [0, 14, 7, 1], [0, 20, 7, 1], [0, 14, 1, 7], [6, 14, 1, 7], [2, 16, 3, 3], [8, 0, 2, 2], [11, 1, 2, 3], [8, 4, 1, 3], [10, 6, 2, 2], [9, 9, 3, 2],
    [0, 8, 2, 2], [3, 9, 3, 1], [4, 11, 2, 2], [13, 8, 2, 3], [16, 9, 3, 2], [19, 8, 2, 4], [8, 12, 2, 3], [11, 13, 3, 2], [15, 14, 2, 2], [18, 13, 2, 3],
    [8, 17, 3, 2], [12, 16, 2, 4], [15, 18, 3, 2], [19, 17, 2, 2], [9, 20, 2, 1]];
  const SCRIB = `<path d="M1 5 C6 1 9 7 14 4 S22 1 27 5 S36 7 41 3 S52 2 59 5"/>`;

  // ── клаптики безладу (brief.scene — дослівно)
  const MESS = {
    xlsx: () => `<div class="paper xlsx"><div class="xbar">${TV.icon("file-spreadsheet", 24, "#fff", 2.2)}<span>члени_ФІНАЛ(2).xlsx</span></div>
      <div class="xgrid">${CELLS.flatMap((row, ri) => row.map((w, ci) => ri === 1 && ci === 2 ? `<span class="odd">???</span>`

  };

  // ── плитки системи: число — лише «Люди» і «Заявки», решта — шматочок інтерфейсу (brief.scene.notes)
  const VIS = {
    ministries: (d) => `<span class="pill ok a-pop" style="--d:${d}ms">${TV.icon("check", 24, "currentColor", 3)}Усі на місці</span>`,
    groups: (d, c) => `<span class="pill a-pop" style="--d:${d}ms;color:${c};background:color-mix(in oklab, ${c} 12%, #fff)">${TV.icon("clock", 24, "currentColor", 2.6)}Вт, 19:00</span>`,
    events: (d, c) => `<span class="ev a-pop" style="--d:${d}ms"><span class="leaf"><b style="background:${c}">жов</b><span>17</span></span>Табір</span>`,
    family: (d) => `<span class="fam">${FAMILY.map((l, j) => `<span class="a-pop" style="--d:${d + j * 70}ms">${TV.avatar(l, 64)}</span>`).join("")}</span>`,
    forms: (d) => `<span class="qrw a-pop" style="--d:${d}ms"><svg class="qr" viewBox="0 0 21 21">${QR.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`).join("")}</svg>Анкета гостя</span>`,

  function item(p, L) {
    const tile = TILES[p.slot];

${X} .row .sep { color: rgba(255,255,255,0.55); }

/* ── портрет: усе стовпчиком */
[data-o="port"] ${X} .shrink { --ty: -800px; --sc: 0.34; }
[data-o="port"] ${X} .t { font-size: 168px; }
[data-o="port"] ${X} .q { top: 420px; font-size: 112px; }
[data-o="port"] ${X} .steps { left: 100px; right: 70px; top: 620px; grid-template-columns: 1fr; row-gap: 70px; }
[data-o="port"] ${X} .stp { display: grid; grid-template-columns: 100px 1fr; column-gap: 34px; align-items: start; }
[data-o="port"] ${X} .num { width: 100px; height: 100px; font-size: 50px; }
[data-o="port"] ${X} .stp b { margin-top: 8px; font-size: 56px; }
[data-o="port"] ${X} .stp p { grid-column: 2; margin-top: 10px; font-size: 35px; max-width: none; }
[data-o="port"] ${X} .stp .num { grid-row: 1 / span 2; }
[data-o="port"] ${X} .ln { left: 48px; right: auto; top: 118px; width: 4px; height: calc(100% - 50px); transform-origin: 50% 0;
  animation-name: outro-grow-v; }
@keyframes outro-grow-v { from { transform: scaleY(0); } }
[data-o="port"] ${X} .qc { top: 560px; }
[data-o="port"] ${X} .qr-w { width: 580px; height: 580px; }
[data-o="port"] ${X} .cap { font-size: 46px; }
[data-o="port"] ${X} .url { font-size: 36px; }
[data-o="port"] ${X} .row { top: 1490px; gap: 12px; }
[data-o="port"] ${X} .row span { font-size: 25px; gap: 8px; }
[data-o="port"] ${X} .row span i { width: 38px; height: 38px; font-size: 20px; }
`,
    html: (o) => {
      const slogan = o === "port"
        ? `${TV.words("Час —", 380)}<br>${TV.words("людям,", 480, 70, "acc")}<br>${TV.words("а не рутині", 580)}`
        : `${TV.words("Час —", 380)} ${TV.words("людям,", 480, 70, "acc")}<br>${TV.words("а не рутині", 580)}`;
      const steps = STAGES.map(([title, result], i) => `
        <div class="stp">
          ${i < 3 ? `<i class="ln" style="--d:${sd(i) + 500}ms"></i>` : ""}
          <span class="num a-pop" style="--d:${sd(i)}ms">${i + 1}</span>
          <b class="a-up" style="--d:${sd(i) + 80}ms">${title}</b>
          <p class="a-up" style="--d:${sd(i) + 200}ms">${result}</p>
        </div>`).join("");
      const row = STAGES.map(([title], i) =>
        `<span><i>${i + 1}</i>${title}</span>${i < 3 ? `<span class="sep">${TV.icon("chevron-right", 30, "currentColor", 2.6)}</span>` : ""}`).join("");
      return `
<div class="hero"><div class="shrink">
  <div class="wm"><div>${TV.wordmark(o === "port" ? 96 : 88, "#fff", "#fff")}</div></div>
  <h1 class="t">${slogan}</h1>
</div></div>
<div class="next"><div class="a-out" style="--d:${T3}ms">
  <h2 class="q a-up" style="--d:${Q}ms">Що далі?</h2>
  <div class="steps">${steps}</div>
</div></div>
<div class="row a-up" style="--d:${T3 + 450}ms">${row}</div>
<div class="qc"><div class="qin"><div>
  <div class="qr-w">${window.TV_QR || ""}<div class="fr"><i></i><i></i><i></i><i></i></div></div>
  <div class="cap">Запланувати зустріч</div>
  <div class="url">mychurch.com.ua</div>
</div></div></div>`;
    },
  });
})();

</script>
<script>
/* Плеєр петлі.
   Живий режим: сцени йдуть по черзі без кінця; тло наступної сцени, якщо воно
   іншого кольору, розкривається колом. Клавіші: → / ← — наступна / попередня,
   пробіл — пауза, F — на весь екран, O — альбом / портрет.
   Адреса: ?scene=people — крутити одну сцену; ?only=intro,people — добірка;
   без параметрів — основна добірка (TV.LISTS.main), ?list=all — усі сцени;
   ?o=port — примусово портрет; ?speed=0.7 — темп (1 — як задумано).
   Темп: уся петля грає повільніше за задумане (TV.SPEED в order.js, 2026-10-01:
   «на презентації не встигаєш»). Клавіші − / + міняють його на ходу, 0 — назад.
   Режим запису (?render=1): нічого не грає само, build.py кличе TVR.mount/seek. */
(function () {
  const TV = window.TV;
  const q = new URLSearchParams(location.search);
  const RENDER = q.has("render");
  const tv = document.getElementById("tv");
  if (RENDER) document.body.classList.add("render");

  // Темп петлі: 0.8 = на чверть повільніше, ніж у сценах записано.
  let speed = parseFloat(q.get("speed")) || TV.SPEED || 1;

  const order = (TV.ORDER || Object.keys(TV.scenes)).filter((id) => TV.scenes[id]);
  // Без параметрів грає основна добірка (TV.LISTS.main); ?list=all — усі сцени.
  const lists = TV.LISTS || {};
  let list = lists.main ? lists.main.filter((id) => TV.scenes[id]) : order;
  if (q.get("scene")) list = [q.get("scene")];
  else if (q.get("list") === "all") list = order;
  else if (q.get("list") && lists[q.get("list")]) list = lists[q.get("list")].filter((id) => TV.scenes[id]);
  else if (q.get("only")) list = q.get("only").split(",").filter((id) => TV.scenes[id]);

  // ─────────────────────────────── розмір і орієнтація
  let forced = q.get("o");
  let o = "land";
  function fit() {
    const w = innerWidth, h = innerHeight;
    const next = forced || (w / h < 0.9 ? "port" : "land");
    const [W, H] = next === "port" ? [1080, 1920] : [1920, 1080];
    tv.style.setProperty("--k", Math.min(w / W, h / H));
    const changed = next !== o;
    o = next;
    tv.dataset.o = o;
    return changed;
  }

  // ─────────────────────────────── монтаж сцени
  let cur = null; // { def, el, bleed, start, i }
  function bleedHTML(bg) {
    return `<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>`;
  }
  function mount(id, prevBg) {
    const def = TV.scenes[id];
    tv.innerHTML = "";
    const under = document.createElement("div");
    under.className = "bleed bg-" + (prevBg || def.bg || "light");
    under.innerHTML = bleedHTML(prevBg);
    const bleed = document.createElement("div");
    bleed.className = "bleed bg-" + (def.bg || "light") + (prevBg && prevBg !== (def.bg || "light") ? " reveal" : "");
    bleed.innerHTML = bleedHTML(def.bg);
    const stage = document.createElement("div");
    stage.className = "stage";
    const el = document.createElement("section");
    el.className = "scene on-" + (def.bg || "light");
    el.dataset.scene = id;
    el.style.setProperty("--dur", def.dur + "ms");
    el.innerHTML = typeof def.html === "function" ? def.html(o) : def.html;
    // Бік екрана задає петля, а не сцена: сусідні сцени чергуються (TV.SIDE в order.js).
    const side = (TV.SIDE || {})[id];
    const split = el.querySelector(".split");
    if (side && split) split.classList.toggle("flip", side === "L");
    stage.appendChild(el);
    tv.append(under, bleed, stage);
    if (!document.getElementById("css-" + id) && def.css) {
      const st = document.createElement("style");
      st.id = "css-" + id;
      st.textContent = def.css;
      document.head.appendChild(st);
    }
    fitTitles(el);
    if (def.setup) def.setup(el, o);
    cur = { def, el, id };
    if (def.tick) def.tick(0, el, o);
    return cur;
  }

  // Довга назва модуля («Інвентаризація») не має вилазити за колонку:
  // кегль зменшується рівно настільки, щоб найдовше слово вмістилось.
  function fitTitles(el) {
    el.querySelectorAll(".t").forEach((h) => {
      for (let k = 0; k < 4 && h.scrollWidth > h.clientWidth + 1; k++) {
        const fs = parseFloat(getComputedStyle(h).fontSize);
        h.style.fontSize = Math.floor(fs * (h.clientWidth / h.scrollWidth) * 0.99) + "px";
      }
    });
  }

  // Поставити мить t (мс від старту сцени) — для запису кадрів.
  function seek(t) {
    for (const a of tv.getAnimations({ subtree: true })) {
      a.pause();
      a.currentTime = t;
    }
    if (cur && cur.def.tick) cur.def.tick(t, cur.el, o);
  }

  window.TVR = {
    list: () => order.map((id) => ({ id, dur: TV.scenes[id].dur, bg: TV.scenes[id].bg || "light" })),
    mount: (id, prevBg, orient) => {
      forced = orient || forced;
      fit();
      mount(id, prevBg);
      seek(0);
      return true;
    },
    seek,
    speed: () => speed,
    ready: () => document.fonts.ready.then(() => true),
  };
  fit();
  if (RENDER) return;

  // ─────────────────────────────── живий режим
  let i = 0, t0 = 0, paused = false, pausedAt = 0;
  const hud = document.createElement("div");
  hud.id = "hud";
  const bar = document.createElement("div");
  bar.id = "progress";
  document.body.append(hud, bar);

  function play(n) {
    const prev = cur ? cur.def.bg || "light" : null;
    i = (n + list.length) % list.length;
    mount(list[i], list.length > 1 ? prev : null);
    tv.getAnimations({ subtree: true }).forEach((a) => { a.playbackRate = speed; });
    t0 = performance.now();
    paused = false;
    hud.textContent = `${i + 1}/${list.length} · ${list[i]} · ${o === "port" ? "портрет" : "альбом"} · темп ${speed.toFixed(2)} — ← → пробіл F O − +`;
  }
  function frame(now) {
    if (cur && !paused) {
      const t = (now - t0) * speed;
      if (cur.def.tick) cur.def.tick(t, cur.el, o);
      bar.style.width = (100 * Math.min(1, t / cur.def.dur)) + "%";
      if (t >= cur.def.dur) play(i + 1);
    }
    requestAnimationFrame(frame);
  }
  function setPaused(p) {
    if (!cur || p === paused) return;
    paused = p;
    const anims = tv.getAnimations({ subtree: true });
    if (p) { pausedAt = performance.now(); anims.forEach((a) => a.pause()); }
    else { t0 += performance.now() - pausedAt; anims.forEach((a) => a.play()); }
  }

  // Змінити темп, не перериваючи сцену: час сцени лишається тим самим.
  function setSpeed(v) {
    if (!cur) return;
    const now = performance.now();
    const t = ((paused ? pausedAt : now) - t0) * speed;
    speed = Math.min(1.5, Math.max(0.4, Math.round(v * 100) / 100));
    t0 = (paused ? pausedAt : now) - t / speed;
    tv.getAnimations({ subtree: true }).forEach((a) => { a.playbackRate = speed; });
    hud.textContent = hud.textContent.replace(/темп [\d.]+/, "темп " + speed.toFixed(2));
  }

  addEventListener("keydown", (e) => {
    if (e.key === "-" || e.key === "_") setSpeed(speed - 0.1);
    else if (e.key === "=" || e.key === "+") setSpeed(speed + 0.1);
    else if (e.key === "0") setSpeed(TV.SPEED || 1);
    else if (e.key === "ArrowRight") play(i + 1);
    else if (e.key === "ArrowLeft") play(i - 1);
    else if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
    else if (e.key === "f" || e.key === "F" || e.key === "а" || e.key === "А") {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    } else if (e.key === "o" || e.key === "O" || e.key === "щ" || e.key === "Щ") {
      forced = o === "land" ? "port" : "land";
      fit();
      play(i);
    }
  });
  addEventListener("resize", () => { if (fit()) play(i); });
  // Один клік — на весь екран (браузер не дозволяє ввімкнути його без дії людини);
  // подвійний — вийти. Esc теж виходить.
  addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  });
  addEventListener("dblclick", () => {
    if (document.fullscreenElement) document.exitFullscreen();
  });

  // Курсор миші ховається за 2 с — на телевізорі його не має бути видно.
  let idle;
  const wake = () => {
    document.body.classList.remove("idle");
    clearTimeout(idle);
    idle = setTimeout(() => document.body.classList.add("idle"), 2000);
  };
  addEventListener("mousemove", wake);
  wake();

  // Екран ноутбука не має гаснути посеред петлі.
  async function keepAwake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
  keepAwake();

  document.fonts.ready.then(() => {
    play(0);
    requestAnimationFrame(frame);
  });
})();

</script>
</body>
</html>
