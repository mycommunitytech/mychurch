  --brand-sky: #8cc2ff;
  --green: #12a150;
  --green-soft: #e3f6ea;
  --amber: #f59e0b;
  --amber-soft: #fff4dc;
  --rose: #f05b8b;
  --violet: #8b5bf0;
  --orange: #f97316;
  --dark: #070a12;

  /* Рух — як у Material 3: різкий старт, м'яке приземлення. */
  --e-emph: cubic-bezier(0.2, 0, 0, 1);
  --e-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
  --e-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
  --e-std: cubic-bezier(0.2, 0, 0, 1);
  --e-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  --shadow-card: 0 1px 2px rgba(10, 20, 40, 0.06), 0 12px 32px -8px rgba(10, 30, 70, 0.16), 0 40px 80px -30px rgba(0, 60, 150, 0.22);
  --shadow-pop: 0 2px 4px rgba(10, 20, 40, 0.08), 0 18px 40px -12px rgba(10, 30, 70, 0.28);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--page); }
body {
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  font-feature-settings: "cv11", "ss01";
}
body.idle { cursor: none; }

/* ───────────────────────────────────────────── екран і полотно */
#tv { position: fixed; inset: 0; overflow: hidden; --k: 1; }
.bleed { position: absolute; inset: 0; overflow: hidden; }
.bleed.reveal { animation: bleed-reveal 900ms var(--e-emph) both; }
@keyframes bleed-reveal {
  from { clip-path: circle(0% at 50% 55%); }
  to   { clip-path: circle(75% at 50% 55%); }
}

/* Тла. Сітка йде від центру екрана тим самим кроком, що й полотно. */
.bg-light { background: var(--page); }
.bg-blue { background: var(--brand); }
.bg-dark { background: var(--dark); }
.bleed .grid {
  position: absolute; inset: 0;
  --cell: calc(80px * var(--k));
  background-image:
    linear-gradient(to right, var(--gl) 1px, transparent 1px),
    linear-gradient(to bottom, var(--gl) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
  background-position: calc(50% + var(--cell) / 2) calc(50% + var(--cell) / 2);
  -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 85%);
          mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 85%);
}
.bg-light .grid { --gl: rgba(0, 0, 0, 0.05); }
.bg-blue .grid { --gl: rgba(255, 255, 255, 0.09); }
.bg-dark .grid { --gl: rgba(255, 255, 255, 0.06); }
/* М'яке світло — радіальний градієнт, а не blur: blur на весь екран важкий для
   слабкого ноутбука і для запису кадрів. */
.bleed .glow {
  position: absolute; border-radius: 50%;
  width: calc(1400px * var(--k)); height: calc(1100px * var(--k));
  background: radial-gradient(closest-side, var(--glow), transparent);
}
.bg-light .glow { --glow: rgba(0, 122, 255, 0.10); }
.bg-blue .glow { --glow: rgba(140, 194, 255, 0.32); }
.bg-dark .glow { --glow: rgba(0, 105, 224, 0.24); }
.bleed .glow.g1 { left: -25%; top: -40%; animation: drift 14s ease-in-out infinite alternate; }
.bleed .glow.g2 { right: -25%; bottom: -45%; animation: drift 17s ease-in-out -6s infinite alternate-reverse; }
@keyframes drift { to { transform: translate3d(8%, 6%, 0) scale(1.08); } }

.stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--k));
  transform-origin: 50% 50%;
}
[data-o="port"] .stage { width: 1080px; height: 1920px; }

.scene { position: absolute; inset: 0; animation: scene-out 520ms var(--e-accel) calc(var(--dur) - 520ms) both; }
@keyframes scene-out {
  to { opacity: 0; transform: translate3d(0, -28px, 0) scale(0.985); }
}

/* ───────────────────────────────────────────── рух: примітиви
   Кожен клас бере затримку з --d (мс від старту сцени). */
.a-up    { animation: a-up 760ms var(--e-decel) var(--d, 0ms) both; }
.a-down  { animation: a-down 760ms var(--e-decel) var(--d, 0ms) both; }
.a-fade  { animation: a-fade 600ms var(--e-std) var(--d, 0ms) both; }
.a-pop   { animation: a-pop 620ms var(--e-spring) var(--d, 0ms) both; }
.a-scale { animation: a-scale 820ms var(--e-decel) var(--d, 0ms) both; }
.a-left  { animation: a-left 760ms var(--e-decel) var(--d, 0ms) both; }
.a-right { animation: a-right 760ms var(--e-decel) var(--d, 0ms) both; }
.a-rise  { animation: a-rise 1000ms var(--e-emph) var(--d, 0ms) both; }
@keyframes a-up    { from { opacity: 0; transform: translate3d(0, 48px, 0); } }
@keyframes a-down  { from { opacity: 0; transform: translate3d(0, -40px, 0); } }
@keyframes a-fade  { from { opacity: 0; } }
@keyframes a-pop   { from { opacity: 0; transform: scale(0.6); } }
@keyframes a-scale { from { opacity: 0; transform: scale(0.92); } }
@keyframes a-left  { from { opacity: 0; transform: translate3d(-64px, 0, 0); } }
@keyframes a-right { from { opacity: 0; transform: translate3d(64px, 0, 0); } }
@keyframes a-rise  { from { opacity: 0; transform: translate3d(0, 160px, 0) scale(0.96); } }
/* Зникнення посеред сцени (стан «до» → «після»). */
.a-out   { animation: a-out 320ms var(--e-accel) var(--d, 0ms) both; }
@keyframes a-out   { to { opacity: 0; transform: translate3d(0, -12px, 0); } }
.a-outf  { animation: a-outf 300ms var(--e-std) var(--d, 0ms) both; }
@keyframes a-outf  { to { opacity: 0; } }

/* Слово піднімається з-під маски — як заголовки в Google I/O. */
.w { display: inline-block; white-space: nowrap; overflow: hidden; vertical-align: top; padding: 0.06em 0.02em 0.14em; margin: -0.06em -0.02em -0.14em; }
.w > span { display: inline-block; animation: w-in 900ms var(--e-emph) var(--d, 0ms) both; }
@keyframes w-in { from { transform: translate3d(0, 110%, 0); } }

/* ───────────────────────────────────────────── текст */
.t {
  font-weight: 800; letter-spacing: -0.045em; line-height: 0.98;
  font-size: 150px; color: var(--ink);
}
.t .acc { color: var(--brand); }
.s {
  margin-top: 36px; font-size: 46px; line-height: 1.25; font-weight: 500;
  letter-spacing: -0.015em; color: var(--ink-2); max-width: 760px;
}
.on-blue .t, .on-dark .t { color: #fff; }
.on-blue .t .acc { color: var(--brand-sky); }
.on-dark .t .acc { color: #6fb1ff; }
.on-blue .s { color: rgba(255, 255, 255, 0.82); }
.on-dark .s { color: rgba(255, 255, 255, 0.72); }
[data-o="port"] .t { font-size: 132px; }
[data-o="port"] .s { font-size: 44px; margin-top: 30px; }

.pill {
  display: inline-flex; align-items: center; gap: 14px;
  padding: 14px 26px 14px 20px; border-radius: 999px;
  background: var(--surface); box-shadow: 0 0 0 1px var(--hairline), 0 8px 24px -10px rgba(0, 40, 100, 0.25);
  font-size: 28px; font-weight: 600; color: var(--ink-2); letter-spacing: -0.01em;
}
.pill .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 6px rgba(0, 105, 224, 0.15); }

/* ───────────────────────────────────────────── розкладки
   .split — текст ліворуч, екран праворуч; у портреті — текст угорі, екран під ним.
   .center — усе по центру. Екран живе в .vis, а його макет (.mock) має свій
   розмір і масштаб --vs (окремо для альбому й портрета). */
.split {
  position: absolute; inset: 0; display: grid;
  grid-template-columns: 720px 1fr; column-gap: 40px;
  padding: 0 110px 0 130px; align-items: center;
}
[data-o="port"] .split {
  grid-template-columns: 1fr; grid-template-rows: auto 1fr;
  padding: 170px 90px 110px; row-gap: 40px; align-items: start;
}
.split.flip { grid-template-columns: 1fr 720px; padding: 0 130px 0 110px; }
.split.flip > .copy { order: 2; }
/* У портреті «дзеркальна» сцена — така сама колонка, як звичайна. */
[data-o="port"] .split.flip { grid-template-columns: 1fr; padding: 170px 90px 110px; }
[data-o="port"] .split.flip > .copy { order: 0; }
.vis { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
[data-o="port"] .vis { align-items: center; }
.mock { flex: none; transform: scale(var(--vs, 1)); transform-origin: 50% 50%; }
[data-o="port"] .mock { transform: scale(var(--vs-port, var(--vs, 1))); }

.center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}

/* ───────────────────────────────────────────── поверхні */
.card {
  background: var(--surface); border-radius: 32px;
  box-shadow: 0 0 0 1px var(--hairline), var(--shadow-card);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  height: 64px; padding: 0 32px; border-radius: 999px;
  background: var(--brand); color: #fff; font-weight: 600; font-size: 26px; letter-spacing: -0.01em;
}
.avatar { display: block; border-radius: 50%; flex: none; }
.ic { display: inline-block; flex: none; vertical-align: middle; }

/* Курсор людини: велика стрілка її кольору і бірка з обличчям та ім'ям. */
.cur { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; }
.cur .arrow { display: block; width: 58px; height: 63px; transform-origin: 6px 5px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.25)); }
.cur .cur-tag {
  position: absolute; left: 40px; top: 50px; display: flex; align-items: center; gap: 10px;
  padding: 5px 20px 5px 5px; border-radius: 999px; white-space: nowrap;
  color: #fff; font-size: 26px; font-weight: 650; letter-spacing: -0.01em;
  box-shadow: 0 14px 28px -12px rgba(0, 0, 0, 0.55);
}
.cur .cur-tag .avatar { box-shadow: 0 0 0 2.5px rgba(255, 255, 255, 0.55); }
.tap {
  position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in oklab, var(--c, var(--brand)) 55%, transparent), transparent 70%);
  animation: tap 700ms var(--e-decel) var(--d, 0ms) both; pointer-events: none; z-index: 29;
}
@keyframes tap {
  0% { opacity: 0; transform: scale(0.2); }
  12% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.6); }
}

/* ───────────────────────────────────────────── службове */
#hud {
  position: fixed; left: 24px; bottom: 20px; z-index: 100;
  font: 500 13px/1.4 "Inter", system-ui, sans-serif; color: rgba(0, 0, 0, 0.55);
  background: rgba(255, 255, 255, 0.85); padding: 8px 14px; border-radius: 10px;
  box-shadow: 0 0 0 1px var(--hairline); opacity: 0; pointer-events: none;
}
body:not(.idle) #hud { opacity: 1; }
#progress { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--brand); z-index: 100; opacity: 0; width: 0; }
body:not(.idle) #progress { opacity: 0.7; }
body.render #hud, body.render #progress { display: none; }

</style>

    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t;
    const sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) {
        const e = sx(t) - x, d = dx(t);
        if (Math.abs(e) < 1e-5) break;
        if (Math.abs(d) < 1e-6) break;
        t -= e / d;
      }
      return sy(clamp(t));
    };
  }
  TV.bezier = bezier;
  TV.ease = {
    emph: bezier(0.2, 0, 0, 1),
    decel: bezier(0.05, 0.7, 0.1, 1),
    accel: bezier(0.3, 0, 0.8, 0.15),
    inout: bezier(0.65, 0, 0.35, 1),
    spring: bezier(0.34, 1.56, 0.64, 1),
    linear: (x) => clamp(x),
  };
  // Частка шляху між t0 і t1 (мс) з кривою.
  TV.prog = (t, t0, t1, ease = TV.ease.emph) => ease(clamp((t - t0) / (t1 - t0)));
  TV.mix = (a, b, p) => a + (b - a) * p;
  // Лічильник: ціле число від a до b між t0 і t1.
  TV.count = (t, t0, t1, a, b, ease = TV.ease.emph) => Math.round(TV.mix(a, b, TV.prog(t, t0, t1, ease)));
  // Шлях за ключами [[мс, x, y], …]: між ключами — крива ease.
  TV.path = (t, keys, ease = TV.ease.inout) => {
    if (t <= keys[0][0]) return { x: keys[0][1], y: keys[0][2] };
    for (let i = 1; i < keys.length; i++) {
      const [t1, x1, y1] = keys[i];
      if (t <= t1) {
        const [t0, x0, y0] = keys[i - 1];
        const p = ease(clamp((t - t0) / (t1 - t0)));
        return { x: x0 + (x1 - x0) * p, y: y0 + (y1 - y0) * p };
      }
    }
    const k = keys[keys.length - 1];
    return { x: k[1], y: k[2] };
  };
  // Поставити курсор: шлях, поява/зникнення і натискання (масив мс кліків).
  // opts: { keys, show:[з, до], clicks:[мс…] }
  TV.moveCursor = (el, t, { keys, show, clicks = [] }) => {
    if (!el) return;
    const p = TV.path(t, keys);
    const fadeIn = TV.prog(t, show[0], show[0] + 260, TV.ease.decel);
    const fadeOut = 1 - TV.prog(t, show[1] - 260, show[1], TV.ease.accel);
    let press = 1;
    for (const c of clicks) {
      const dt = t - c;
      if (dt > -90 && dt < 170) press = Math.min(press, dt < 0 ? 1 - 0.22 * (1 + dt / 90) : 0.78 + 0.22 * (dt / 170));
    }
    el.style.opacity = String(Math.min(fadeIn, fadeOut));
    el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)`;
    const arrow = el.firstElementChild;
    if (arrow) arrow.style.transform = `scale(${press})`;
  };
  // Хвиля натискання в точці (x, y) у мить d — рендерити разом зі сценою.
  TV.tap = (x, y, d, color = "var(--brand)") =>
    `<span class="tap" style="left:${x}px;top:${y}px;--d:${d}ms;--c:${color}"></span>`;
})();

</script>

  const S = '[data-scene="space"]';

@keyframes space-pill { from { opacity: 0; transform: translate3d(-50%, 40px, 0); } }

/* Злиття в один рядок — двома рухами: спершу рядки розходяться вбік і меншають
   (.ln, швидка крива), потім піднімаються (.ly, пізніше й м'якше) — так «для»

${S} .ly { position: absolute; z-index: 2; left: 0; right: 0; height: 1.2em; font-size: ${G.land.f}px;

@keyframes space-ly { to { transform: translate3d(0, var(--y), 0); } }

@keyframes space-ln { to { transform: translate3d(var(--x), 0, 0) scale(var(--s)); } }
/* Маска хвоста: верхні 0,2em рядка порожні (над великими літерами), а сам хвіст

<script>
/* «Для кожного в церкві» — дев'ять ролей великими плашками (як блок for-whom
   на головній): обличчя, коротка назва ролі й один рядок з i18n audience.roles.
   Ряди пливуть назустріч один одному — видно всіх, і ніхто не «головний». */
(function () {
  // Обличчя й кольори — ROLE_LOOKS і ROLE_ACCENTS з src/components/shared/role-icons.ts.
  const ROLES = [
    { name: "Пастор", line: "Бачить усю церкву", look: 3, c: "#007aff" },
    { name: "Лідер", line: "Своя група і явка за хвилину", look: 0, c: "#12a150" },
    { name: "Диякон", line: "Знає, кому потрібна допомога", look: 7, c: "#e11d48" },
    { name: "Служитель", line: "Свій графік у телефоні", look: 1, c: "#f59e0b" },
    { name: "Відвідувач", line: "Перший візит не загубиться", look: 5, c: "#0ea5e9" },
    { name: "Член церкви", line: "Події, група і своя картка", look: 0, c: "#f05b8b" },
    { name: "Адміністрація", line: "Оргструктура і запити", look: 1, c: "#8b5bf0" },
    { name: "Бухгалтер", line: "Кожна гривня на видноті", look: 3, c: "#0f766e" },
    { name: "Рецепція", line: "Прихід і гості за секунди", look: 5, c: "#f97316" },
  ];
  const PW = 560, GAP = 28;

  const plaque = (r, d) => `
<div class="pl a-scale" style="--c:${r.c};--d:${d}ms">
  ${TV.avatar(TV.LOOKS[r.look], 92)}
  <b>${r.name}</b>
  <span>${r.line}</span>
</div>`;

  // Ряд: плашки двічі поспіль, щоб рух не впирався в порожнечу.
  const row = (list, dir, d0, dist) => {
    const items = [...list, ...list].map((r, i) => plaque(r, d0 + Math.min(i, 4) * 70)).join("");
    return `<div class="row"><div class="track" style="--dist:${dist}px;animation-name:${dir}">${items}</div></div>`;
  };

  TV.scene({
    id: "roles",
    dur: 8600,
    bg: "light",
    css: `
[data-scene="roles"] .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; }
[data-scene="roles"] .head { text-align: center; margin-bottom: 70px; }
[data-scene="roles"] .t { font-size: 132px; }
[data-scene="roles"] .row { overflow: visible; margin: 0 0 ${GAP}px; height: 206px; }
[data-scene="roles"] .track { display: flex; gap: ${GAP}px; width: max-content; margin-left: 90px;
  animation: roles-l 8600ms linear 0ms both; }
@keyframes roles-l { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(calc(-1 * var(--dist)), 0, 0); } }
@keyframes roles-r { from { transform: translate3d(calc(-1 * var(--dist)), 0, 0); } to { transform: translate3d(0, 0, 0); } }
[data-scene="roles"] .pl { flex: none; width: ${PW}px; height: 206px; border-radius: 34px; padding: 30px 34px;
  display: grid; grid-template-columns: 92px 1fr; grid-template-rows: auto 1fr; column-gap: 24px; row-gap: 14px; align-content: start;
  background: linear-gradient(145deg, color-mix(in oklab, var(--c) 11%, #fff) 0%, color-mix(in oklab, var(--c) 4%, #fff) 50%, #fff 100%);
  box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--c) 22%, #fff), 0 20px 40px -26px color-mix(in oklab, var(--c) 60%, transparent); }
[data-scene="roles"] .pl .avatar { grid-row: 1 / span 2; box-shadow: 0 0 0 5px #fff, 0 0 0 7px color-mix(in oklab, var(--c) 30%, #fff); }
[data-scene="roles"] .pl b { align-self: end; font-size: 58px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-top: 6px; white-space: nowrap; }
[data-scene="roles"] .pl span { font-size: 29px; font-weight: 550; color: var(--ink-2); line-height: 1.25; letter-spacing: -0.01em; }
[data-o="port"] [data-scene="roles"] .head { margin-bottom: 80px; padding: 0 60px; }
[data-o="port"] [data-scene="roles"] .t { font-size: 124px; }
[data-o="port"] [data-scene="roles"] .row { height: 236px; }
[data-o="port"] [data-scene="roles"] .pl { width: 620px; height: 236px; }
[data-o="port"] [data-scene="roles"] .pl b { font-size: 64px; }
[data-o="port"] [data-scene="roles"] .pl span { font-size: 32px; }
`,
    html: (o) => {
      const rows = o === "port"
        ? [ROLES.slice(0, 3), ROLES.slice(3, 6), ROLES.slice(6)]
        : [ROLES.slice(0, 5), ROLES.slice(5)];
      const title = o === "port" ? ["Для кожного", "в церкві"] : ["Для кожного в церкві"];
      return `
<div class="wrap">
  <div class="head">${TV.copy({ title, accent: "в церкві", d0: 100 })}</div>
  ${rows.map((r, i) => row(r, i % 2 ? "roles-r" : "roles-l", 450 + i * 120, o === "port" ? 700 : 900)).join("")}
</div>`;
    },
  });
})();

</script>
<script>
/* Мобільний простір — один телефон, різні люди й різні дії (дані: i18n.ts → pocket.today /
   roll; служитель — audience.screens.volunteer, тег ролі «Свій графік у телефоні»).
   Над телефоном — плашка власника, що змінюється разом з екраном. Екран перебудовується
   тричі: старе згортається, нові плитки піднімаються. Пастор відкриває Олену — знизу
   виїжджає її картка; лідер відмічає Петра й Софію (4 → 6 з 7) і зберігає явку;

(function () {

  const d = (i, k) => (i ? T[i] + 170 : T[i] + 120) + k * 60; // поява k-ї плитки на екрані i

  ];
  const faceC = (k) => (k < 6 ? [70 + (k % 3) * 126, 336 + Math.floor(k / 3) * 140] : [196, 616]);

  const leader = `

${tile(1, 1, "cntr", `<b><i class="lc" style="color:${L}">4</i> з 7</b><span>були</span>`)}

    const dd = m.tap ? m.tap + 40 : -400;
    return tile(1, 2 + Math.floor(k / 3), "mf", `

      ${ok ? `<span class="ok a-pop" style="--d:${dd + 30}ms;background:${L}">${TV.icon("check", 22, "#fff", 3.6)}</span>` : ""}</span>

${tile(1, 5, "fb", `<span class="a-outf" style="--d:${L3 + 60}ms">Зберегти явку</span>
  <span class="a-fade" style="--d:${L3 + 60}ms">${TV.icon("check", 30, "#fff", 3)}Збережено</span>`, `background:${L}`)}`;

  // ── Служитель — свій графік у телефоні
  const V = OWN[2].c, VD = "#b45309";
  const BUDU = [196, 540];
  const servant = `
${tile(2, 0, "hdr", `<b>Мій графік</b>${TV.avatar("Петро", 48)}`)}
${tile(2, 1, "slot", `
  <span class="wh">Нд, 21 квітня</span>
  <span class="tm">${TV.icon("clock", 28, VD, 2.4)}10:00</span>
  <b>Звук</b><span class="pl">Головна зала</span>
  <span class="cf">
    <span class="a-outf" style="--d:${S1 + 60}ms;background:${VD}">${TV.icon("check", 30, "#fff", 3)}Буду</span>
    <span class="a-fade" style="--d:${S1 + 60}ms;background:var(--green)">${TV.icon("check", 30, "#fff", 3)}Ви будете</span>

  <span class="sw" style="color:${VD}">Попросити заміну</span>`, `background:${tint(V, 12)}`)}`;

  </div></div>
</div>`,
    tick(t, el) {
      const n = String(4 + (t >= L1 + 60) + (t >= L2 + 60));
      const b = el.querySelector(".lc");
      if (b && b.textContent !== n) b.textContent = n;
      const enter = [W + 60, H * 0.62];
      const go = (i, taps) => {
        const start = taps[0][1] - 800, last = taps[taps.length - 1][1];
        const keys = [[start, enter[0], enter[1]]];
        taps.forEach(([pt, dd]) => { const [x, y] = at(...pt); keys.push([dd - 60, x - 10, y - 6], [dd + 150, x - 4, y - 2]); });
        keys.push([last + 800, enter[0] + 40, enter[1] + 40]);
        TV.moveCursor(el.querySelector(`#pk-c${i}`), t, { keys, show: [start, last + 740], clicks: taps.map((x) => x[1]) });
      };
      go(0, [[OLENA, P1]]);
      go(1, [[faceC(4), L1], [faceC(5), L2], [SAVE, L3]]);

<script>
/* Люди — як PeopleExplorer на сайті (people-explorer.tsx, дані — i18n.ts →
   features.mocks.people): над карткою ряд людей. Пастор натискає обличчя —
   картка розгортається з нього; далі натискає друге, третє — картка щоразу
   показує іншу людину: явку за 8 тижнів, сім'ю, групу, служіння, навчання,
   статус і відсоток заповнення. Марко — новенький: без групи й служіння;
   пастор пришпилює йому «Шукає малу групу». */
// icons: check, plus, mouse-pointer-click, heart, users-round, heart-handshake, graduation-cap, sparkles
(function () {
  const W = 880, C = "#0ea5e9";                          // MODULE_ACCENTS.people
  const tint = (p, c = C) => `color-mix(in oklab, ${c} ${p}%, #fff)`;
  const PR = [
    { name: "Андрій Пилипенко", first: "Андрій", role: "Член церкви", status: "Активний", base: 55, look: 0,
      family: [["Олена", "дружина"], ["Марко", "син"], ["Софія", "донька"]],
      group: ["Сімейна група №2", "Учасник · четвер, 19:00"], ministry: ["Зустріч гостей", "Наступне — нд, 21 квітня"],
      learning: ["Основи віри", 80, "8 з 10 уроків"], att: [1, 1, 0, 1, 1, 1, 1, 1], pins: ["Хоче служити"],
      bank: ["Бажає вивчати Біблію", "Шукає малу групу"] },
    { name: "Олена Ковальчук", first: "Олена", role: "Лідер групи", status: "Активна", base: 70, look: 1,
      family: [["Андрій", "чоловік"]],
      group: ["Молодіжна група", "Лідер · субота, 17:00"], ministry: ["Прославлення", "Вокал · нд, 10:00"],
      learning: ["Школа лідерів", 100, "Завершено"], att: [1, 1, 1, 1, 1, 0, 1, 1], pins: ["Хоче служити"],
      bank: ["Бажає вивчати Біблію", "Шукає малу групу"] },
    { name: "Марко Лис", first: "Марко", role: "Новенький", status: "Гість", base: 30, look: 2,
      family: [], group: null, ministry: null,
      learning: ["Основи віри", 20, "2 з 10 уроків"], att: [0, 0, 0, 0, 0, 1, 1, 1], pins: ["Перший візит"],
      bank: ["Шукає малу групу", "Бажає вивчати Біблію"] },
  ];
  // Ще двоє з того ж демо (content/modules/people.ts → mock.items) — щоб ряд читався як «багато людей».
  const MORE = [["Наталя", "Член церкви", null], ["Марія", "Гість", 5]];
  const FACE = (first) => { const i = PR.findIndex((p) => p.first === first); return i >= 0 ? TV.LOOKS[PR[i].look] : null; };

  // ── час: кліки пастора ≥ 1,5 с один від одного, кожна людина стоїть ≥ 2 с
  const CL = [1800, 5000, 8200], CP = 10400;
  const OUT = [CL[1], CL[2], 99999];
  // Заповненість — формула сайту: base + (100 − base) · додані / (6 − пришпилені).
  const DONE3 = Math.round(PR[2].base + (100 - PR[2].base) * (1 / 5));
  const RING = [[CL[0] + 250, PR[0].base], [CL[1] + 200, PR[1].base], [CL[2] + 200, PR[2].base], [CP + 60, DONE3]];

  // ── геометрія (px макета)
  const TILE_Y = 68, TILE_H = 176, TG = 14, TW = (W - TG * 4) / 5;
  const faceX = (i) => i * (TW + TG) + TW / 2, FACE_Y = TILE_Y + 16 + 40;
  const CY = 264, PAD = 26, IN = W - PAD * 2, CH = 746;
  const BW = (IN - 14) / 2, BH = 168, BY = 262;
  const PIN_Y = CY + 694, PIN_X = PAD + 280;

  const chip = (txt, c, bg) => `<span class="chip" style="color:${c};background:${bg}">${txt}</span>`;
  const box = (x, y, icon, col, label, body, d, empty) => `
<div class="bx a-up ${empty ? "empty" : ""}" style="left:${x}px;top:${y}px;width:${BW}px;height:${BH}px;--d:${d}ms">
  <div class="lb"><span class="lbi" style="background:${tint(14, col)};color:${col}">${TV.icon(icon, 20, "currentColor", 2.4)}</span>${label}</div>${body}
</div>`;

  function layer(p, i, t0) {
    const guest = p.status === "Гість";
    const fam = p.family.length
      ? `<div class="fam">${p.family.map(([n, rel], k) => {
        const lk = FACE(n);
        const face = lk ? TV.avatar(lk, 44) : `<span class="letter">${n[0]}</span>`;
        return `<div class="fm a-pop" style="--d:${t0 + 330 + k * 70}ms">${face}<b>${n}</b><small>${rel}</small></div>`;
      }).join("")}</div>`
      : `<div class="none">Ще не вказано</div>`;
    const two = (v, none) => v ? `<div class="big">${v[0]}</div><div class="sub">${v[1]}</div>` : `<div class="none">${none}</div>`;
    const [ln, pct, lm] = p.learning;
    const learn = `<div class="big">${ln}</div><div class="bar"><i style="width:${pct}%;--d:${t0 + 520}ms"></i></div><div class="sub">${lm}<b>${pct}%</b></div>`;
    const present = p.att.reduce((a, b) => a + b, 0);
    return `
<div class="ly" style="--d:${OUT[i] + 30}ms">
  <div class="hd a-up" style="--d:${t0}ms">${TV.avatar(TV.LOOKS[p.look], 92)}
    <div class="nm"><h3>${p.name}</h3><div class="chips">${guest ? chip(p.status, "var(--ink-2)", "var(--surface-3)") : chip(p.status, "#0e7a3c", "#e3f6ea")}${chip(p.role, C, tint(13))}</div></div>
  </div>
  <div class="sec a-fade" style="top:144px;--d:${t0 + 100}ms"><span>Відвідуваність за 8 тижнів</span><span><b>${present}</b> з 8</span></div>
  <div class="weeks">${p.att.map((a, k) => `<span class="wk ${a ? "" : "miss"} a-pop" style="--d:${t0 + 140 + k * 40}ms">${a ? TV.icon("check", 28, "#fff", 3) : ""}</span>`).join("")}</div>
  ${box(PAD, BY, "heart", "#f05b8b", "Сім'я", fam, t0 + 240, !p.family.length)}
  ${box(PAD + BW + 14, BY, "users-round", "#007aff", "Мала група", two(p.group, "Ще без групи"), t0 + 300, !p.group)}
  ${box(PAD, BY + BH + 14, "heart-handshake", "#8b5bf0", "Служіння", two(p.ministry, "Ще не служить"), t0 + 360, !p.ministry)}
  ${box(PAD + BW + 14, BY + BH + 14, "graduation-cap", "#12a150", "Навчання", learn, t0 + 420, false)}
  <div class="sec a-fade" style="top:630px;justify-content:flex-start;gap:10px;--d:${t0 + 480}ms">${TV.icon("sparkles", 24, C, 2.2)}Прагнення та потреби</div>
  <div class="pins a-up" style="--d:${t0 + 520}ms">
    ${p.pins.map((x) => `<span class="pn on">${TV.icon("check", 20, "#fff", 3)}${x}</span>`).join("")}
    ${p.bank.map((x, k) => `<span class="pn">${TV.icon("plus", 20, "currentColor", 3)}${x}${i === 2 && k === 0 ? `<span class="pn on fill a-pop" style="--d:${CP + 40}ms">${TV.icon("check", 20, "#fff", 3)}${x}</span>` : ""}</span>`).join("")}
  </div>
</div>`;
  }

  const tiles = [...PR.map((p, i) => [p.first, p.role, p.look, i]), ...MORE.map(([n, r, lk]) => [n, r, lk, -1])].map(([n, r, lk, i], k) => `
<div class="tl a-up" style="left:${k * (TW + TG)}px;--d:${420 + k * 70}ms">
  ${i >= 0 ? `<span class="sel a-fade" style="--d:${CL[i] + 20}ms"><span class="a-outf" style="--d:${OUT[i] + 20}ms"></span></span>` : ""}
  <span class="fc">${TV.avatar(lk == null ? n : TV.LOOKS[lk], 80)}</span><b>${n}</b><small>${r}</small>
</div>`).join("");

  // Курсор зникає між кліками й повертається до наступного обличчя.
  const WIN = [[800, CL[0] + 520], [CL[1] - 900, CL[1] + 520], [CL[2] - 900, CL[2] + 520], [CP - 1000, CP + 640]];
  const fx = (i) => faceX(i) - 10, fy = FACE_Y - 6;
  const KEYS = [
    [800, 400, 400], [CL[0] - 40, fx(0), fy], [CL[0] + 520, fx(0) + 50, fy - 60],
    [CL[1] - 900, fx(1) + 70, fy - 70], [CL[1] - 40, fx(1), fy], [CL[1] + 520, fx(1) + 50, fy - 60],
    [CL[2] - 900, fx(2) + 70, fy - 70], [CL[2] - 40, fx(2), fy], [CL[2] + 520, fx(2) + 50, fy - 60],
    [CP - 1000, PIN_X + 140, PIN_Y + 110], [CP - 40, PIN_X - 10, PIN_Y - 6], [CP + 640, PIN_X + 50, PIN_Y + 70],
  ];

  const S = '[data-scene="people"]';
  TV.scene({
    id: "people",
    dur: 14000,
    bg: "light",
    css: `
${S} .mock { position: relative; width: ${W}px; height: ${CY + CH + 4}px; --vs: 1; --vs-port: 1.02; }
${S} .hint { position: absolute; left: 50%; top: 0; transform: translateX(-50%); height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 24px 0 18px;
  border-radius: 999px; background: #fff; box-shadow: 0 0 0 1.5px var(--hairline-strong), 0 12px 28px -14px rgba(0,50,120,0.4); font-size: 23px; font-weight: 600; white-space: nowrap; }
${S} .hint.a-down { animation-name: people-hint; }
@keyframes people-hint { from { opacity: 0; transform: translate(-50%, -30px); } }
${S} .hint-out { position: absolute; inset: 0; animation: a-outf 300ms var(--e-std) ${CL[0]}ms both; }
${S} .tl { position: absolute; top: ${TILE_Y}px; width: ${TW}px; height: ${TILE_H}px; border-radius: 24px; background: #fff;
  box-shadow: 0 0 0 1.5px var(--hairline), 0 10px 24px -16px rgba(0,40,90,0.35); display: flex; flex-direction: column; align-items: center; padding-top: 16px; }
${S} .tl .sel { position: absolute; inset: -3px; border-radius: 27px; }
${S} .tl .sel > span { position: absolute; inset: 0; border-radius: 27px; box-shadow: 0 0 0 4px ${C}, 0 18px 36px -14px ${tint(80)}; background: ${tint(8)}; }
${S} .tl .fc { position: relative; border-radius: 50%; }
${S} .tl b { position: relative; margin-top: 10px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
${S} .tl small { position: relative; margin-top: 4px; font-size: 20px; color: var(--ink-3); white-space: nowrap; }
${S} .card { position: absolute; left: 0; top: ${CY}px; width: ${W}px; height: ${CH}px; border-radius: 30px;
  transform-origin: 0 0; animation: people-open 700ms var(--e-emph) ${CL[0] + 30}ms both; }
/* Картка розгортається з обличчя Андрія (container transform). */
@keyframes people-open {
  0% { opacity: 0; border-radius: 50%; transform: translate(${faceX(0) - 40}px, ${FACE_Y - 40 - CY}px) scale(${(80 / W).toFixed(4)}, ${(80 / CH).toFixed(4)}); }
  12% { opacity: 1; }
  100% { opacity: 1; border-radius: 30px; transform: none; }
}
${S} .ly { position: absolute; inset: 0; animation: a-outf 280ms var(--e-std) var(--d) both; }
${S} .hd { position: absolute; left: ${PAD}px; right: 150px; top: 28px; height: 96px; display: flex; align-items: center; gap: 22px; }
${S} .hd .avatar { box-shadow: 0 0 0 5px #fff, 0 0 0 7px ${tint(35)}; }
${S} .nm { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
${S} .nm h3 { font-size: 38px; font-weight: 780; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
${S} .chips { display: flex; gap: 10px; }
${S} .chip { font-size: 21px; font-weight: 650; padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
${S} .ring { position: absolute; right: ${PAD}px; top: 24px; width: 104px; height: 104px; }
${S} .ring svg { display: block; }
${S} .ring circle { fill: none; stroke-width: 10; }

  const MV = [[3900, 4700], [7300, 8100], [10000, 10700]];  // два перенесення Олени і крок системи
  const AT = [ARR, MV[0][1], MV[1][1], MV[2][1]];        // прибуття на етап
  const AUTO = AT.map((t) => t + 300);                   // автоматичний крок етапу
  const MEMBER = AT[3], BANNER = MEMBER + 300;

  // ── геометрія: альбом — колонки, портрет — рядки
  const G = {
    land: (() => {
      const W = 900, LG = 12, LW = (W - LG * 3) / 4, CW = LW - 24, CH = 232;
      const x = (i) => i * (LW + LG);
      return {
        W, H: 800, CW, CH, vertical: false,
        lane: (i) => ({ left: x(i), top: 70, width: LW, height: 606 }),
        node: (i) => [x(i) + LW / 2, 118],
        name: (i) => ({ left: x(i), top: 152, width: LW, height: 34, textAlign: "center" }),
        card: (i) => [x(i) + 12, 206],
        auto: (i) => ({ left: x(i) + 8, top: 470, width: LW - 16, height: 192 }),
        grab: [CW - 34, 30],                             // правий верхній кут картки: бірка курсора — у сусідній порожній колонці
        banner: 704,
      };
    })(),
    port: (() => {
      const W = 880, RH = 206, RG = 14, CW = 296, CH = 186;
      const y = (i) => 70 + i * (RH + RG);
      return {
        W, H: 1060, CW, CH, vertical: true,
        lane: (i) => ({ left: 0, top: y(i), width: W, height: RH }),
        node: (i) => [46, y(i) + RH / 2],
        name: (i) => ({ left: 86, top: y(i) + RH / 2 - 17, width: 170, height: 34, textAlign: "left" }),
        card: (i) => [254, y(i) + 10],
        auto: (i) => ({ left: 564, top: y(i) + 14, width: 302, height: RH - 28 }),
        grab: [34, CH - 30],                             // лівий нижній кут: бірка — під карткою, у порожньому наступному рядку
        banner: 964,
      };
    })(),
  };
  const px = (o) => Object.entries(o).map(([k, v]) => `${k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase())}:${typeof v === "number" ? v + "px" : v}`).join(";");

  function geo(o) {
    const g = G[o];
    if (g.KEYS) return g;
    const tip = (i) => { const [cx, cy] = g.card(i); return [cx + g.grab[0] - 10, cy + g.grab[1] - 6]; };
    const away = g.vertical ? [20, 150] : [90, 170];     // звідки курсор підходить: з порожнього місця
    const k = (t, i, dx = 0, dy = 0) => [t, tip(i)[0] + dx, tip(i)[1] + dy];
    g.KEYS = [
      k(MV[0][0] - 700, 0, ...away),
      k(MV[0][0] - 40, 0), k(MV[0][1] - 40, 1), k(MV[0][1] + 460, 1, 16, 16),
      k(MV[1][0] - 700, 1, ...away),
      k(MV[1][0] - 40, 1), k(MV[1][1] - 40, 2), k(MV[1][1] + 460, 2, 16, 16),
    ];
    g.WIN = [[MV[0][0] - 700, MV[0][1] + 460], [MV[1][0] - 700, MV[1][1] + 460]];
    return g;
  }

  const S = '[data-scene="onboarding"]';
  TV.scene({
    id: "onboarding",
    dur: 14000,
    bg: "light",
    css: `
${S} .mock { position: relative; --vs: 1; --vs-port: 1.02; }
${S} .hd { position: absolute; left: 6px; top: 8px; height: 44px; display: flex; align-items: center; gap: 12px; font-size: 23px; font-weight: 600; color: var(--ink-3); }
${S} .lane { position: absolute; border-radius: 26px; background: var(--surface-3); }
${S} .lane .on { position: absolute; inset: 0; border-radius: 26px; background: ${tint(9)}; box-shadow: inset 0 0 0 2.5px ${tint(40)}; }
${S} .lane .on.ok { background: #eefaf2; box-shadow: inset 0 0 0 2.5px rgba(18,161,80,0.45); }
${S} .rail { position: absolute; z-index: 1; background: rgba(0,0,0,0.1); border-radius: 3px; }
${S} .rail i { position: absolute; inset: 0; border-radius: 3px; background: ${C}; animation: onb-rail var(--t) cubic-bezier(0.65, 0, 0.35, 1) var(--d) both; }
${S} .rail.h i { transform-origin: 0 50%; } ${S} .rail.v i { transform-origin: 50% 0; }
@keyframes onb-rail { from { transform: scale(var(--sx, 1), var(--sy, 1)); } }
${S} .node { position: absolute; z-index: 2; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.14);
  display: flex; align-items: center; justify-content: center; font-size: 23px; font-weight: 750; color: var(--ink-3); }
${S} .node .f { position: absolute; inset: 0; border-radius: 50%; background: ${C}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #fff; }
${S} .node .f.ok { background: var(--green); }
${S} .sn { position: absolute; font-size: 25px; font-weight: 750; letter-spacing: -0.02em; line-height: 34px; white-space: nowrap; color: var(--ink); }
${S} .auto { position: absolute; border-radius: 20px; background: #fff; box-shadow: 0 0 0 2px ${tint(35)}, 0 14px 30px -18px rgba(60,30,160,0.45);
  display: flex; align-items: center; gap: 14px; padding: 0 16px; }
${S} .auto.col { flex-direction: column; justify-content: center; text-align: center; padding: 0 10px; gap: 14px; }
${S} .auto .zp { flex: none; width: 56px; height: 56px; border-radius: 50%; background: ${C}; display: flex; align-items: center; justify-content: center; }
${S} .auto .at { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.22; color: var(--ink); }
${S} .auto .ck { position: absolute; right: -10px; top: -10px; width: 38px; height: 38px; border-radius: 50%; background: var(--green);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #fff; }
${S} .me { position: absolute; z-index: 10; }
${S} .me .cd { position: absolute; inset: 0; border-radius: 22px; background: #fff; box-shadow: 0 0 0 3px ${C}, 0 18px 36px -16px rgba(60,30,160,0.5); }
${S} .me .cd.ok { box-shadow: 0 0 0 3px var(--green), 0 18px 36px -16px rgba(18,161,80,0.55); }
${S} .me .body { position: absolute; inset: 0; }
${S} .me .avatar { position: absolute; }
${S} .me .nm { position: absolute; font-size: 28px; font-weight: 750; letter-spacing: -0.02em; line-height: 34px; }
${S} .me .dots { position: absolute; display: flex; align-items: center; gap: 7px; }
${S} .me .dots i { width: 15px; height: 15px; border-radius: 50%; background: ${tint(24)}; }
${S} .me .dots span { margin-left: 6px; font-size: 21px; font-weight: 750; color: ${C}; white-space: nowrap; font-variant-numeric: tabular-nums; }
${S} .member { position: absolute; left: 50%; height: 80px; display: flex; align-items: center; gap: 16px; padding: 0 34px 0 12px; border-radius: 999px;
  background: var(--green); color: #fff; font-size: 30px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; transform: translateX(-50%);
  box-shadow: 0 20px 40px -18px rgba(18,161,80,0.7); z-index: 12; }
${S} .member .avatar { box-shadow: 0 0 0 3px rgba(255,255,255,0.6); }
${S} .member.a-pop { animation-name: onb-member; }
@keyframes onb-member { from { opacity: 0; transform: translateX(-50%) scale(0.7); } }
`,
    html: (o) => {
      const g = geo(o);
      const lanes = STAGES.map(([name, auto], i) => {
        const last = i === 3;
        const [nx, ny] = g.node(i);
        const a = g.auto(i);
        return `
<div class="lane a-up" style="${px(g.lane(i))};--d:${420 + i * 90}ms"><span class="on ${last ? "ok" : ""} a-fade" style="--d:${AT[i]}ms"></span></div>
<span class="node a-pop" style="left:${nx}px;top:${ny}px;--d:${520 + i * 90}ms">${i + 1}<span class="f ${last ? "ok" : ""} a-pop" style="--d:${AT[i] + 60}ms">${TV.icon("check", 26, "#fff", 3.2)}</span></span>
<span class="sn a-fade" style="${px(g.name(i))};--d:${560 + i * 90}ms">${name}</span>
<div class="auto ${g.vertical ? "" : "col"} a-up" style="${px(a)};--d:${AUTO[i]}ms">
  <span class="zp">${TV.icon("zap", 28, "#fff", 2.4)}</span><span class="at">${auto}</span>
  <span class="ck a-pop" style="--d:${AUTO[i] + 260}ms">${TV.icon("check", 22, "#fff", 3.4)}</span>
</div>`;
      }).join("");
      // Рейка між вузлами: кожен відрізок заповнюється, поки картка їде.
      const rails = [0, 1, 2].map((i) => {
        const [x1, y1] = g.node(i), [x2, y2] = g.node(i + 1);
        const box = g.vertical ? { left: x1 - 3, top: y1, width: 6, height: y2 - y1 } : { left: x1, top: y1 - 3, width: x2 - x1, height: 6 };
        return `<span class="rail ${g.vertical ? "v" : "h"} a-fade" style="${px(box)};--d:500ms"><i style="${g.vertical ? "--sy:0" : "--sx:0"};--d:${MV[i][0]}ms;--t:${MV[i][1] - MV[i][0]}ms"></i></span>`;
      }).join("");
      const [cx, cy] = g.card(0);
      const card = g.vertical
        ? `${TV.avatar(MARIA, 88).replace("<svg ", '<svg style="left:18px;top:18px" ')}
           <span class="nm" style="left:124px;top:22px">Марія<br>Іщенко</span>
           <span class="dots" style="left:124px;top:128px">${"<i></i>".repeat(5)}<span class="st">1 з 5</span></span>`
        : `${TV.avatar(MARIA, 96).replace("<svg ", `<svg style="left:${(g.CW - 96) / 2}px;top:18px" `)}
           <span class="nm" style="left:0;right:0;top:122px;text-align:center">Марія<br>Іщенко</span>
           <span class="dots" style="left:0;right:0;justify-content:center;top:196px">${"<i></i>".repeat(5)}<span class="st">1 з 5</span></span>`;
      return `
<div class="split${o === "port" ? "" : " flip"}">
  ${TV.copy({ title: "Онбординг", line: "Новенький не губиться між першим візитом і членством." })}
  <div class="vis"><div class="mock" style="width:${g.W}px;height:${g.H}px">
    <div class="hd a-fade" style="--d:300ms">${TV.icon("user-plus", 26, "currentColor", 2.2)}12 новеньких за місяць</div>
    ${lanes}${rails}
    <div class="me" id="ob-me" style="left:${cx}px;top:${cy}px;width:${g.CW}px;height:${g.CH}px">
      <div class="a-pop" style="position:absolute;inset:0;--d:${ARR}ms">
        <span class="cd"></span><span class="cd ok a-fade" style="--d:${MEMBER}ms"></span>
        <div class="body">${card}</div>
      </div>
    </div>
    <div class="member a-pop" style="top:${g.banner}px;--d:${BANNER}ms">${TV.avatar(MARIA, 56)}Марія Іщенко — член церкви</div>
    ${[0, 1].map((m) => TV.tap(g.card(m)[0] + g.grab[0], g.card(m)[1] + g.grab[1], MV[m][0], "#f05b8b")
      + TV.tap(g.card(m + 1)[0] + g.grab[0], g.card(m + 1)[1] + g.grab[1], MV[m][1], "#f05b8b")).join("")}
    ${TV.cursor("Олена", "#f05b8b", "ob-cur", "Олена К.")}
  </div></div>
</div>`;
    },
    tick(t, el, o) {
      const g = geo(o);
      const cur = el.querySelector("#ob-cur");
      TV.moveCursor(cur, t, { keys: g.KEYS, show: [0, 1e9], clicks: [MV[0][0], MV[0][1], MV[1][0], MV[1][1]] });
      if (cur) cur.style.opacity = String(Math.max(...g.WIN.map(([a, z]) => Math.min(TV.prog(t, a, a + 260, TV.ease.decel), 1 - TV.prog(t, z - 300, z, TV.ease.accel)))));
      // Картка: між кліками їде за курсором; третій крок — сама, рівною кривою.
      const me = el.querySelector("#ob-me");
      if (me) {
        const [x0, y0] = g.card(0);
        let [x, y] = g.card(0);
        for (let m = 0; m < 3; m++) {
          const [a, b] = MV[m];
          if (t >= b) [x, y] = g.card(m + 1);
          else if (t > a) {
            if (m < 2) { const p = TV.path(Math.min(t, b - 40), g.KEYS); x = p.x + 10 - g.grab[0]; y = p.y + 6 - g.grab[1]; }
            else { const p = TV.prog(t, a, b, TV.ease.inout); const [ax, ay] = g.card(2), [bx, by] = g.card(3); x = TV.mix(ax, bx, p); y = TV.mix(ay, by, p); }
            break;
          }
        }
        me.style.transform = `translate(${Math.round(x - x0)}px, ${Math.round(y - y0)}px)`;
      }
      const step = t >= MEMBER ? 5 : t >= MV[1][1] ? 4 : t >= MV[0][1] ? 3 : 1;
      const st = el.querySelector("#ob-me .st");
      const s = `${step} з 5`;
      if (st && st.textContent !== s) st.textContent = s;
      if (st) st.style.color = step === 5 ? "var(--green)" : "";
      el.querySelectorAll("#ob-me .dots i").forEach((d, i) => {
        const bg = i < step ? (step === 5 ? "var(--green)" : C) : "";
        if (d.style.background !== bg) d.style.background = bg;
      });
    },
  });
})();

</script>
<script>
/* Служіння — дошка підготовки до неділі (дані з i18n.ts → mocks.serving).
   Кожна команда закриває свою справу: курсор людини її кольору прилітає з-за
   краю, ставить галочку і гасне. Лічильник 2 → 6, салют — «Усе готове до неділі». */
// icons: book-open, music, sliders-horizontal, camera, coffee, hand-heart, check, clock
(function () {
  const W = 880, PAD = 24, GAP = 16, CW = (W - PAD * 2 - GAP) / 2;
  const TEAMS = [
    { kind: "sermon", icon: "book-open", c: "#007aff", who: "Пастор Іван", title: "Дописати проповідь і залити слайди", due: "до сб, 20:00", chips: ["Слайди 12"], done: true, x: PAD, y: 100, w: W - PAD * 2, h: 164 },
    { kind: "worship", icon: "music", c: "#f05b8b", who: "Олена", title: "Зібрати сет і відрепетирувати", due: "до сб, 18:00", chips: ["Ти вірний", "Величний Бог"], x: PAD, y: 280, w: CW, h: 196, click: 2000, from: [-160, 980] },
    { kind: "sound", icon: "sliders-horizontal", c: "#8b5bf0", who: "Дмитро", title: "Налаштувати пульт, саундчек", due: "нд, 9:00", chips: ["4 мікрофони"], x: PAD + CW + GAP, y: 280, w: CW, h: 196, click: 3500, from: [1080, 120] },
    { kind: "photo", icon: "camera", c: "#0ea5e9", who: "Оксана", title: "Зарядити камери, план зйомки", due: "до сб, 21:00", chips: [], x: PAD, y: 492, w: CW, h: 160, click: 5000, from: [260, 1000] },
    { kind: "cafe", icon: "coffee", c: "#f59e0b", who: "Ірина", title: "Купити каву на 60 чашок", due: "до сб, 12:00", chips: [], done: true, x: PAD + CW + GAP, y: 492, w: CW, h: 160 },
    { kind: "order", icon: "hand-heart", c: "#12a150", who: "Василь", title: "Прибрати залу, четверо на вхід", due: "нд, 8:30", chips: [], x: PAD, y: 668, w: W - PAD * 2, h: 108, click: 6500, from: [1060, 900] },
  ];
  const H = 800;
  const ALL = 6500 + 380;
  const clicks = TEAMS.filter((t) => t.click);
  const tint = (c, p) => `color-mix(in oklab, ${c} ${p}%, #fff)`;

  function tile(t, i) {
    const d = t.click ? t.click + 60 : 0;
    // Готова з самого початку — стан «після» стоїть одразу; решта перемикається в мить кліку.
    const was = t.done ? `style="--d:-400ms"` : `style="--d:${d}ms"`;
    const now = t.done ? "" : "a-fade";
    const chips = t.chips.map((c) => `<span class="chip" style="color:${t.c};background:${tint(t.c, 12)}">${TV.esc(c)}</span>`).join("")
      + (t.more ? `<span class="more">${t.more}</span>` : "");
    return `
<div class="tile a-up" style="left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px;--d:${420 + i * 70}ms">
  <div class="done-bg ${now}" style="--d:${d}ms"></div>
  <div class="row">
    <span class="box"><span class="box on ${t.done ? "" : "a-pop"}" style="--d:${d}ms">${TV.icon("check", 24, "#fff", 3.2)}</span></span>
    <div class="ttl"><span class="a-outf" ${was}>${TV.esc(t.title)}</span><span class="struck ${now}" style="--d:${d}ms">${TV.esc(t.title)}</span></div>
    <span class="badge" style="background:${tint(t.c, 14)};color:${t.c}">${TV.icon(t.icon, 24, "currentColor", 2.2)}</span>
  </div>
  ${chips ? `<div class="chips">${chips}</div>` : ""}
  <div class="who">${TV.avatar(t.who.replace("Пастор ", ""), 38)}<span>${TV.esc(t.who)}</span>
    <span class="due">${TV.icon("clock", 20, "currentColor", 2.2)}<span class="a-outf" ${was}>${t.due}</span><span class="due-on ${now}" style="--d:${d}ms">${t.due}</span></span>
  </div>
</div>`;
  }

  // Салют із центру дошки, коли готові всі (як на сайті).
  const CONF = ["#f97316", "#12a150", "#007aff", "#f05b8b", "#8b5bf0", "#0ea5e9"];
  const confetti = Array.from({ length: 36 }, (_, i) => {
    const a = (i / 36) * Math.PI * 2 + (i % 5) * 0.13;
    const reach = 240 + (i % 4) * 70;
    return `<i style="background:${CONF[i % 6]};width:${10 + (i % 3) * 4}px;height:${18 + (i % 4) * 6}px;--dx:${Math.cos(a) * reach * 1.4}px;--dy:${Math.sin(a) * reach + 140}px;--spin:${(420 + (i % 6) * 170) * (i % 2 ? -1 : 1)}deg;--d:${ALL + 40 + (i % 4) * 50}ms;--t:${1300 + (i % 5) * 160}ms"></i>`;
  }).join("");

  TV.scene({
    id: "ministries",
    dur: 10000,
    bg: "light",
    css: `
[data-scene="ministries"] .mock { position: relative; width: ${W}px; height: ${H}px; --vs: 1; --vs-port: 1.02; }
[data-scene="ministries"] .board { position: absolute; inset: 0; }
[data-scene="ministries"] .head { position: absolute; left: 0; right: 0; top: 0; height: 80px; display: flex; align-items: center; padding: 0 32px;
  border-bottom: 1px solid var(--hairline); font-size: 27px; font-weight: 650; letter-spacing: -0.01em; }
[data-scene="ministries"] .head .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--orange); margin-right: 16px; position: relative; }
[data-scene="ministries"] .head .dot i { position: absolute; inset: 0; border-radius: 50%; background: var(--green); }
[data-scene="ministries"] .ready { margin-left: auto; position: relative; font-size: 24px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
[data-scene="ministries"] .ready b { color: var(--ink); font-weight: 700; }
[data-scene="ministries"] .allok { position: absolute; right: 22px; top: 16px; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 22px 0 16px;
  border-radius: 999px; background: var(--green); color: #fff; font-size: 23px; font-weight: 650; white-space: nowrap; }
[data-scene="ministries"] .tile { position: absolute; border-radius: 22px; background: var(--surface-2); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.09);
  display: flex; flex-direction: column; padding: 20px 20px 16px 22px; }
[data-scene="ministries"] .done-bg { position: absolute; inset: 0; border-radius: 22px; background: #f3fbf6; box-shadow: inset 0 0 0 2.5px rgba(18,161,80,0.5); }
[data-scene="ministries"] .row { position: relative; display: flex; align-items: flex-start; gap: 16px; }
[data-scene="ministries"] .box { position: relative; flex: none; margin-top: 1px; width: 34px; height: 34px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 2.5px rgba(0,0,0,0.18); }
[data-scene="ministries"] .box.on { position: absolute; inset: 0; margin: 0; background: var(--green); box-shadow: none; display: flex; align-items: center; justify-content: center; }
[data-scene="ministries"] .ttl { position: relative; flex: 1; font-size: 26px; line-height: 1.25; font-weight: 650; letter-spacing: -0.015em; }
[data-scene="ministries"] .ttl span { display: block; }
[data-scene="ministries"] .ttl .struck { position: absolute; inset: 0; color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 2px; }
[data-scene="ministries"] .badge { flex: none; width: 48px; height: 48px; margin: -4px 0 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
[data-scene="ministries"] .chips { position: relative; margin: 10px 0 0 50px; display: flex; gap: 10px; align-items: center; white-space: nowrap; overflow: hidden; }
[data-scene="ministries"] .chip { font-size: 20px; font-weight: 600; padding: 6px 14px; border-radius: 999px; }

        pk.style.opacity = String(vis);

      }
    },
  });

          k1(...TAP[1], T.tick[1] - 40), k1(TAP[1][0] + 4, TAP[1][1] + 6, T.tick[1] + 300), k1(...TAP[2], T.btn - 40), k1(TAP[2][0] + 4, TAP[2][1] + 6, T.btn + 360)],
        show: [T.tick[0] - 700, T.btn + 420], clicks: [...T.tick, T.btn],
      });
      // Учителька натискає «Віддати дитину».
      TV.moveCursor(el.querySelector("#kt-c2"), t, {
        keys: [[T.give - 900, DK.x + 150, DK.y + DK.h + 50], [T.give - 40, GIVE_BTN[0] - 10, GIVE_BTN[1] - 6], [T.give + 500, GIVE_BTN[0] - 4, GIVE_BTN[1] + 10]],
        show: [T.give - 900, T.give + 560], clicks: [T.give],
      });
      // Корінець: відривається від бейджа Софії і летить у телефон мами.
      const stub = el.querySelector("#kt-stub");
      const x0 = BX + BW - STUB, y0 = B_TOP;
      const lift = TV.prog(t, T.tear, T.tear + 380, TV.ease.spring);
      if (stub) {
        stub.style.transform = `translate(${(24 * lift).toFixed(1)}px, ${(-26 * lift).toFixed(1)}px) rotate(${(7 * lift).toFixed(2)}deg)`;
        stub.style.opacity = t >= T.fly[0] ? "0" : "1";
      }
      const fly = el.querySelector("#kt-fly");
      if (fly) {
        const p = TV.prog(t, T.fly[0], T.fly[1], TV.ease.inout);
        const on = t >= T.fly[0] && t < T.fly[1] + 60;
        const ax = x0 + 24, ay = y0 - 26, bx = BUB[0] - STUB / 2, by = BUB[1] - BH / 2;
        const x = TV.mix(ax, bx, p), y = TV.mix(ay, by, p) - Math.sin(p * Math.PI) * 120;
        const sc = 1 - 0.55 * p;
        fly.style.opacity = on ? String(1 - TV.prog(t, T.fly[1] - 200, T.fly[1] + 60, TV.ease.linear)) : "0";
        fly.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(7 * (1 - p)).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
      }
    },
  });
})();

          const a = st(p.path[j]), z = st(p.path[j + 1]);

          // до фінішу — ліворуч униз.

        });

    tick(t, el) {
      const seated = TICKETS.filter((k) => t >= k.land).length;
      const n = el.querySelector(".n");
      if (n && n.textContent !== String(8 + seated)) n.textContent = 8 + seated;
      TEAMS.forEach((T, z) => {
        const c = T.seated.filter(Boolean).length + TICKETS.filter((k) => k.to[0] === z && t >= k.land).length;
        const e = el.querySelector(`.tc[data-z="${z}"]`);
        const s = `${c} з 4`;
        if (e && e.textContent !== s) e.textContent = s;
      });

      // Дмитро бере квиток Софії й несе в Загін 2, до Тетяни.
      const [sx, sy] = slotAt(...TICKETS[0].to);
      const keys = [[GRAB - 700, 700, 760], [GRAB - 60, GRAB_AT[0] - 10, GRAB_AT[1] - 6], [GRAB + 120, GRAB_AT[0] - 8, GRAB_AT[1] - 4],

      TV.moveCursor(el.querySelector("#cm-cur"), t, { keys, show: [GRAB - 700, DROP + 740], clicks: [GRAB, DROP] });

      TICKETS.forEach((k, i) => {

        if (k.drag) {
          const p = TV.path(t, keys);

          const tip = [p.x + 10, p.y + 6];

          s = 1 - 0.1 * q - 0.45 * TV.prog(t, DROP - 520, DROP - 40, TV.ease.inout);

          e.style.transformOrigin = `${GRAB_AT[0] - k.x}px ${GRAB_AT[1] - k.y}px`;
        } else {
          const q = TV.prog(t, k.fly, k.fly + FLY, TV.ease.inout);
          const [x0, y0] = center(k), [x1, y1] = slotAt(...k.to);
          const lift = -90 * 4 * q * (1 - q);
          dx = (x1 - x0) * q; dy = (y1 - y0) * q + lift;
          s = 1 - 0.8 * q;
          o = 1 - TV.prog(t, k.fly + FLY - 140, k.fly + FLY, TV.ease.linear);
        }
        const up = k.drag ? t >= GRAB : t >= k.fly;
        if (e.parentElement) e.parentElement.style.zIndex = up ? "8" : "6";
        e.style.opacity = String(o);
        e.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${s})`;
      });
    },
  });

@keyframes cal-pulse { 50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.22); } }
[data-scene="calendar"] .ring { position: absolute; border-radius: 15px; box-shadow: 0 0 0 3px ${NOW_C}; }
[data-scene="calendar"] .now { position: absolute; left: 0; right: 12px; top: 0; height: 0; }
[data-scene="calendar"] .now .all { position: absolute; left: ${GX}px; right: 0; top: -1px; height: 2px; background: rgba(239, 68, 68, 0.3); }
[data-scene="calendar"] .now .seg { position: absolute; top: -1.5px; height: 3px; background: ${NOW_C}; }
[data-scene="calendar"] .now .dot { position: absolute; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: ${NOW_C}; }
[data-scene="calendar"] .now .nowt { position: absolute; left: 4px; top: -16px; height: 32px; width: ${GX}px; z-index: 2; border-radius: 9px; background: ${NOW_C}; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
`,
    html: (o) => {
      const { PPH, CW, H } = geo(o);
      const y = (h) => GY + (h - H0) * PPH;
      const x = (d) => GX + d * CW;
      const mx = x(MINE.day) + 3, my = y(MINE.s) + 2, mw = CW - 6, mh = (MINE.e - MINE.s) * PPH - 4;
      const hours = [];
      for (let h = H0 + 1; h < H1; h++) {
        hours.push(`<div class="hr" style="top:${y(h)}px"></div>`);
        if (h % 2 === 0) hours.push(`<div class="ax" style="top:${y(h)}px">${h}:00</div>`);
      }
      const cols = DAYS.map((d, i) => `<div class="col ${i === TODAY ? "today" : ""}" style="left:${x(i)}px;width:${CW}px;height:${(H1 - H0) * PPH}px"></div>`).join("");
      const heads = DAYS.map((d, i) => `<div class="dh ${i === TODAY ? "today" : ""}" style="left:${x(i)}px;width:${CW}px"><i>${d}</i><b>${DATES[i]}</b></div>`).join("");
      const events = EV.map(([d, s, e, title, c, lines], i) => {
        const h = (e - s) * PPH - 4;
        const withTime = h >= 7 + lines * 23 + 30;
        return `<div class="ev" style="left:${x(d) + 3}px;top:${y(s) + 2}px;width:${CW - 6}px;height:${h}px;--c:${c};background:${tint(c, 16)};--d:${landAt(i)}ms">
      <b style="color:${deep(c)}">${TV.esc(title).replace(" ", "<br>")}</b>${withTime ? `<span>${hhmm(s)}</span>` : ""}</div>`;
      }).join("");
      const px = mx + 44, py = my + 12;
      return `
<div class="split">
  ${TV.copy({ title: "Календар", line: "Усе — в одному календарі." })}
  <div class="vis"><div class="mock" style="height:${H}px">
    <div class="board card a-rise" style="--d:250ms">
      <div class="head">
        <span class="ico">${TV.icon("calendar-days", 30, ACC, 2.2)}</span>
        <div><div class="h1">Календар церкви</div><div class="h2">Тиждень 14–20 вересня</div></div>
        <span class="cnt a-pop" style="--d:${D0 + 120}ms"><b class="n">0</b><span class="u">подій</span></span>
      </div>
      ${heads}
      ${cols}
      ${hours.join("")}
      <div class="now a-fade" style="--d:${N0 - 200}ms"><div class="all"></div>
        <div class="seg" style="left:${x(TODAY)}px;width:${CW}px"></div><div class="dot" style="left:${x(TODAY) - 7}px"></div><div class="nowt">15:00</div></div>
      ${events}
      <div class="ring a-fade" style="left:${mx - 4}px;top:${my - 4}px;width:${mw + 8}px;height:${mh + 8}px;--d:${LIVE}ms"></div>
      <div class="mine" style="left:${mx}px;top:${my}px;width:${mw}px">
        <b class="a-fade" style="--d:${RELEASE + 40}ms">Група<br>Андрія</b>
        <div class="tm">
          <span class="a-outf" style="--d:${LIVE}ms"><span class="a-fade" style="--d:${RELEASE + 120}ms">19:00 ${TV.icon("repeat", 18, "currentColor", 2.4)}</span></span>
          <span class="live a-pop" style="--d:${LIVE}ms"><i></i>Зараз</span>
        </div>
      </div>
    </div>
    ${TV.tap(px, py, PRESS, MINE.c)}
    ${TV.tap(px, my + mh - 10, RELEASE, MINE.c)}
    ${TV.cursor("Андрій", MINE.c, "cal-c")}
  </div></div>
</div>`;
    },
    tick(t, el, o) {
      const { PPH, CW, H } = geo(o);
      const y = (h) => GY + (h - H0) * PPH;
      const mx = GX + MINE.day * CW + 3, my = y(MINE.s) + 2, mh = (MINE.e - MINE.s) * PPH - 4;

      // Лічильник подій — скільки вже впало (плюс група Андрія).
      const n = EV.filter((_, i) => t >= landAt(i) + 220).length + (t >= RELEASE ? 1 : 0);
      const b = el.querySelector(".cnt .n"), w = el.querySelector(".cnt .u");
      if (b && b.textContent !== String(n)) { b.textContent = n; w.textContent = plural(n); }

      // Лінія «зараз».
      const now = el.querySelector(".now");
      if (now) {
        const h = nowH(t);
        now.style.transform = `translate3d(0, ${y(h)}px, 0)`;
        const lbl = now.querySelector(".nowt"), s = hhmm(Math.floor(h * 12 + 1e-6) / 12);
        if (lbl.textContent !== s) lbl.textContent = s;
      }

      // Андрій тягне блок від 19:00 до 21:00; відпустив — блок лягає пласко.
      const mine = el.querySelector(".mine");
      if (mine) {
        const grow = TV.prog(t, PRESS + 60, RELEASE, TV.ease.inout);
        mine.style.opacity = t < PRESS ? "0" : String(TV.prog(t, PRESS, PRESS + 120, TV.ease.linear));
        mine.style.height = `${TV.mix(PPH / 2 - 4, mh, grow)}px`;
        const lift = 1 - TV.prog(t, RELEASE, RELEASE + 300, TV.ease.decel);
        mine.style.boxShadow = `inset 5px 0 0 ${MINE.c}, 0 ${16 * lift}px ${32 * lift}px -14px rgba(13, 100, 90, ${0.55 * lift})`;
      }
      const px = mx + 44 - 10, py = my + 12 - 6;
      const cur = el.querySelector("#cal-c");
      TV.moveCursor(cur, t, {
        keys: [[PRESS - 800, mx + 300, H - 30], [PRESS - 60, px, py], [PRESS + 60, px, py], [RELEASE, px, my + mh - 16], [RELEASE + 500, px + 70, my + mh + 30]],
        show: [PRESS - 800, RELEASE + 560],
        clicks: [PRESS, RELEASE],
      });
      // Поки кнопка затиснута, стрілка лишається «натиснутою».
      if (cur && t > PRESS && t < RELEASE - 90) cur.firstElementChild.style.transform = "scale(0.8)";
    },
  });
})();

</script>
<script>
/* Організатор подій — квиток конференції і стіна учасників (planning.ts →
   events.mock: «Конференція «Разом»», «186 зареєстровано», учасники й типи
   квитків: Стандарт, Студент, Сімейний ×3, Волонтер; нагадування — features).
   Стіна облич наповнюється, лічильник біжить до 186; четверо реєструються
   на очах — картка з квитком летить у свою клітинку. Наприкінці хвиля:
   кожен отримав нагадування в Telegram. */
// icons: ticket, send
(function () {
  const W = 900;
  const ACC = "#f59e0b";
  const TG = "#229ed9";
  const TYPE = {
    std: { name: "Стандарт", c: "#f59e0b" },
    stu: { name: "Студент", c: "#8b5bf0" },
    fam: { name: "Сімейний", c: "#f05b8b" },
    vol: { name: "Волонтер", c: "#12a150" },
  };
  // Квиток угорі, стіна облич під ним. У портреті стіна вища — більше облич.
  const TH = 320, PW = 606;
  const WY = 350, WHEAD = 86, FS = 66, GAP = 16, COLS = 10;
  const GXF = (W - (COLS * FS + (COLS - 1) * GAP)) / 2;
  const GYF = WY + WHEAD;
  const rowsFor = (o) => (o === "port" ? 6 : 4);
  const heightFor = (o) => GYF + rowsFor(o) * FS + (rowsFor(o) - 1) * GAP + 40;
  const slot = (i) => ({ x: GXF + (i % COLS) * (FS + GAP) + FS / 2, y: GYF + Math.floor(i / COLS) * (FS + GAP) + FS / 2 });

  // Фаза 1: зареєстровані раніше — обличчя злітаються врозкид, лічильник 0 → 180.
  // Імена тут лише задають, яке намальоване обличчя стоїть у клітинці.
  const NAMES = ["Оксана", "Марко", "Ірина", "Тарас", "Наталя", "Петро", "Софія", "Ігор", "Ніна", "Олег", "Аня",
    "Василь", "Катерина", "Богдан", "Юлія", "Роман", "Галина", "Максим", "Віра", "Сергій", "Людмила", "Павло",
    "Олександра", "Денис", "Тетяна", "Микола", "Інна", "Артем", "Лариса", "Остап", "Дарина", "Євген", "Вікторія"];
  const typeOf = (i) => (i % 7 === 2 ? "stu" : i % 9 === 5 ? "fam" : i % 11 === 7 ? "vol" : "std");
  const P0 = 900, P1 = 2800, BASE = 180;

  // Фаза 2: четверо реєструються на очах (імена й квитки — з макета модуля).
  const LIVE = [
    { who: "Олена Ковальчук", type: "std", faces: ["Олена"], at: 3000 },
    { who: "Дмитро Лис", type: "stu", faces: ["Дмитро"], at: 3650 },
    { who: "Марія Іщенко", type: "fam", label: "Сімейний ×3", faces: ["Марія", "Петро", "Софія"], at: 4300 },
    { who: "Андрій Мельник", type: "vol", faces: ["Андрій"], at: 4950 },
  ];
  const LIVE_N = LIVE.reduce((a, r) => a + r.faces.length, 0);
  const TOTAL = BASE + LIVE_N; // 186
  const FLY = 1080;
  const BUBBLE = LIVE[3].at + FLY + 120;
  const WAVE = BUBBLE + 250;
  const LANE = { x: W / 2 - 90, y: WY - 14 };
  // Скільки облич уміщає стіна: останні клітинки — живі реєстрації і «+N».
  const plan = (o) => {
    const crowd = rowsFor(o) * COLS - LIVE_N - 1;
    let k = crowd;
    const slots = LIVE.map((r) => r.faces.map(() => k++));
    const pop = (i) => P0 + ((i * 7) % crowd) * ((P1 - P0 - 200) / crowd);
    return { crowd, slots, last: k, rest: TOTAL - k, pop };
  };

  const ring = (c) => `box-shadow: 0 0 0 3px #fff, 0 0 0 6px ${c}`;
  const waveAt = (i) => WAVE + ((i % COLS) + Math.floor(i / COLS)) * 45;

  function face(name, i, d, type) {
    const p = slot(i);
    return `<div class="face" style="left:${p.x - FS / 2}px;top:${p.y - FS / 2 - WY}px">
      <div class="a-pop" style="--d:${d}ms;border-radius:50%;${ring(TYPE[type].c)}">${TV.avatar(name, FS)}</div>
      <span class="tg a-pop" style="--d:${waveAt(i)}ms">${TV.icon("send", 15, "#fff", 2.6)}</span></div>`;
  }

  TV.scene({
    id: "events",
    dur: 8400,
    bg: "light",
    css: `
[data-scene="events"] .mock { position: relative; width: ${W}px; --vs: 1; --vs-port: 1; }
[data-scene="events"] .ticket { position: absolute; left: 0; top: 0; width: ${W}px; height: ${TH}px; display: flex; filter: drop-shadow(0 24px 40px rgba(10, 30, 70, 0.18)); }
[data-scene="events"] .poster { position: relative; width: ${PW}px; height: 100%; border-radius: 32px 18px 18px 32px; background: #121317; overflow: hidden; padding: 40px 44px; color: #fff;
  -webkit-mask: radial-gradient(circle 22px at 100% 0, transparent 21px, #000 22px) top / 100% 51% no-repeat, radial-gradient(circle 22px at 100% 100%, transparent 21px, #000 22px) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle 22px at 100% 0, transparent 21px, #000 22px) top / 100% 51% no-repeat, radial-gradient(circle 22px at 100% 100%, transparent 21px, #000 22px) bottom / 100% 51% no-repeat; }
[data-scene="events"] .poster .rings { position: absolute; right: -150px; top: -150px; width: 400px; height: 400px; }
[data-scene="events"] .poster .rings i { position: absolute; inset: var(--i); border-radius: 50%; border: 2px solid rgba(251, 191, 36, var(--a)); }
[data-scene="events"] .kind { position: relative; display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; color: rgba(255, 255, 255, 0.72); letter-spacing: -0.01em; }
[data-scene="events"] .name { position: relative; margin-top: 10px; font-size: 128px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; color: #fbbf24; }
[data-scene="events"] .types { position: absolute; left: 44px; right: 30px; bottom: 36px; display: flex; gap: 22px; flex-wrap: nowrap; }
[data-scene="events"] .types span { display: inline-flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 600; color: rgba(255, 255, 255, 0.78); white-space: nowrap; }
[data-scene="events"] .types i { width: 12px; height: 12px; border-radius: 50%; }
[data-scene="events"] .stub { position: relative; flex: 1; height: 100%; border-radius: 18px 32px 32px 18px; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 34px;
  -webkit-mask: radial-gradient(circle 22px at 0 0, transparent 21px, #000 22px) top / 100% 51% no-repeat, radial-gradient(circle 22px at 0 100%, transparent 21px, #000 22px) bottom / 100% 51% no-repeat;
          mask: radial-gradient(circle 22px at 0 0, transparent 21px, #000 22px) top / 100% 51% no-repeat, radial-gradient(circle 22px at 0 100%, transparent 21px, #000 22px) bottom / 100% 51% no-repeat; }
[data-scene="events"] .perf { position: absolute; left: ${PW}px; top: 30px; bottom: 30px; border-left: 3px dashed rgba(0, 0, 0, 0.14); z-index: 2; }
[data-scene="events"] .stub .ico { width: 56px; height: 56px; border-radius: 16px; background: color-mix(in oklab, ${ACC} 16%, #fff); display: flex; align-items: center; justify-content: center; }
[data-scene="events"] .stub .lbl { margin-top: 22px; font-size: 24px; font-weight: 550; color: var(--ink-3); }
[data-scene="events"] .stub .n { font-size: 104px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; margin-top: 6px; }
[data-scene="events"] .wall { position: absolute; left: 0; top: ${WY}px; width: ${W}px; bottom: 0; }
[data-scene="events"] .wall .hd { position: absolute; left: 36px; right: 28px; top: 0; height: ${WHEAD}px; display: flex; align-items: center; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
[data-scene="events"] .st { position: absolute; right: 0; top: 50%; margin-top: -25px; height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 22px 0 18px; border-radius: 999px;
  font-size: 22px; font-weight: 650; white-space: nowrap; }
[data-scene="events"] .st.open { background: var(--green-soft); color: #0e7a3c; }
[data-scene="events"] .st.open i { width: 12px; height: 12px; border-radius: 50%; background: var(--green); animation: ev-live 1400ms ease-in-out infinite; }
@keyframes ev-live { 50% { box-shadow: 0 0 0 7px rgba(18, 161, 80, 0.18); } }
[data-scene="events"] .st.sent { background: ${TG}; color: #fff; }
[data-scene="events"] .face { position: absolute; width: ${FS}px; height: ${FS}px; }
[data-scene="events"] .face .avatar { display: block; }
[data-scene="events"] .tg { position: absolute; right: -9px; bottom: -9px; width: 32px; height: 32px; border-radius: 50%; background: ${TG}; border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center; }
[data-scene="events"] .more { position: absolute; width: ${FS}px; height: ${FS}px; border-radius: 50%; background: var(--surface-3); box-shadow: inset 0 0 0 2px var(--hairline-strong);
  display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.03em; }
[data-scene="events"] .toast { position: absolute; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: 999px; background: #fff; white-space: nowrap;
  box-shadow: 0 0 0 1px var(--hairline), var(--shadow-pop); animation: ev-toast ${FLY}ms var(--e-emph) var(--d) both; }
@keyframes ev-toast {
  0% { opacity: 0; transform: translate(-50%, -50%) translate3d(0, 34px, 0) scale(0.9); }
  16% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  52% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) translate3d(var(--tx), var(--ty), 0) scale(0.2); }
}
[data-scene="events"] .toast b { font-size: 25px; font-weight: 650; letter-spacing: -0.015em; }
[data-scene="events"] .toast em { font-style: normal; font-size: 21px; font-weight: 650; padding: 7px 14px; border-radius: 999px; }
`,
    html: (o) => {
      const P = plan(o);
      const crowd = Array.from({ length: P.crowd }, (_, i) => face(NAMES[i % NAMES.length] + (i >= NAMES.length ? i : ""), i, P.pop(i), typeOf(i))).join("");
      const live = LIVE.map((r, j) => r.faces.map((n, k) => face(n, P.slots[j][k], r.at + FLY - 60 + k * 90, r.type)).join("")).join("");
      const toasts = LIVE.map((r, j) => {
        const a = slot(P.slots[j][0]), b = slot(P.slots[j][r.faces.length - 1]);
        const tx = (a.x + b.x) / 2 - LANE.x, ty = a.y - LANE.y;
        const t = TYPE[r.type];
        return `<div class="toast" style="left:${LANE.x}px;top:${LANE.y}px;--d:${r.at}ms;--tx:${tx}px;--ty:${ty}px">${TV.avatar(r.faces[0], 52)}<b>${TV.esc(r.who)}</b>
          <em style="color:color-mix(in oklab, ${t.c} 75%, #0b0b0f);background:color-mix(in oklab, ${t.c} 15%, #fff)">${TV.esc(r.label || t.name)}</em></div>`;
      }).join("");
      const more = slot(P.last);
      const types = Object.values(TYPE).map((t) => `<span><i style="background:${t.c}"></i>${t.name}</span>`).join("");
      return `
<div class="split ${o === "port" ? "" : "flip"}">
  ${TV.copy({ title: "Організатор подій", line: "Реєстрація, списки учасників і нагадування — самі." })}
  <div class="vis"><div class="mock" style="height:${heightFor(o)}px">
    <div class="ticket a-rise" style="--d:250ms">
      <div class="poster"><div class="rings">${[0, 50, 100, 150].map((i, k) => `<i style="--i:${i}px;--a:${0.1 + k * 0.07}"></i>`).join("")}</div>
        <div class="kind">${TV.icon("ticket", 26, "#fbbf24", 2.2)}Конференція</div>
        <div class="name">«Разом»</div>
        <div class="types">${types}</div>
      </div>
      <div class="perf"></div>
      <div class="stub">
        <span class="ico">${TV.icon("ticket", 30, ACC, 2.2)}</span>
        <div class="lbl">Зареєстровано</div>
        <div class="n">0</div>
      </div>
    </div>
    <div class="wall card a-rise" style="--d:420ms">
      <div class="hd">Учасники
        <span class="st open a-outf" style="--d:${WAVE}ms"><i></i>Реєстрація відкрита</span>
        <span class="st sent a-pop" style="--d:${WAVE}ms">${TV.icon("send", 22, "#fff", 2.4)}Нагадування надіслано</span>
      </div>
      ${crowd}${live}
      <div class="more a-pop" style="left:${more.x - FS / 2}px;top:${more.y - FS / 2 - WY}px;--d:${BUBBLE}ms">+${P.rest}</div>
    </div>
    ${toasts}
  </div></div>
</div>`;
    },
    tick(t, el) {
      let n = TV.count(t, P0, P1, 0, BASE, TV.ease.decel);
      LIVE.forEach((r) => r.faces.forEach((_, k) => { if (t >= r.at + FLY - 60 + k * 90) n++; }));
      const b = el.querySelector(".stub .n");
      if (b && b.textContent !== String(n)) b.textContent = n;
    },
  });
})();

</script>
<script>
/* Планування служіння — план неділі на стрічці часу (i18n.ts → servicePlanning.plan:
   «Недільне служіння», «Нд, 21 вересня · 10:00», 1:40, блоки 10:00 → 11:32,
   пісенник, «Чекає на відповідального», «План зібрано — команда бачить його в боті»).
   Кожен заповнює свою частину, по черзі: Олена кидає пісні з пісенника в
   прославлення, Дмитро вставляє відео, пастор Іван друкує тему проповіді.
   Наприкінці по готовому плану біжить курсор часу 10:00 → 11:40. */
// icons: list-checks, clock, music-4, sparkles, video, book-open, megaphone, wine, check, plus, play, search
(function () {
  const W = 900;
  const ACC = "#ea580c";
  const tint = (c, p) => `color-mix(in oklab, ${c} ${p}%, #fff)`;
  const deep = (c) => `color-mix(in oklab, ${c} 74%, #0b0b0f)`;
  const ITEMS = [
    { kind: "worship", time: "10:00", name: "Прославлення", min: 35, who: "Олена", c: "#f05b8b", icon: "music-4" },
    { kind: "prayer", time: "10:35", name: "Молитва", min: 7, who: "Андрій", c: "#8b5bf0", icon: "sparkles", value: "Молитва за місто й за нових людей" },
    { kind: "video", time: "10:42", name: "Відео", min: 5, who: "Дмитро", c: "#0ea5e9", icon: "video" },
    { kind: "sermon", time: "10:47", name: "Проповідь", min: 38, who: "Пастор Іван", c: "#007aff", icon: "book-open" },
    { kind: "announce", time: "11:25", name: "Оголошення", min: 7, who: "Марія", c: "#f59e0b", icon: "megaphone", value: "Табір, збір на ремонт, хрещення 5 жовтня" },
    { kind: "communion", time: "11:32", name: "Причастя", min: 8, who: "Пастор Іван", c: "#12a150", icon: "wine", value: "Хліб і чаша · четверо служителів на роздачу", today: true },
  ];
  const SONGS = [["Величний Бог", "G"], ["Ти вірний", "D"], ["Свята присутність", "A"], ["Алілуя", "E"]];
  const TOPIC = "«Хліб життя» · Івана 6:35";
  const face = (who) => who.replace("Пастор ", "");

  // ── хронометраж
  // Рухи швидкі, але між людьми — пауза ≥1,5 с, щоб встигнути побачити внесок кожного;
  // готовий блок підсвічується ≈1 с, курсор часу йде ≈3 с, фінал стоїть ≥2 с.
  // Спокійно: кожен хід ≈3 с — курсор підлітає ≈0,9 с, одна дія, блок світиться ≈1,5 с,
  // і лише тоді з'являється наступна людина. Курсор часу — 4 с, фінал стоїть ≥3 с.
  const O_IN = 1200, O_OPEN = 2150, O_PICK = [2900, 3600], O_CLOSE = 4000, O_OUT = 4700;
  const LAND = 430; // скільки летить пісня з пісенника в блок
  const D_IN = 5550, D_TAP = 6500, D_OUT = 7300;
  const I_IN = 8100, I_TAP = 9050, TYPE0 = 9150, TYPE1 = 10150, SLIDES = 10300, I_OUT = 11000;
  const READY = 10900, PH0 = 12350, PH1 = 16350;
  const FILL = { worship: O_PICK[0] + LAND, video: D_TAP + 60, sermon: TYPE1 };
  // Мить, коли внесок завершено, — блок підсвічується кольором власника.
  const DONE = { worship: O_PICK[O_PICK.length - 1] + LAND, video: D_TAP + 60, sermon: SLIDES };

  // ── геометрія: блоки заввишки за тривалістю (короткі — не нижчі за рядок з двох рядків)
  const HEAD = 92, FOOT = 78, PADY = 16, GAPB = 8, BX = 138, BR = 24;
  const geo = (o) => {
    const SHORT = o === "port" ? 100 : 92;
    const BODY = o === "port" ? 860 : 668;
    const shorts = ITEMS.filter((i) => i.min < 20);
    const talls = ITEMS.filter((i) => i.min >= 20);
    const tallH = BODY - shorts.length * SHORT - (ITEMS.length - 1) * GAPB;
    const tallMin = talls.reduce((a, i) => a + i.min, 0);
    let y = HEAD + PADY;
    const rows = ITEMS.map((it) => {
      const h = it.min < 20 ? SHORT : Math.round((tallH * it.min) / tallMin);
      const r = { ...it, y, h };
      y += h + GAPB;
      return r;
    });
    const end = rows[rows.length - 1];
    return { rows, H: HEAD + PADY + BODY + PADY + FOOT, top: rows[0].y, bottom: end.y + end.h };
  };
  const BW = W - BX - BR;
  const CX = 82; // лівий край тексту всередині блоку

  // Пісенник відкривається під прославленням.
  const POP = { x: 300, w: 430, head: 66, row: 60 };

  function block(r, o) {
    const pre = !!r.value;
    const at = FILL[r.kind];
    const val = (() => {
      if (r.kind === "worship") {
        return `<div class="chips">${O_PICK.map((d, k) => {
          const [n, tone] = SONGS[k];
          const cx = o === "port" ? BX + CX : BX + CX + k * 190, cy = o === "port" ? r.y + 76 + k * 46 : r.y + 76;
          return `<span class="chip" style="--d:${d}ms;--fx:${POP.x + 40 - cx}px;--fy:${popRowY(r, k) - cy}px">${n}<i>${tone}</i></span>`;
        }).join("")}</div>`;
      }
      if (r.kind === "video") return `<div class="val a-pop" style="--d:${at}ms"><span class="thumb">${TV.icon("play", 16, "#fff", 2.6)}</span>YouTube · 3:10</div>`;
      if (r.kind === "sermon") return `<div class="val topic"><span class="typed"></span><span class="a-outf" style="--d:${TYPE1 + 150}ms"><span class="caret a-fade" style="--d:${TYPE0}ms"></span></span>
        <span class="slides a-pop" style="--d:${SLIDES}ms">${TV.icon("check", 18, "currentColor", 3)}слайди додано</span></div>`;
      return `<div class="val">${TV.esc(r.value)}</div>`;
    })();
    const gone = r.kind === "sermon" ? TYPE0 : r.kind === "worship" ? O_PICK[0] : at;
    const empty = pre ? "" : `<div class="empty a-outf" style="--d:${gone}ms">${TV.icon("plus", 18, "currentColor", 2.6)}Чекає на відповідального</div>`;
    return `
<div class="blk" style="top:${r.y}px;height:${r.h}px${r.kind === "worship" ? ";z-index:3" : ""}">
  <div class="ring"></div>
  ${DONE[r.kind] ? `<div class="hl" style="--d:${DONE[r.kind]}ms;--c:${r.c}"></div>` : ""}
  <div class="fill ${pre ? "" : "a-fade"}" style="--d:${at}ms;background:${tint(r.c, 9)};box-shadow:inset 5px 0 0 ${r.c}"></div>
  <span class="ic0">${TV.icon(r.icon, 24, "rgba(11,11,15,0.38)", 2.2)}</span>
  <span class="ic1 ${pre ? "" : "a-fade"}" style="--d:${at}ms;background:${tint(r.c, 16)}">${TV.icon(r.icon, 24, r.c, 2.2)}</span>
  <div class="nm">${r.name}<small>${r.min} хв</small>${r.today ? `<em>цієї неділі</em>` : ""}</div>
  <div class="own">${TV.avatar(face(r.who), 40)}<span>${r.who}</span><b class="${pre ? "" : "a-pop"}" style="--d:${at}ms">${TV.icon("check", 14, "#fff", 3.6)}</b></div>
  <div class="r2">${empty}${r.kind === "worship" || pre ? val : `<div class="a-fade" style="--d:${r.kind === "sermon" ? TYPE0 : at}ms">${val}</div>`}</div>
</div>`;
  }
  const popTop = (r) => r.y + r.h + 6;
  const popRowY = (r, k) => popTop(r) + POP.head + POP.row * k + POP.row / 2;

  TV.scene({
    id: "service-planning",
    dur: 19900,
    bg: "light",
    css: `
[data-scene="service-planning"] .mock { position: relative; width: ${W}px; --vs: 1; --vs-port: 1; }
[data-scene="service-planning"] .board { position: absolute; inset: 0; overflow: hidden; }
[data-scene="service-planning"] .head { position: absolute; left: 0; right: 0; top: 0; height: ${HEAD}px; display: flex; align-items: center; gap: 18px; padding: 0 26px;
  border-bottom: 1px solid var(--hairline); }
[data-scene="service-planning"] .hico { width: 54px; height: 54px; border-radius: 16px; background: ${ACC}; display: flex; align-items: center; justify-content: center; }
[data-scene="service-planning"] .h1 { font-size: 29px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
[data-scene="service-planning"] .h2 { font-size: 22px; font-weight: 500; color: var(--ink-3); margin-top: 4px; }
[data-scene="service-planning"] .now { margin-left: auto; height: 48px; padding: 0 18px 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 10px;
  background: ${ACC}; color: #fff; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
[data-scene="service-planning"] .now i { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: sp-live 1200ms ease-in-out infinite; }
@keyframes sp-live { 50% { opacity: 0.35; } }

  background: var(--surface-3); font-size: 24px; font-weight: 650; color: var(--ink-2); font-variant-numeric: tabular-nums; }
[data-scene="service-planning"] .axis { position: absolute; left: 118px; width: 3px; border-radius: 2px; background: ${tint(ACC, 22)}; }
[data-scene="service-planning"] .tm { position: absolute; left: 0; width: 100px; text-align: right; font-size: 22px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
[data-scene="service-planning"] .node { position: absolute; left: 112px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.18); }
[data-scene="service-planning"] .node i { position: absolute; inset: 0; border-radius: 50%; }
[data-scene="service-planning"] .blk > .ring { position: absolute; inset: -5px; border-radius: 21px; box-shadow: 0 0 0 3px ${ACC}; opacity: 0; pointer-events: none; }
[data-scene="service-planning"] .blk { position: absolute; left: ${BX}px; width: ${BW}px; border-radius: 16px; background: var(--surface-2); box-shadow: inset 5px 0 0 rgba(0,0,0,0.14), inset 0 0 0 1px var(--hairline); }
